name: Build Image Converter JAR

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Verify JAR artifact
        run: |
          ls -lh target/*.jar
          JAR=$(ls target/*.jar | head -1)
          echo "Artifact: $JAR"
          unzip -p "$JAR" BOOT-INF/classes/static/index.html | head -c 200

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-converter-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          echo "## Build Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "JAR built and uploaded as artifact." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -lh target/*.jar >> $GITHUB_STEP_SUMMARY
