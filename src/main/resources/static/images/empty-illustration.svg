<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="frameG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="innerG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <!-- Glow background -->
  <circle cx="200" cy="200" r="180" fill="url(#glow)"/>
  <!-- Mountain shapes inside frame -->
  <g transform="translate(0,0)">
    <!-- Photo frame -->
    <rect x="80" y="100" width="240" height="200" rx="16" fill="url(#frameG)" opacity="0.9"/>
    <rect x="92" y="112" width="216" height="176" rx="8" fill="url(#innerG)"/>
    <!-- Mountain silhouettes -->
    <path d="M 100 270 L 140 220 L 170 240 L 200 200 L 230 250 L 260 215 L 300 270 Z" fill="#8b5cf6" opacity="0.4"/>
    <path d="M 100 280 L 150 250 L 180 260 L 220 230 L 260 270 L 290 250 L 300 280 Z" fill="#ec4899" opacity="0.5"/>
    <!-- Sun -->
    <circle cx="240" cy="170" r="18" fill="#fbbf24" opacity="0.7"/>
    <circle cx="240" cy="170" r="25" fill="#fbbf24" opacity="0.2"/>
  </g>
  <!-- Sparkles -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M 70 80 L 75 90 L 85 95 L 75 100 L 70 110 L 65 100 L 55 95 L 65 90 Z" opacity="0.8"/>
    <path d="M 320 70 L 323 78 L 331 81 L 323 84 L 320 92 L 317 84 L 309 81 L 317 78 Z" opacity="0.7"/>
    <path d="M 340 320 L 343 328 L 351 331 L 343 334 L 340 342 L 337 334 L 329 331 L 337 328 Z" opacity="0.6"/>
    <circle cx="60" cy="320" r="3" opacity="0.6"/>
    <circle cx="350" cy="200" r="2" opacity="0.8"/>
    <circle cx="200" cy="60" r="2" opacity="0.5"/>
  </g>
  <!-- Decorative dots -->
  <circle cx="120" cy="60" r="3" fill="#ec4899" opacity="0.6"/>
  <circle cx="280" cy="350" r="4" fill="#06b6d4" opacity="0.6"/>
  <circle cx="60" cy="200" r="2" fill="#10b981" opacity="0.5"/>
</svg>