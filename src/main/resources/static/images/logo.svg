<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="logoG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="lensG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#logoG)"/>
  <!-- Camera lens shape -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="white" stroke-width="2.5" opacity="0.95"/>
  <circle cx="32" cy="32" r="12" fill="url(#lensG)"/>
  <circle cx="32" cy="32" r="7" fill="white" opacity="0.95"/>
  <circle cx="32" cy="32" r="3" fill="url(#logoG)"/>
  <!-- Flash sparkle -->
  <circle cx="48" cy="16" r="2.5" fill="white" opacity="0.9"/>
  <circle cx="16" cy="48" r="2" fill="white" opacity="0.7"/>
</svg>