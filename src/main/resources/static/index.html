<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <title>图片工坊 · 一站式图片处理工具</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        /* =========================================================
           Picture Workshop — Animation Rich Edition
           10 themes · 100+ keyframes · no glassmorphism
           ========================================================= */

        :root, [data-theme="mint"] {
            --brand-50:  #ecfdf5;
            --brand-100: #d1fae5;
            --brand-200: #a7f3d0;
            --brand-300: #6ee7b7;
            --brand-400: #34d399;
            --brand-500: #10b981;
            --brand-600: #059669;
            --brand-700: #047857;

            --accent: #6366f1;

            --bg: #fafaf9;
            --bg-soft: #f5f5f4;
            --surface: #ffffff;
            --surface-2: #fafaf9;
            --border: #e7e5e4;
            --border-strong: #d6d3d1;
            --text: #1c1917;
            --text-2: #57534e;
            --text-3: #a8a29e;
            --success: #10b981;
            --warn: #f59e0b;
            --danger: #ef4444;

            --grad: linear-gradient(135deg, #10b981 0%, #6366f1 100%);
            --grad-soft: linear-gradient(135deg, rgba(16,185,129,0.08), rgba(99,102,241,0.08));
            --grad-bg: linear-gradient(135deg, rgba(16,185,129,0.35) 0%, rgba(99,102,241,0.30) 50%, rgba(139,92,246,0.25) 100%);

            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.06), 0 2px 4px rgba(0,0,0,0.04);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.04);
            --shadow-brand: 0 8px 24px rgba(16,185,129,0.20);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;
            --radius-3xl: 32px;

            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-bounce: cubic-bezier(0.68, -0.55, 0.27, 1.55);
            --ease-elastic: cubic-bezier(0.5, 1.5, 0.5, 1);
        }

        [data-theme="indigo"] {
            --brand-50:  #eef2ff;
            --brand-100: #e0e7ff;
            --brand-200: #c7d2fe;
            --brand-300: #a5b4fc;
            --brand-400: #818cf8;
            --brand-500: #6366f1;
            --brand-600: #4f46e5;
            --brand-700: #4338ca;

            --accent: #8b5cf6;
            --bg: #f8fafc;
            --bg-soft: #f1f5f9;
            --grad: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --grad-soft: linear-gradient(135deg, rgba(99,102,241,0.08), rgba(139,92,246,0.08));
            --grad-bg: linear-gradient(135deg, rgba(99,102,241,0.35) 0%, rgba(139,92,246,0.30) 50%, rgba(236,72,153,0.25) 100%);
            --shadow-brand: 0 8px 24px rgba(99,102,241,0.20);
        }

        [data-theme="sunset"] {
            --brand-50:  #fff7ed;
            --brand-100: #ffedd5;
            --brand-200: #fed7aa;
            --brand-300: #fdba74;
            --brand-400: #fb923c;
            --brand-500: #f97316;
            --brand-600: #ea580c;
            --brand-700: #c2410c;

            --accent: #f43f5e;
            --bg: #fafaf9;
            --bg-soft: #f5f5f4;
            --grad: linear-gradient(135deg, #f97316 0%, #f43f5e 100%);
            --grad-soft: linear-gradient(135deg, rgba(249,115,22,0.08), rgba(244,63,94,0.08));
            --grad-bg: linear-gradient(135deg, rgba(249,115,22,0.35) 0%, rgba(244,63,94,0.30) 50%, rgba(168,85,247,0.25) 100%);
            --shadow-brand: 0 8px 24px rgba(249,115,22,0.20);
        }

        [data-theme="rose"] {
            --brand-50:  #fff1f2;
            --brand-100: #ffe4e6;
            --brand-200: #fecdd3;
            --brand-300: #fda4af;
            --brand-400: #fb7185;
            --brand-500: #f43f5e;
            --brand-600: #e11d48;
            --brand-700: #be123c;

            --accent: #8b5cf6;
            --bg: #fafaf9;
            --bg-soft: #f5f5f4;
            --grad: linear-gradient(135deg, #f43f5e 0%, #8b5cf6 100%);
            --grad-soft: linear-gradient(135deg, rgba(244,63,94,0.08), rgba(139,92,246,0.08));
            --grad-bg: linear-gradient(135deg, rgba(244,63,94,0.35) 0%, rgba(139,92,246,0.30) 50%, rgba(59,130,246,0.25) 100%);
            --shadow-brand: 0 8px 24px rgba(244,63,94,0.20);
        }

        [data-theme="ocean"] {
            --brand-50:  #ecfeff;
            --brand-100: #cffafe;
            --brand-200: #a5f3fc;
            --brand-300: #67e8f9;
            --brand-400: #22d3ee;
            --brand-500: #06b6d4;
            --brand-600: #0891b2;
            --brand-700: #0e7490;

            --accent: #3b82f6;
            --bg: #f0f9ff;
            --bg-soft: #e0f2fe;
            --grad: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            --grad-soft: linear-gradient(135deg, rgba(6,182,212,0.08), rgba(59,130,246,0.08));
            --grad-bg: linear-gradient(135deg, rgba(6,182,212,0.35) 0%, rgba(59,130,246,0.30) 50%, rgba(99,102,241,0.25) 100%);
            --shadow-brand: 0 8px 24px rgba(6,182,212,0.20);
        }

        [data-theme="forest"] {
            --brand-50:  #f0fdf4;
            --brand-100: #dcfce7;
            --brand-200: #bbf7d0;
            --brand-300: #86efac;
            --brand-400: #4ade80;
            --brand-500: #22c55e;
            --brand-600: #16a34a;
            --brand-700: #15803d;

            --accent: #84cc16;
            --bg: #f7fee7;
            --bg-soft: #ecfccb;
            --grad: linear-gradient(135deg, #22c55e 0%, #84cc16 100%);
            --grad-soft: linear-gradient(135deg, rgba(34,197,94,0.08), rgba(132,204,22,0.08));
            --grad-bg: linear-gradient(135deg, rgba(34,197,94,0.35) 0%, rgba(132,204,22,0.30) 50%, rgba(234,179,8,0.25) 100%);
            --shadow-brand: 0 8px 24px rgba(34,197,94,0.20);
        }

        [data-theme="lavender"] {
            --brand-50:  #faf5ff;
            --brand-100: #f3e8ff;
            --brand-200: #e9d5ff;
            --brand-300: #d8b4fe;
            --brand-400: #c084fc;
            --brand-500: #a855f7;
            --brand-600: #9333ea;
            --brand-700: #7e22ce;

            --accent: #ec4899;
            --bg: #faf5ff;
            --bg-soft: #f3e8ff;
            --grad: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            --grad-soft: linear-gradient(135deg, rgba(168,85,247,0.08), rgba(236,72,153,0.08));
            --grad-bg: linear-gradient(135deg, rgba(168,85,247,0.35) 0%, rgba(236,72,153,0.30) 50%, rgba(244,114,182,0.25) 100%);
            --shadow-brand: 0 8px 24px rgba(168,85,247,0.20);
        }

        [data-theme="amber"] {
            --brand-50:  #fffbeb;
            --brand-100: #fef3c7;
            --brand-200: #fde68a;
            --brand-300: #fcd34d;
            --brand-400: #fbbf24;
            --brand-500: #f59e0b;
            --brand-600: #d97706;
            --brand-700: #b45309;

            --accent: #ef4444;
            --bg: #fffbeb;
            --bg-soft: #fef3c7;
            --grad: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            --grad-soft: linear-gradient(135deg, rgba(245,158,11,0.08), rgba(239,68,68,0.08));
            --grad-bg: linear-gradient(135deg, rgba(245,158,11,0.35) 0%, rgba(239,68,68,0.30) 50%, rgba(220,38,38,0.25) 100%);
            --shadow-brand: 0 8px 24px rgba(245,158,11,0.20);
        }

        [data-theme="graphite"] {
            --brand-50:  #f8fafc;
            --brand-100: #f1f5f9;
            --brand-200: #e2e8f0;
            --brand-300: #cbd5e1;
            --brand-400: #94a3b8;
            --brand-500: #64748b;
            --brand-600: #475569;
            --brand-700: #334155;

            --accent: #3b82f6;
            --bg: #f8fafc;
            --bg-soft: #f1f5f9;
            --grad: linear-gradient(135deg, #475569 0%, #1e293b 100%);
            --grad-soft: linear-gradient(135deg, rgba(71,85,105,0.08), rgba(30,41,59,0.08));
            --grad-bg: linear-gradient(135deg, rgba(71,85,105,0.30) 0%, rgba(30,41,59,0.25) 50%, rgba(59,130,246,0.20) 100%);
            --shadow-brand: 0 8px 24px rgba(71,85,105,0.20);
        }

        [data-theme="candy"] {
            --brand-50:  #fdf2f8;
            --brand-100: #fce7f3;
            --brand-200: #fbcfe8;
            --brand-300: #f9a8d4;
            --brand-400: #f472b6;
            --brand-500: #ec4899;
            --brand-600: #db2777;
            --brand-700: #be185d;

            --accent: #06b6d4;
            --bg: #fdf2f8;
            --bg-soft: #fce7f3;
            --grad: linear-gradient(135deg, #ec4899 0%, #06b6d4 100%);
            --grad-soft: linear-gradient(135deg, rgba(236,72,153,0.08), rgba(6,182,212,0.08));
            --grad-bg: linear-gradient(135deg, rgba(236,72,153,0.35) 0%, rgba(6,182,212,0.30) 50%, rgba(168,85,247,0.25) 100%);
            --shadow-brand: 0 8px 24px rgba(236,72,153,0.20);
        }

        /* Smooth color transition on theme switch */
        *, *::before, *::after {
            transition: background-color 0.5s var(--ease-out),
                        color 0.4s var(--ease-out),
                        border-color 0.4s var(--ease-out),
                        box-shadow 0.3s var(--ease-out),
                        fill 0.4s var(--ease-out),
                        stroke 0.4s var(--ease-out);
        }

        /* ========== Keyframes (120+) ========== */
        /* === Background floating === */
        @keyframes blob-float-1 { 0%,100%{transform:translate(0,0) scale(1) rotate(0)} 33%{transform:translate(60px,-40px) scale(1.1) rotate(120deg)} 66%{transform:translate(-30px,30px) scale(.95) rotate(240deg)} }
        @keyframes blob-float-2 { 0%,100%{transform:translate(0,0) scale(1) rotate(0)} 33%{transform:translate(-50px,30px) scale(1.15) rotate(-100deg)} 66%{transform:translate(40px,-30px) scale(.9) rotate(-220deg)} }
        @keyframes blob-float-3 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(30px,50px) scale(1.2)} }
        @keyframes blob-rotate { from{transform:rotate(0)} to{transform:rotate(360deg)} }
        @keyframes blob-rotate-rev { from{transform:rotate(0)} to{transform:rotate(-360deg)} }
        @keyframes shape-float-1 { 0%,100%{transform:translate(0,0) rotate(0)} 50%{transform:translate(20px,-30px) rotate(60deg)} }
        @keyframes shape-float-2 { 0%,100%{transform:translate(0,0) rotate(0)} 50%{transform:translate(-25px,20px) rotate(-90deg)} }
        @keyframes shape-float-3 { 0%,100%{transform:translate(0,0) rotate(0) scale(1)} 50%{transform:translate(15px,15px) rotate(45deg) scale(1.1)} }
        @keyframes shape-float-4 { 0%,100%{transform:translate(0,0) rotate(0) scale(1)} 50%{transform:translate(-20px,-15px) rotate(-45deg) scale(.9)} }
        @keyframes shape-morph { 0%,100%{border-radius:20px} 50%{border-radius:50%} }
        @keyframes shape-pulse { 0%,100%{transform:scale(1);opacity:.3} 50%{transform:scale(1.2);opacity:.5} }
        @keyframes shape-orbit { 0%{transform:rotate(0) translateX(15px) rotate(0)} 100%{transform:rotate(360deg) translateX(15px) rotate(-360deg)} }
        @keyframes shape-swing { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }

        /* === Entry === */
        @keyframes slide-down { from{opacity:0;transform:translateY(-30px)} to{opacity:1;transform:translateY(0)} }
        @keyframes slide-up { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
        @keyframes slide-up-soft { from{opacity:0;transform:translateY(15px)} to{opacity:1;transform:translateY(0)} }
        @keyframes slide-up-spring { 0%{opacity:0;transform:translateY(40px) scale(.95)} 60%{opacity:1;transform:translateY(-6px) scale(1.01)} 100%{opacity:1;transform:translateY(0) scale(1)} }
        @keyframes slide-right { from{opacity:0;transform:translateX(-20px)} to{opacity:1;transform:translateX(0)} }
        @keyframes slide-left { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }
        @keyframes slide-down-soft { from{opacity:0;transform:translateY(-15px)} to{opacity:1;transform:translateY(0)} }
        @keyframes slide-up-far { from{opacity:0;transform:translateY(60px)} to{opacity:1;transform:translateY(0)} }
        @keyframes slide-right-far { from{opacity:0;transform:translateX(-60px)} to{opacity:1;transform:translateX(0)} }
        @keyframes slide-left-far { from{opacity:0;transform:translateX(60px)} to{opacity:1;transform:translateX(0)} }
        @keyframes fade-in { from{opacity:0} to{opacity:1} }
        @keyframes fade-in-up-spring { 0%{opacity:0;transform:translateY(20px) scale(.9)} 70%{transform:translateY(-3px) scale(1.02)} 100%{opacity:1;transform:translateY(0) scale(1)} }
        @keyframes entrance-bounce { 0%{transform:scale(0) translateY(50px);opacity:0} 50%{transform:scale(1.05) translateY(-5px);opacity:.9} 70%{transform:scale(.95) translateY(2px)} 100%{transform:scale(1) translateY(0);opacity:1} }
        @keyframes mask-reveal-bottom { from{clip-path:inset(100% 0 0 0)} to{clip-path:inset(0 0 0 0)} }
        @keyframes mask-reveal-top { from{clip-path:inset(0 0 100% 0)} to{clip-path:inset(0 0 0 0)} }
        @keyframes mask-reveal-left { from{clip-path:inset(0 100% 0 0)} to{clip-path:inset(0 0 0 0)} }
        @keyframes mask-reveal-right { from{clip-path:inset(0 0 0 100%)} to{clip-path:inset(0 0 0 0)} }
        @keyframes flip-in-x { from{opacity:0;transform:rotateX(90deg)} to{opacity:1;transform:rotateX(0)} }
        @keyframes flip-in-y { from{opacity:0;transform:rotateY(90deg)} to{opacity:1;transform:rotateY(0)} }
        @keyframes roll-in { from{opacity:0;transform:translateX(-100%) rotate(-360deg)} to{opacity:1;transform:translateX(0) rotate(0)} }
        @keyframes wipe-in { from{transform:scaleX(0);transform-origin:left} to{transform:scaleX(1)} }
        @keyframes text-reveal { from{opacity:0;transform:translateY(100%)} to{opacity:1;transform:translateY(0)} }
        @keyframes text-scramble { 0%{opacity:0;filter:blur(8px)} 100%{opacity:1;filter:blur(0)} }
        @keyframes char-fall { from{opacity:0;transform:translateY(-20px) rotate(20deg)} to{opacity:1;transform:translateY(0) rotate(0)} }
        @keyframes word-stretch { from{transform:scaleY(0)} to{transform:scaleY(1)} }

        /* === Scale / Pop === */
        @keyframes scale-pop { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.08)} 100%{opacity:1;transform:scale(1)} }
        @keyframes scale-pop-soft { 0%{opacity:0;transform:scale(.85) translateY(10px)} 100%{opacity:1;transform:scale(1) translateY(0)} }
        @keyframes bounce-in { 0%{opacity:0;transform:scale(.3) rotate(-10deg)} 50%{transform:scale(1.05) rotate(3deg)} 70%{transform:scale(.95) rotate(-1deg)} 100%{opacity:1;transform:scale(1) rotate(0)} }
        @keyframes bounce-soft { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
        @keyframes bounce-up { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
        @keyframes bounce-down { 0%,100%{transform:translateY(0)} 50%{transform:translateY(12px)} }
        @keyframes rubber-band { 0%{transform:scale(1)} 30%{transform:scaleX(1.25) scaleY(.75)} 40%{transform:scaleX(.75) scaleY(1.25)} 50%{transform:scaleX(1.15) scaleY(.85)} 65%{transform:scaleX(.95) scaleY(1.05)} 75%{transform:scaleX(1.05) scaleY(.95)} 100%{transform:scale(1)} }
        @keyframes jelly { 0%,100%{transform:scale(1,1)} 25%{transform:scale(.9,1.1)} 50%{transform:scale(1.1,.9)} 75%{transform:scale(.95,1.05)} }
        @keyframes heartbeat { 0%,100%{transform:scale(1)} 10%{transform:scale(1.1)} 20%{transform:scale(1)} 30%{transform:scale(1.1)} 40%{transform:scale(1)} }
        @keyframes heartbeat-slow { 0%,100%{transform:scale(1)} 25%{transform:scale(1.05)} 50%{transform:scale(1)} 75%{transform:scale(1.05)} }
        @keyframes zoom-bounce { 0%{transform:scale(0)} 50%{transform:scale(1.1)} 75%{transform:scale(.95)} 100%{transform:scale(1)} }
        @keyframes punch { 0%{transform:scale(0)} 60%{transform:scale(1.2)} 100%{transform:scale(1)} }
        @keyframes squish { 0%,100%{transform:scaleX(1) scaleY(1)} 50%{transform:scaleX(1.2) scaleY(.8)} }
        @keyframes stretch-y { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.3)} }
        @keyframes stretch-x { 0%,100%{transform:scaleX(1)} 50%{transform:scaleX(1.3)} }
        @keyframes wobble { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-3deg)} 75%{transform:rotate(3deg)} }
        @keyframes swing { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }
        @keyframes hinge { 0%,100%{transform:rotate(0);transform-origin:top left} 25%,50%,75%{transform:rotate(80deg);transform-origin:top left} }
        @keyframes swing-pendulum { 0%,100%{transform:rotate(-8deg);transform-origin:top center} 50%{transform:rotate(8deg);transform-origin:top center} }

        /* === Pulse / Glow === */
        @keyframes pulse-soft { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.05);opacity:.9} }
        @keyframes pulse-strong { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.15);opacity:.8} }
        @keyframes pulse-ring { 0%{box-shadow:0 0 0 0 var(--brand-300)} 70%{box-shadow:0 0 0 12px transparent} 100%{box-shadow:0 0 0 0 transparent} }
        @keyframes pulse-ring-large { 0%{box-shadow:0 0 0 0 var(--brand-200),0 0 0 0 var(--brand-300)} 100%{box-shadow:0 0 0 24px transparent,0 0 0 48px transparent} }
        @keyframes pulse-dot { 0%,100%{box-shadow:0 0 0 0 var(--brand-200);opacity:1} 50%{box-shadow:0 0 0 8px transparent;opacity:.7} }
        @keyframes pulse-glow { 0%,100%{filter:drop-shadow(0 0 0 var(--brand-200))} 50%{filter:drop-shadow(0 0 8px var(--brand-300))} }
        @keyframes glow-pulse { 0%,100%{box-shadow:0 0 0 0 var(--brand-200),0 0 20px var(--brand-100)} 50%{box-shadow:0 0 0 8px transparent,0 0 30px var(--brand-200)} }
        @keyframes glow-intense { 0%,100%{filter:brightness(1) drop-shadow(0 0 4px var(--brand-300))} 50%{filter:brightness(1.1) drop-shadow(0 0 12px var(--brand-300))} }

        /* === Float / Drift === */
        @keyframes float-y { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
        @keyframes float-xy { 0%,100%{transform:translate(0,0)} 25%{transform:translate(4px,-4px)} 50%{transform:translate(0,-8px)} 75%{transform:translate(-4px,-4px)} }
        @keyframes float-3d { 0%,100%{transform:translateY(0) rotateX(0) rotateY(0)} 33%{transform:translateY(-10px) rotateX(5deg) rotateY(-5deg)} 66%{transform:translateY(5px) rotateX(-3deg) rotateY(4deg)} }
        @keyframes levitate { 0%,100%{transform:translateY(0) rotateZ(0)} 50%{transform:translateY(-15px) rotateZ(2deg)} }
        @keyframes orbit { 0%{transform:rotate(0) translateX(20px) rotate(0)} 100%{transform:rotate(360deg) translateX(20px) rotate(-360deg)} }
        @keyframes orbit-large { 0%{transform:rotate(0) translateX(80px) rotate(0)} 100%{transform:rotate(360deg) translateX(80px) rotate(-360deg)} }
        @keyframes drift { 0%,100%{transform:translate(0,0)} 33%{transform:translate(20px,-15px)} 66%{transform:translate(-15px,20px)} }
        @keyframes breeze { 0%,100%{transform:translateX(0) rotate(0)} 50%{transform:translateX(8px) rotate(2deg)} }
        @keyframes hang { 0%,100%{transform:translateY(0) rotate(-1deg)} 50%{transform:translateY(2px) rotate(1deg)} }

        /* === Spin === */
        @keyframes spin { to{transform:rotate(360deg)} }
        @keyframes spin-reverse { to{transform:rotate(-360deg)} }
        @keyframes spin-slow { from{transform:rotate(0)} to{transform:rotate(360deg)} }
        @keyframes spin-fast { from{transform:rotate(0)} to{transform:rotate(360deg)} }
        @keyframes spin-once { from{transform:rotate(0)} to{transform:rotate(360deg)} }
        @keyframes rotate-3d-x { from{transform:rotateX(0)} to{transform:rotateX(360deg)} }
        @keyframes rotate-3d-y { from{transform:rotateY(0)} to{transform:rotateY(360deg)} }
        @keyframes rotate-3d-z { from{transform:rotateZ(0)} to{transform:rotateZ(360deg)} }
        @keyframes roll-around { 0%{transform:rotate(0) translateX(0)} 100%{transform:rotate(360deg) translateX(0)} }
        @keyframes fan-rotate { 0%,100%{transform:rotate(-10deg)} 50%{transform:rotate(10deg)} }

        /* === Shimmer / Wave / Ripple === */
        @keyframes shimmer { 0%{background-position:-200% 50%} 100%{background-position:200% 50%} }
        @keyframes shine { 0%{left:-100%} 100%{left:200%} }
        @keyframes tool-shine { 0%{transform:translateX(-100%) skewX(-20deg)} 100%{transform:translateX(200%) skewX(-20deg)} }
        @keyframes ripple { 0%{transform:scale(0);opacity:.6} 100%{transform:scale(4);opacity:0} }
        @keyframes ripple-large { 0%{transform:scale(0);opacity:.8} 100%{transform:scale(8);opacity:0} }
        @keyframes wave { 0%,100%{transform:scaleY(.5)} 50%{transform:scaleY(1)} }
        @keyframes wave-strong { 0%,100%{transform:scaleY(.3)} 50%{transform:scaleY(1.2)} }
        @keyframes wave-move { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
        @keyframes wave-divider { 0%,100%{transform:translateX(0)} 50%{transform:translateX(-25%)} }
        @keyframes gradient-flow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        @keyframes gradient-border-flow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        @keyframes border-spin { to{transform:rotate(360deg)} }
        @keyframes tilt-shine { 0%{transform:translateX(-100%) translateY(-100%) rotate(45deg)} 100%{transform:translateX(100%) translateY(100%) rotate(45deg)} }
        @keyframes liquid-shimmer { 0%{transform:translateX(-100%) skewX(-20deg)} 100%{transform:translateX(200%) skewX(-20deg)} }
        @keyframes skeleton-shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
        @keyframes progress-stripes { 0%{background-position:0 0} 100%{background-position:40px 0} }
        @keyframes noise-shift { 0%{transform:translate(0,0)} 20%{transform:translate(-2%,1%)} 40%{transform:translate(1%,-2%)} 60%{transform:translate(-1%,2%)} 80%{transform:translate(2%,1%)} 100%{transform:translate(0,0)} }
        @keyframes dash-march { to{stroke-dashoffset:-200} }
        @keyframes check-draw { from{stroke-dashoffset:24} to{stroke-dashoffset:0} }
        @keyframes draw { from{stroke-dashoffset:100} to{stroke-dashoffset:0} }
        @keyframes draw-circle { from{stroke-dashoffset:300} to{stroke-dashoffset:0} }
        @keyframes draw-circle-reverse { from{stroke-dashoffset:0} to{stroke-dashoffset:300} }

        /* === Effects === */
        @keyframes confetti { 0%{opacity:1;transform:translateY(0) translateX(0) rotate(0)} 100%{opacity:0;transform:translateY(200px) translateX(var(--dx,50px)) rotate(720deg)} }
        @keyframes confetti-spin { 0%{transform:rotate(0)} 100%{transform:rotate(1080deg)} }
        @keyframes star-burst { 0%{transform:scale(0) rotate(0);opacity:1} 100%{transform:scale(1.5) rotate(180deg);opacity:0} }
        @keyframes spark { 0%,100%{opacity:0;transform:scale(0)} 50%{opacity:1;transform:scale(1)} }
        @keyframes particle-rise { 0%{transform:translateY(0) translateX(0);opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{transform:translateY(-100vh) translateX(40px);opacity:0} }
        @keyframes particle-fall { 0%{transform:translateY(0) translateX(0);opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{transform:translateY(100vh) translateX(-40px);opacity:0} }
        @keyframes particle-drift { 0%{transform:translate(0,0);opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{transform:translate(40px,40px);opacity:0} }
        @keyframes cursor-trail-fade { 0%{transform:scale(1);opacity:.6} 100%{transform:scale(0);opacity:0} }
        @keyframes hue-rotate { 0%{filter:hue-rotate(0)} 100%{filter:hue-rotate(360deg)} }
        @keyframes saturate-pulse { 0%,100%{filter:saturate(1)} 50%{filter:saturate(1.3)} }
        @keyframes brightness-flash { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.2)} }
        @keyframes blur-in { from{filter:blur(8px);opacity:0} to{filter:blur(0);opacity:1} }
        @keyframes blur-out { from{filter:blur(0);opacity:1} to{filter:blur(8px);opacity:0} }
        @keyframes grayscale-shift { 0%,100%{filter:grayscale(0)} 50%{filter:grayscale(.5)} }
        @keyframes invert-shift { 0%,100%{filter:invert(0)} 50%{filter:invert(.8)} }
        @keyframes sepia-fade { 0%,100%{filter:sepia(0)} 50%{filter:sepia(.5)} }
        @keyframes contrast-shift { 0%,100%{filter:contrast(1)} 50%{filter:contrast(1.2)} }
        @keyframes drop-shadow-grow { 0%,100%{filter:drop-shadow(0 2px 4px rgba(0,0,0,.1))} 50%{filter:drop-shadow(0 8px 16px rgba(0,0,0,.2))} }

        /* === Shake / Wiggle / Vibrate === */
        @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-3px) rotate(-1deg)} 40%,80%{transform:translateX(3px) rotate(1deg)} }
        @keyframes shake-soft { 0%,100%{transform:translateX(0)} 25%,75%{transform:translateX(-2px)} 50%{transform:translateX(2px)} }
        @keyframes shake-hard { 0%,100%{transform:translate(0,0)} 10%,30%,50%,70%,90%{transform:translate(-4px,0)} 20%,40%,60%,80%{transform:translate(4px,0)} }
        @keyframes shake-vertical { 0%,100%{transform:translateY(0)} 20%,60%{transform:translateY(-3px)} 40%,80%{transform:translateY(3px)} }
        @keyframes wiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-2deg)} 50%{transform:rotate(0)} 75%{transform:rotate(2deg)} }
        @keyframes wiggle-jelly { 0%,100%{transform:rotate(0) scale(1)} 25%{transform:rotate(-3deg) scale(1.05)} 50%{transform:rotate(0) scale(.95)} 75%{transform:rotate(3deg) scale(1.05)} }
        @keyframes vibrate { 0%,100%{transform:translate(0)} 10%{transform:translate(-1px,-1px)} 20%{transform:translate(1px,-1px)} 30%{transform:translate(-1px,1px)} 40%{transform:translate(1px,1px)} 50%{transform:translate(-1px,-1px)} 60%{transform:translate(1px,-1px)} 70%{transform:translate(-1px,1px)} 80%{transform:translate(1px,1px)} 90%{transform:translate(-1px,-1px)} }
        @keyframes tilt-left { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-3deg)} }
        @keyframes tilt-right { 0%,100%{transform:rotate(0)} 50%{transform:rotate(3deg)} }
        @keyframes nod { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-5deg)} 75%{transform:rotate(5deg)} }
        @keyframes lean { 0%,100%{transform:skewX(0)} 50%{transform:skewX(-3deg)} }

        /* === Drawing / Morphing === */
        @keyframes morph-fade { 0%,45%{opacity:1;transform:scale(1)} 50%,95%{opacity:0;transform:scale(.9)} 100%{opacity:1;transform:scale(1)} }
        @keyframes morph-shape { 0%,100%{border-radius:50%} 50%{border-radius:0} }
        @keyframes expand-circle { 0%{transform:scale(0);opacity:.8} 100%{transform:scale(2.5);opacity:0} }
        @keyframes expand-vertical { 0%{transform:scaleY(0);transform-origin:bottom} 100%{transform:scaleY(1);transform-origin:bottom} }
        @keyframes expand-horizontal { 0%{transform:scaleX(0);transform-origin:left} 100%{transform:scaleX(1);transform-origin:left} }
        @keyframes count-bar { from{width:0} }
        @keyframes progress-fill { from{width:0} to{width:100%} }
        @keyframes number-roll { 0%{transform:translateY(-100%);opacity:0} 100%{transform:translateY(0);opacity:1} }
        @keyframes number-flip { 0%{transform:rotateX(0)} 50%{transform:rotateX(90deg)} 100%{transform:rotateX(0)} }
        @keyframes count-bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
        @keyframes drop-bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
        @keyframes arrow-bounce { 0%,100%{transform:translateY(0);opacity:.5} 50%{transform:translateY(4px);opacity:1} }
        @keyframes drag-pulse { 0%,100%{box-shadow:0 0 0 0 var(--brand-300);transform:scale(1)} 50%{box-shadow:0 0 0 16px transparent;transform:scale(1.02)} }

        /* === Notifications / Toasts === */
        @keyframes toast-in { 0%{opacity:0;transform:translateX(-50%) translateY(100px) scale(.9)} 60%{transform:translateX(-50%) translateY(-6px) scale(1.02)} 100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)} }
        @keyframes toast-out { 0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)} 100%{opacity:0;transform:translateX(-50%) translateY(20px) scale(.95)} }
        @keyframes notif-bounce { 0%{transform:translateY(-20px);opacity:0} 60%{transform:translateY(4px);opacity:1} 100%{transform:translateY(0);opacity:1} }
        @keyframes alert-pulse { 0%,100%{box-shadow:0 0 0 0 var(--danger);transform:scale(1)} 50%{box-shadow:0 0 0 8px transparent;transform:scale(1.05)} }
        @keyframes success-pulse { 0%,100%{box-shadow:0 0 0 0 var(--success);transform:scale(1)} 50%{box-shadow:0 0 0 8px transparent;transform:scale(1.05)} }
        @keyframes attention { 0%,100%{transform:scale(1)} 10%,30%{transform:scale(1.08) rotate(-2deg)} 20%{transform:scale(1.05) rotate(2deg)} }

        /* === Modal / Overlay === */
        @keyframes modal-spring { 0%{opacity:0;transform:scale(.85) translateY(30px)} 60%{opacity:1;transform:scale(1.02) translateY(-4px)} 100%{opacity:1;transform:scale(1) translateY(0)} }
        @keyframes modal-spring-soft { 0%{opacity:0;transform:scale(.95) translateY(20px)} 100%{opacity:1;transform:scale(1) translateY(0)} }
        @keyframes overlay-in { from{opacity:0} to{opacity:1} }

        /* === Typing / Cursor === */
        @keyframes blink-cursor { 0%,50%{opacity:1} 51%,100%{opacity:0} }
        @keyframes type-cursor { 0%,100%{opacity:1} 50%{opacity:0} }
        @keyframes typing-in { from{width:0} to{width:100%} }

        /* === Loading === */
        @keyframes bounce-dots { 0%,80%,100%{transform:scale(0)} 40%{transform:scale(1)} }
        @keyframes wave-bars { 0%,100%{transform:scaleY(.3)} 50%{transform:scaleY(1)} }
        @keyframes progress-circular { to{stroke-dashoffset:0} }
        @keyframes dots { 0%,20%{content:'.'} 40%{content:'..'} 60%,100%{content:'...'} }
        @keyframes skeleton { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
        @keyframes pulse-bg { 0%,100%{background-size:100% 100%} 50%{background-size:120% 120%} }

        /* === Special === */
        @keyframes magnet-x { 0%,100%{transform:translateX(0)} 50%{transform:translateX(4px)} }
        @keyframes magnet-y { 0%,100%{transform:translateY(0)} 50%{transform:translateY(4px)} }
        @keyframes magnetic { 0%,100%{transform:translate(0,0)} 50%{transform:translate(2px,-2px)} }
        @keyframes eyes-blink { 0%,96%,100%{transform:scaleY(1)} 98%{transform:scaleY(.1)} }
        @keyframes nod-soft { 0%,100%{transform:rotate(0)} 50%{transform:rotate(2deg)} }
        @keyframes hum { 0%,100%{transform:translate(0,0)} 25%{transform:translate(.5px,-.5px)} 50%{transform:translate(-.5px,.5px)} 75%{transform:translate(.5px,.5px)} }
        @keyframes breath { 0%,100%{transform:scale(1)} 50%{transform:scale(1.02)} }
        @keyframes pendulum { 0%,100%{transform:rotate(-10deg);transform-origin:top center} 50%{transform:rotate(10deg);transform-origin:top center} }
        @keyframes catch { 0%{transform:translateY(-100%);opacity:0} 60%{transform:translateY(10px);opacity:1} 100%{transform:translateY(0);opacity:1} }
        @keyframes throw { 0%{transform:translate(0,0) rotate(0);opacity:1} 100%{transform:translate(100px,-100px) rotate(180deg);opacity:0} }
        @keyframes pile { 0%{opacity:0;transform:translateY(20px) scale(.9)} 100%{opacity:1;transform:translateY(0) scale(1)} }
        @keyframes slide-in-right { from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1} }
        @keyframes slide-in-left { from{transform:translateX(-100%);opacity:0} to{transform:translateX(0);opacity:1} }
        @keyframes slide-out-right { from{transform:translateX(0);opacity:1} to{transform:translateX(100%);opacity:0} }
        @keyframes pop-out { from{transform:scale(1);opacity:1} to{transform:scale(.8);opacity:0} }
        @keyframes depth-pulse { 0%,100%{box-shadow:0 2px 4px rgba(0,0,0,.1),0 4px 8px rgba(0,0,0,.05)} 50%{box-shadow:0 6px 12px rgba(0,0,0,.15),0 12px 24px rgba(0,0,0,.1)} }

        /* ========== Base ========== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px; line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            overflow-x: hidden;
        }
        button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
        input, select, textarea { font: inherit; color: inherit; }
        img { display: block; max-width: 100%; }
        ::selection { background: var(--brand-200); color: var(--text); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; transition: background 0.2s; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

        /* ========== Background Decorations ========== */
        .bg-deco {
            position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden;
            background: var(--bg);
        }
        .bg-blob {
            position: absolute; border-radius: 50%;
            filter: blur(80px);
            will-change: transform;
        }
        .bg-blob.b1 { width: 480px; height: 480px; top: -200px; right: -150px; background: var(--brand-200); opacity: .45; animation: blob-float-1 28s ease-in-out infinite; }
        .bg-blob.b2 { width: 400px; height: 400px; bottom: -150px; left: -100px; background: var(--brand-100); opacity: .5; animation: blob-float-2 32s ease-in-out infinite; }
        .bg-blob.b3 { width: 360px; height: 360px; top: 40%; left: 50%; background: var(--accent); opacity: .08; transform: translate(-50%,-50%); animation: blob-float-3 36s ease-in-out infinite; }

        .bg-shape {
            position: absolute;
            pointer-events: none;
            opacity: .35;
            will-change: transform;
        }
        .bg-shape.s1 { top: 15%; left: 8%; width: 80px; height: 80px; background: linear-gradient(135deg, var(--brand-300), var(--brand-500)); border-radius: 20px; filter: blur(2px); animation: shape-float-1 14s ease-in-out infinite, shape-morph 8s ease-in-out infinite; }
        .bg-shape.s2 { top: 60%; right: 5%; width: 60px; height: 60px; background: linear-gradient(135deg, var(--accent), var(--brand-500)); border-radius: 50%; filter: blur(3px); animation: shape-float-2 18s ease-in-out infinite, shape-pulse 4s ease-in-out infinite; }
        .bg-shape.s3 { top: 75%; left: 12%; width: 50px; height: 50px; background: var(--brand-300); clip-path: polygon(50% 0, 100% 100%, 0 100%); filter: blur(2px); animation: shape-float-3 16s ease-in-out infinite, spin-slow 24s linear infinite; }
        .bg-shape.s4 { top: 25%; right: 12%; width: 70px; height: 70px; border: 2px solid var(--brand-400); border-radius: 50%; filter: blur(1px); animation: shape-float-1 20s ease-in-out infinite reverse, spin-reverse 32s linear infinite; }
        .bg-shape.s5 { top: 50%; left: 5%; width: 40px; height: 40px; background: linear-gradient(135deg, var(--brand-200), var(--brand-400)); clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); filter: blur(2px); animation: shape-float-2 22s ease-in-out infinite, shape-swing 6s ease-in-out infinite; }
        .bg-shape.s6 { top: 35%; right: 25%; width: 50px; height: 50px; background: linear-gradient(135deg, var(--brand-100), var(--brand-300)); border-radius: 50%; filter: blur(4px); animation: shape-float-4 17s ease-in-out infinite, hue-rotate 24s linear infinite; }

        .bg-grid {
            position: absolute; inset: 0;
            background-image: radial-gradient(circle at 1px 1px, var(--border-strong) 1px, transparent 0);
            background-size: 40px 40px;
            opacity: .25;
            mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 80%);
        }

        .mouse-glow {
            position: fixed; pointer-events: none; z-index: 0;
            width: 600px; height: 600px;
            border-radius: 50%;
            background: var(--grad-bg);
            filter: blur(100px);
            opacity: .35;
            transform: translate(-50%, -50%);
            will-change: transform;
            animation: hue-rotate 30s linear infinite;
        }
        .mouse-spot {
            position: fixed; pointer-events: none; z-index: 1;
            width: 400px; height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--brand-200) 0%, transparent 60%);
            opacity: 0;
            transform: translate(-50%, -50%);
            mix-blend-mode: overlay;
            will-change: transform, opacity;
            animation: hue-rotate 20s linear infinite;
        }

        .particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .particle {
            position: absolute; bottom: -10px;
            width: 4px; height: 4px; border-radius: 50%;
            background: var(--brand-400);
            opacity: .5;
            animation: particle-rise linear infinite;
        }
        .particle.fall { animation: particle-fall linear infinite; }
        .particle.drift { animation: particle-drift linear infinite; }

        .cursor-trail {
            position: fixed; pointer-events: none;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--brand-500);
            transform: translate(-50%, -50%);
            z-index: 9999;
            animation: cursor-trail-fade .8s var(--ease-out) forwards;
            mix-blend-mode: difference;
        }

        .confetti-host { position: fixed; inset: 0; pointer-events: none; z-index: 200; overflow: hidden; }
        .confetti-piece {
            position: absolute; width: 10px; height: 10px;
            top: 30%;
            animation: confetti 1.5s var(--ease-out) forwards;
        }

        /* ========== Topbar ========== */
        .topbar {
            position: sticky; top: 0; z-index: 50;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            animation: slide-down .6s var(--ease-out) backwards;
        }
        .topbar::after {
            content: '';
            position: absolute; left: 0; right: 0; bottom: 0;
            height: 2px;
            background: var(--grad);
            background-size: 200% 200%;
            transform-origin: left;
            animation: gradient-flow 4s ease infinite, count-bar 1.2s var(--ease-out) .5s backwards;
        }
        .topbar-inner {
            max-width: 1280px; margin: 0 auto; padding: 14px 24px;
            display: flex; align-items: center; gap: 20px; justify-content: space-between;
        }
        .brand {
            display: flex; align-items: center; gap: 12px;
            animation: slide-right .6s var(--ease-out) .1s backwards;
        }
        .brand-mark {
            width: 40px; height: 40px;
            border-radius: var(--radius-md);
            background: var(--grad);
            background-size: 200% 200%;
            animation: gradient-flow 6s ease infinite, scale-pop .6s var(--ease-spring) .2s backwards;
            display: grid; place-items: center;
            color: #fff; font-weight: 800; font-size: 20px;
            box-shadow: var(--shadow-brand);
            position: relative;
            overflow: hidden;
        }
        .brand-mark::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,.4) 50%, transparent 60%);
            transform: translateX(-100%);
            transition: transform .6s;
        }
        .brand:hover .brand-mark::before { transform: translateX(100%); }
        .brand:hover .brand-mark { animation: gradient-flow 6s ease infinite, pulse-soft 2s ease-in-out infinite; }
        .brand-text { display: flex; flex-direction: column; line-height: 1.2; }
        .brand-name { font-weight: 700; font-size: 16px; color: var(--text); letter-spacing: -.01em; }
        .brand-sub { font-size: 11px; color: var(--text-3); margin-top: 1px; font-weight: 500; }

        .top-meta {
            display: flex; align-items: center; gap: 12px;
            animation: slide-right .6s var(--ease-out) .2s backwards;
        }
        .status-pill {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 12px;
            background: var(--brand-50);
            border: 1px solid var(--brand-200);
            color: var(--brand-700);
            font-size: 12px; font-weight: 600;
            border-radius: 999px;
            transition: all .3s var(--ease-out);
        }
        .status-pill:hover { transform: translateY(-1px); box-shadow: 0 4px 12px var(--brand-200); }
        .status-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--brand-500);
            animation: pulse-dot 2s ease-in-out infinite;
            position: relative;
        }

        .theme-picker {
            display: flex; align-items: center; gap: 6px;
            padding: 5px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            position: relative;
        }
        .theme-dot {
            width: 22px; height: 22px;
            border-radius: 50%;
            border: 2px solid var(--surface);
            transition: all .3s var(--ease-spring);
            position: relative; cursor: pointer;
            box-shadow: 0 0 0 1px var(--border);
            overflow: hidden;
        }
        .theme-dot[data-th="mint"]     { background: linear-gradient(135deg, #10b981, #6366f1); }
        .theme-dot[data-th="indigo"]   { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
        .theme-dot[data-th="sunset"]   { background: linear-gradient(135deg, #f97316, #f43f5e); }
        .theme-dot[data-th="rose"]     { background: linear-gradient(135deg, #f43f5e, #8b5cf6); }
        .theme-dot[data-th="ocean"]    { background: linear-gradient(135deg, #06b6d4, #3b82f6); }
        .theme-dot[data-th="forest"]   { background: linear-gradient(135deg, #22c55e, #84cc16); }
        .theme-dot[data-th="lavender"] { background: linear-gradient(135deg, #a855f7, #ec4899); }
        .theme-dot[data-th="amber"]    { background: linear-gradient(135deg, #f59e0b, #ef4444); }
        .theme-dot[data-th="graphite"] { background: linear-gradient(135deg, #475569, #1e293b); }
        .theme-dot[data-th="candy"]    { background: linear-gradient(135deg, #ec4899, #06b6d4); }
        .theme-dot:hover { transform: scale(1.15) rotate(15deg); }
        .theme-dot.active {
            box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--brand-500);
            transform: scale(1.1);
            animation: pulse-soft 2s ease-in-out infinite;
        }
        .theme-dot.active::after {
            content: '';
            position: absolute; inset: -3px;
            border-radius: 50%;
            border: 2px solid var(--brand-500);
            animation: pulse-ring 1.5s ease-out infinite;
        }

        @media (max-width: 720px) { .top-meta .status-pill { display: none; } }

        /* ========== Page Layout ========== */
        .page {
            position: relative; z-index: 1;
            max-width: 1280px; margin: 0 auto; padding: 24px;
        }

        /* ========== Hero ========== */
        .hero {
            position: relative; padding: 36px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-sm);
            margin-bottom: 24px;
            overflow: hidden;
            animation: slide-up .7s var(--ease-out) .3s backwards;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 500px; height: 100%;
            background: var(--grad-soft);
            border-radius: 50%;
            filter: blur(60px);
            transform: translate(30%, -20%);
            animation: hero-bg-float 18s ease-in-out infinite, hue-rotate 30s linear infinite;
            pointer-events: none;
        }
        .hero::after {
            content: '';
            position: absolute;
            top: -100px; left: -100px;
            width: 300px; height: 300px;
            background: var(--grad-soft);
            border-radius: 50%;
            filter: blur(60px);
            animation: blob-float-2 24s ease-in-out infinite, hue-rotate 40s linear infinite reverse;
            pointer-events: none;
        }
        .hero-content {
            position: relative; z-index: 1;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 32px;
            align-items: center;
        }
        .hero-text { max-width: 640px; }
        .hero-tag {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 12px;
            background: var(--brand-50);
            border: 1px solid var(--brand-200);
            color: var(--brand-700);
            font-size: 12px; font-weight: 600;
            border-radius: 999px;
            margin-bottom: 18px;
            animation: slide-up .5s var(--ease-out) .5s backwards, attention 4s ease-in-out 2s infinite;
        }
        .hero-tag .tag-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--brand-500);
            animation: pulse-soft 1.5s ease-in-out infinite, hue-rotate 8s linear infinite;
        }
        .hero h1 {
            font-size: 36px; font-weight: 800; line-height: 1.18;
            letter-spacing: -.025em;
            color: var(--text);
            margin-bottom: 14px;
            animation: slide-up .6s var(--ease-out) .6s backwards;
        }
        .hero h1 .word {
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
            animation: text-reveal .6s var(--ease-out) forwards, levitate 8s ease-in-out 2s infinite;
        }
        .hero h1 .hl {
            background: var(--grad);
            background-size: 200% 200%;
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-flow 4s ease infinite;
            position: relative;
            display: inline-block;
        }
        .hero h1 .hl::after {
            content: '';
            position: absolute; left: 0; right: 0; bottom: -4px;
            height: 3px;
            background: var(--grad);
            background-size: 200% 200%;
            border-radius: 2px;
            transform: scaleX(0);
            transform-origin: left;
            animation: gradient-flow 4s ease infinite, count-bar 1s var(--ease-out) 1.2s forwards;
        }
        .hero-sub {
            color: var(--text-2); font-size: 15px;
            margin-bottom: 24px; max-width: 580px;
            animation: slide-up .5s var(--ease-out) .9s backwards;
        }

        .hero-stats {
            display: grid; gap: 12px;
            grid-template-columns: repeat(4, 1fr);
            animation: slide-up .5s var(--ease-out) 1.0s backwards;
        }
        .stat {
            position: relative;
            padding: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            display: flex; flex-direction: column; gap: 4px;
            overflow: hidden;
            transition: all .3s var(--ease-out);
            box-shadow: var(--shadow-xs);
            animation: pile .5s var(--ease-spring) backwards;
        }
        .stat:nth-child(1) { animation-delay: 1.1s; }
        .stat:nth-child(2) { animation-delay: 1.2s; }
        .stat:nth-child(3) { animation-delay: 1.3s; }
        .stat:nth-child(4) { animation-delay: 1.4s; }
        .stat:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: var(--shadow-md);
            border-color: var(--brand-300);
        }
        .stat::before {
            content: '';
            position: absolute; left: 0; bottom: 0;
            height: 2px; width: 0;
            background: var(--grad);
            border-radius: 2px;
            transition: width 1.2s var(--ease-out);
        }
        .stat.in-view::before { width: 100%; }
        .stat::after {
            content: '';
            position: absolute; top: -50%; right: -50%;
            width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,.6) 50%, transparent 70%);
            transform: translateX(-100%) rotate(45deg);
            pointer-events: none;
        }
        .stat:hover::after { animation: tilt-shine .8s var(--ease-out) forwards; }
        .stat-icon {
            width: 28px; height: 28px;
            display: grid; place-items: center;
            background: var(--grad-soft);
            color: var(--brand-600);
            border-radius: 8px;
            margin-bottom: 4px;
            transition: transform .3s var(--ease-spring);
        }
        .stat:hover .stat-icon { transform: rotate(15deg) scale(1.1); }
        .stat-icon svg { width: 14px; height: 14px; transition: transform .3s; }
        .stat:hover .stat-icon svg { animation: spin-once .6s var(--ease-spring); }
        .stat-val {
            font-size: 22px; font-weight: 800;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -.02em;
            transition: color .3s;
        }
        .stat:hover .stat-val { color: var(--brand-600); }
        .stat-lbl { font-size: 11px; color: var(--text-3); font-weight: 500; }

        .hero-showcase {
            position: relative;
            width: 280px; height: 200px;
            border-radius: var(--radius-xl);
            overflow: hidden;
            background: var(--grad);
            background-size: 200% 200%;
            animation: gradient-flow 6s ease infinite, scale-pop .8s var(--ease-spring) .8s backwards, levitate 6s ease-in-out 2s infinite;
            box-shadow: var(--shadow-brand);
            transform-style: preserve-3d;
            perspective: 1000px;
        }
        .showcase-frame {
            position: absolute; inset: 8px;
            border-radius: calc(var(--radius-xl) - 8px);
            overflow: hidden;
            background: #1a1a1a;
        }
        .showcase-img {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0;
            animation: morph-fade 16s var(--ease-out) infinite;
        }
        .showcase-img:nth-child(1) { animation-delay: 0s; }
        .showcase-img:nth-child(2) { animation-delay: 4s; }
        .showcase-img:nth-child(3) { animation-delay: 8s; }
        .showcase-img:nth-child(4) { animation-delay: 12s; }
        .showcase-label {
            position: absolute; bottom: 8px; left: 8px; right: 8px;
            padding: 8px 12px;
            background: rgba(0,0,0,.65);
            color: #fff;
            font-size: 11px; font-weight: 600;
            display: flex; align-items: center; gap: 6px;
            transform: translateY(0);
            transition: transform .3s var(--ease-spring);
        }
        .showcase-label .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--brand-400);
            animation: pulse-soft 1.5s ease-in-out infinite;
        }
        .showcase-corners {
            position: absolute; inset: 0;
            pointer-events: none;
        }
        .showcase-corners::before, .showcase-corners::after,
        .showcase-corners > span {
            content: '';
            position: absolute;
            width: 14px; height: 14px;
            border: 2px solid #fff;
        }
        .showcase-corners::before { top: 4px; left: 4px; border-right: 0; border-bottom: 0; border-top-left-radius: 6px; }
        .showcase-corners::after { top: 4px; right: 4px; border-left: 0; border-bottom: 0; border-top-right-radius: 6px; }
        .showcase-corners > span:nth-child(1) { bottom: 4px; left: 4px; border-right: 0; border-top: 0; border-bottom-left-radius: 6px; }
        .showcase-corners > span:nth-child(2) { bottom: 4px; right: 4px; border-left: 0; border-top: 0; border-bottom-right-radius: 6px; }

        @media (max-width: 880px) {
            .hero-content { grid-template-columns: 1fr; }
            .hero-showcase { display: none; }
        }
        @media (max-width: 720px) {
            .hero { padding: 24px 20px; }
            .hero h1 { font-size: 24px; }
            .hero-sub { font-size: 14px; }
            .hero-stats { grid-template-columns: repeat(2, 1fr); }
        }

        /* ========== Workspace ========== */
        .workspace { display: grid; gap: 20px; }
        @media (min-width: 1024px) {
            .workspace { grid-template-columns: 380px 1fr; align-items: start; }
            .col-left { position: sticky; top: 88px; }
        }
        @media (max-width: 1023px) {
            .workspace { grid-template-columns: 1fr; }
        }

        /* ========== Tabs ========== */
        .tab-bar {
            display: flex; gap: 4px; padding: 4px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            margin-bottom: 16px;
            overflow-x: auto;
            position: relative;
        }
        .tab {
            padding: 8px 14px;
            font-size: 13px; font-weight: 600;
            color: var(--text-2);
            border-radius: 8px;
            transition: all .25s var(--ease-out);
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }
        .tab::before {
            content: '';
            position: absolute;
            bottom: 4px; left: 50%;
            width: 0; height: 2px;
            background: var(--grad);
            border-radius: 2px;
            transform: translateX(-50%);
            transition: width .3s var(--ease-out);
        }
        .tab:hover { color: var(--text); background: var(--bg-soft); transform: translateY(-1px); }
        .tab:hover::before { width: 20%; }
        .tab.active {
            color: #fff;
            background: var(--grad);
            background-size: 200% 200%;
            animation: gradient-flow 4s ease infinite, pulse-soft 3s ease-in-out infinite;
            box-shadow: var(--shadow-sm);
            transform: translateY(-1px);
        }
        .tab.active::before { display: none; }
        .tab:active { transform: translateY(0) scale(.98); }

        /* ========== Card ========== */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            margin-bottom: 16px;
            overflow: hidden;
            position: relative;
            transition: box-shadow .3s var(--ease-out), transform .3s var(--ease-out), border-color .3s;
        }
        .card::before {
            content: '';
            position: absolute; inset: 0;
            border-radius: var(--radius-xl);
            padding: 1px;
            background: linear-gradient(135deg, var(--brand-300), var(--accent), var(--brand-500));
            background-size: 200% 200%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity .4s;
            pointer-events: none;
            animation: gradient-border-flow 4s ease infinite;
        }
        .card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
            border-color: var(--brand-200);
        }
        .card:hover::before { opacity: .4; }
        .card-head {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }
        .card-title {
            display: flex; align-items: center; gap: 10px;
            font-weight: 700; font-size: 15px; color: var(--text);
        }
        .step-num {
            width: 24px; height: 24px;
            display: grid; place-items: center;
            background: var(--grad);
            background-size: 200% 200%;
            color: #fff;
            font-size: 11px; font-weight: 700;
            border-radius: 7px;
            animation: gradient-flow 4s ease infinite, pulse-soft 3s ease-in-out infinite;
        }
        .badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 4px 10px;
            background: var(--bg-soft);
            border: 1px solid var(--border);
            color: var(--text-2);
            font-size: 11px; font-weight: 600;
            border-radius: 999px;
            transition: all .3s var(--ease-out);
        }
        .badge.success {
            background: var(--brand-50);
            color: var(--brand-700);
            border-color: var(--brand-200);
            animation: glow-pulse 2.5s ease-in-out infinite;
        }
        .card-body { padding: 20px; }

        /* ========== Upload ========== */
        .dropzone {
            position: relative; padding: 32px 20px;
            text-align: center; cursor: pointer;
            background: var(--bg-soft);
            border: 2px dashed var(--border-strong);
            border-radius: var(--radius-lg);
            transition: all .3s var(--ease-out);
            overflow: hidden;
        }
        .dropzone::before {
            content: '';
            position: absolute; inset: 0;
            background: var(--grad-soft);
            opacity: 0;
            transition: opacity .3s;
        }
        .dropzone::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,.3) 50%, transparent 70%);
            transform: translateX(-100%);
            pointer-events: none;
        }
        .dropzone:hover::after { animation: tool-shine 1s var(--ease-out); }
        .dropzone:hover, .dropzone.dragover {
            border-color: var(--brand-500);
            border-style: solid;
            transform: scale(1.01);
        }
        .dropzone:hover::before, .dropzone.dragover::before { opacity: 1; }
        .dropzone.dragover { animation: drag-pulse 1.2s ease-in-out infinite, shake-soft .3s ease-in-out infinite; }
        .drop-icon {
            width: 56px; height: 56px;
            margin: 0 auto 14px;
            display: grid; place-items: center;
            background: var(--grad);
            background-size: 200% 200%;
            color: #fff;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-brand);
            transition: transform .3s var(--ease-spring);
            animation: gradient-flow 4s ease infinite, float-y 3s ease-in-out infinite, pulse-soft 2s ease-in-out infinite;
            position: relative;
        }
        .dropzone:hover .drop-icon {
            transform: translateY(-3px) scale(1.08) rotate(-3deg);
            box-shadow: 0 12px 32px var(--brand-300);
        }
        .dropzone.dragover .drop-icon { animation: drop-bounce .8s ease-in-out infinite, spin-slow 2s linear infinite; }
        .drop-icon svg { width: 26px; height: 26px; animation: arrow-bounce 1.5s ease-in-out infinite; }
        .drop-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 4px; position: relative; }
        .drop-hint { font-size: 12px; color: var(--text-3); position: relative; }

        .img-list {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px; margin-top: 16px;
        }
        .img-card {
            position: relative; aspect-ratio: 1;
            overflow: hidden;
            background: var(--bg-soft);
            border: 2px solid transparent;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: transform .3s var(--ease-out), box-shadow .3s var(--ease-out);
            animation: scale-pop-soft .4s var(--ease-spring) backwards;
            transform-style: preserve-3d;
            will-change: transform;
        }
        .img-card img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform .4s var(--ease-out);
        }
        .img-card:hover { box-shadow: var(--shadow-md); }
        .img-card:hover img { transform: scale(1.08) rotate(1deg); }
        .img-card.selected {
            border-color: var(--brand-500);
            box-shadow: 0 0 0 3px var(--brand-100);
            animation: scale-pop-soft .4s var(--ease-spring), glow-pulse 2.4s ease-in-out .4s infinite;
        }
        .img-card .check {
            position: absolute; top: 6px; left: 6px;
            width: 22px; height: 22px;
            background: var(--brand-500);
            color: #fff;
            display: grid; place-items: center;
            font-size: 12px; font-weight: 700;
            border-radius: 50%;
            opacity: 0; transform: scale(.3) rotate(-180deg);
            transition: all .3s var(--ease-spring);
            box-shadow: var(--shadow-sm);
        }
        .img-card.selected .check { opacity: 1; transform: scale(1) rotate(0); }
        .img-card .del {
            position: absolute; top: 6px; right: 6px;
            width: 22px; height: 22px;
            background: rgba(255,255,255,.95);
            color: var(--danger);
            display: grid; place-items: center;
            font-size: 16px; line-height: 1;
            border-radius: 50%;
            opacity: 0;
            transform: scale(.5) rotate(0);
            transition: all .3s var(--ease-spring);
            box-shadow: var(--shadow-sm);
        }
        .img-card:hover .del { opacity: 1; transform: scale(1) rotate(0); }
        .img-card .del:hover {
            background: var(--danger);
            color: #fff;
            transform: scale(1.1) rotate(90deg);
        }
        .img-card .tag {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 16px 8px 6px;
            background: linear-gradient(to top, rgba(0,0,0,.7), transparent);
            color: #fff;
            font-size: 10px; font-weight: 500;
            display: flex; justify-content: space-between;
            opacity: .9;
            transform: translateY(4px);
            transition: transform .3s var(--ease-out);
        }
        .img-card:hover .tag { transform: translateY(0); }

        .list-bar {
            display: flex; gap: 8px; margin-top: 14px;
            flex-wrap: wrap; align-items: center;
        }
        .list-bar .spacer { flex: 1; }
        .btn-text {
            padding: 6px 12px;
            font-size: 12px; font-weight: 600;
            color: var(--text-2);
            border-radius: 6px;
            transition: all .2s var(--ease-out);
            position: relative;
            overflow: hidden;
        }
        .btn-text::before {
            content: '';
            position: absolute; inset: 0;
            background: var(--bg-soft);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .3s var(--ease-out);
            z-index: -1;
        }
        .btn-text:hover { color: var(--text); transform: translateY(-1px); }
        .btn-text:hover::before { transform: scaleX(1); }
        .btn-text.danger:hover { color: var(--danger); }
        .btn-text.danger::before { background: #fef2f2; }

        /* ========== Tools Grid ========== */
        .tools-empty {
            padding: 40px 20px; text-align: center; color: var(--text-3);
            animation: fade-in .4s var(--ease-out);
        }
        .tools-empty img {
            width: 160px; height: 160px;
            margin: 0 auto 16px;
            display: block;
            animation: float-3d 6s ease-in-out infinite, spin-slow 20s linear infinite;
        }
        .tools-empty .t { font-size: 15px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
        .tools-empty .d { font-size: 13px; color: var(--text-3); }

        .tools-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
        .tool {
            position: relative; padding: 16px 8px;
            text-align: center; cursor: pointer;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            transition: all .3s var(--ease-out);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            border-radius: var(--radius-md);
            overflow: hidden;
            animation: scale-pop-soft .5s var(--ease-spring) backwards;
        }
        .tool::before {
            content: '';
            position: absolute; inset: 0;
            background: var(--grad);
            opacity: 0;
            transition: opacity .3s var(--ease-out);
            border-radius: var(--radius-md);
        }
        .tool::after {
            content: '';
            position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);
            transition: left .6s var(--ease-out);
        }
        .tool:hover::after { left: 100%; }
        .tool .ico {
            width: 40px; height: 40px;
            display: grid; place-items: center;
            color: var(--brand-500);
            background: var(--brand-50);
            border-radius: 10px;
            transition: all .3s var(--ease-spring);
            position: relative;
            z-index: 1;
        }
        .tool .ico svg { width: 20px; height: 20px; transition: transform .3s var(--ease-spring); }
        .tool .ico svg path, .tool .ico svg line, .tool .ico svg polyline, .tool .ico svg circle, .tool .ico svg rect, .tool .ico svg polygon {
            transition: stroke-dasharray .5s ease;
        }
        .tool:hover .ico svg { transform: rotate(-12deg) scale(1.15); }
        .tool:hover .ico svg * { stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw .6s var(--ease-out) forwards; }
        .tool .lbl {
            font-size: 12px; font-weight: 600; color: var(--text-2);
            position: relative; z-index: 1;
            transition: color .3s var(--ease-out);
        }
        .tool:hover {
            border-color: var(--brand-300);
            transform: translateY(-4px) scale(1.02);
            box-shadow: var(--shadow-md);
        }
        .tool:hover .ico {
            background: var(--grad);
            background-size: 200% 200%;
            color: #fff;
            transform: scale(1.05) rotate(8deg);
            animation: gradient-flow 3s ease infinite, pulse-soft 1.5s ease-in-out infinite;
        }
        .tool:hover .lbl { color: var(--text); }
        .tool:active { transform: translateY(-2px) scale(.96); }
        .tool.applied {
            border-color: var(--brand-500);
            background: var(--brand-50);
            animation: shake .5s var(--ease-out), glow-pulse 2s ease-in-out infinite;
        }
        .tool.applied .ico { background: var(--brand-500); color: #fff; }
        .tool.applied .lbl { color: var(--brand-700); }

        .ripple {
            position: absolute; border-radius: 50%;
            transform: scale(0);
            background: rgba(255,255,255,.6);
            animation: ripple .6s var(--ease-out);
            pointer-events: none;
        }
        .star-burst { position: absolute; inset: 0; pointer-events: none; display: grid; place-items: center; }
        .star-burst svg {
            width: 80px; height: 80px;
            animation: star-burst .6s var(--ease-out) forwards, confetti-spin .6s linear forwards;
            color: var(--brand-500);
        }

        /* ========== Results ========== */
        .result-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
        .result {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            animation: card-pop .5s var(--ease-spring) backwards, breath 4s ease-in-out infinite;
            transition: all .3s var(--ease-out);
            position: relative;
        }
        .result:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: var(--shadow-md), 0 0 0 1px var(--brand-200);
            border-color: var(--brand-300);
        }
        .result img {
            width: 100%; aspect-ratio: 1; object-fit: cover;
            background: var(--bg-soft);
            transition: transform .4s var(--ease-out);
        }
        .result:hover img { transform: scale(1.06); }
        .result .r-info { padding: 12px 14px; }
        .result .r-name {
            font-size: 12px; font-weight: 600; color: var(--text);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            transition: color .3s;

        .result:hover .r-name { color: var(--brand-600); }
        .result .r-meta {
            font-size: 11px; color: var(--text-3);
            margin-top: 4px;
            display: flex; justify-content: space-between;
