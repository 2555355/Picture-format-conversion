<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <title>图片工坊 · 一站式图片处理工具</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* =========================================================
           Picture Workshop — Animation Fixed Edition
           10 themes · 200+ keyframes · guaranteed-working clicks
           ========================================================= */

        :root, [data-theme="mint"] {
            --brand-50:  #ecfdf5;
            --brand-100: #d1fae5;
            --brand-200: #a7f3d0;
            --brand-300: #6ee7b7;
            --brand-400: #34d399;
            --brand-500: #10b981;
            --brand-600: #059669;
            --brand-700: #047857;
            --accent: #6366f1;
            --bg: #fafaf9;
            --bg-soft: #f5f5f4;
            --surface: #ffffff;
            --border: #e7e5e4;
            --border-strong: #d6d3d1;
            --text: #1c1917;
            --text-2: #57534e;
            --text-3: #a8a29e;
            --success: #10b981;
            --warn: #f59e0b;
            --danger: #ef4444;
            --grad: linear-gradient(135deg, #10b981 0%, #6366f1 100%);
            --grad-soft: linear-gradient(135deg, rgba(16,185,129,0.08), rgba(99,102,241,0.08));
            --grad-bg: linear-gradient(135deg, rgba(16,185,129,0.35) 0%, rgba(99,102,241,0.30) 50%, rgba(139,92,246,0.25) 100%);
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.06), 0 2px 4px rgba(0,0,0,0.04);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.04);
            --shadow-brand: 0 8px 24px rgba(16,185,129,0.20);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-bounce: cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        [data-theme="indigo"]  { --brand-50:#eef2ff; --brand-100:#e0e7ff; --brand-200:#c7d2fe; --brand-300:#a5b4fc; --brand-400:#818cf8; --brand-500:#6366f1; --brand-600:#4f46e5; --brand-700:#4338ca; --accent:#8b5cf6; --bg:#f8fafc; --bg-soft:#f1f5f9; --grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 100%); --grad-soft:linear-gradient(135deg,rgba(99,102,241,0.08),rgba(139,92,246,0.08)); --grad-bg:linear-gradient(135deg,rgba(99,102,241,0.35) 0%,rgba(139,92,246,0.30) 50%,rgba(236,72,153,0.25) 100%); --shadow-brand:0 8px 24px rgba(99,102,241,0.20); }
        [data-theme="sunset"]  { --brand-50:#fff7ed; --brand-100:#ffedd5; --brand-200:#fed7aa; --brand-300:#fdba74; --brand-400:#fb923c; --brand-500:#f97316; --brand-600:#ea580c; --brand-700:#c2410c; --accent:#f43f5e; --bg:#fafaf9; --bg-soft:#f5f5f4; --grad:linear-gradient(135deg,#f97316 0%,#f43f5e 100%); --grad-soft:linear-gradient(135deg,rgba(249,115,22,0.08),rgba(244,63,94,0.08)); --grad-bg:linear-gradient(135deg,rgba(249,115,22,0.35) 0%,rgba(244,63,94,0.30) 50%,rgba(168,85,247,0.25) 100%); --shadow-brand:0 8px 24px rgba(249,115,22,0.20); }
        [data-theme="rose"]    { --brand-50:#fff1f2; --brand-100:#ffe4e6; --brand-200:#fecdd3; --brand-300:#fda4af; --brand-400:#fb7185; --brand-500:#f43f5e; --brand-600:#e11d48; --brand-700:#be123c; --accent:#8b5cf6; --bg:#fafaf9; --bg-soft:#f5f5f4; --grad:linear-gradient(135deg,#f43f5e 0%,#8b5cf6 100%); --grad-soft:linear-gradient(135deg,rgba(244,63,94,0.08),rgba(139,92,246,0.08)); --grad-bg:linear-gradient(135deg,rgba(244,63,94,0.35) 0%,rgba(139,92,246,0.30) 50%,rgba(59,130,246,0.25) 100%); --shadow-brand:0 8px 24px rgba(244,63,94,0.20); }
        [data-theme="ocean"]   { --brand-50:#ecfeff; --brand-100:#cffafe; --brand-200:#a5f3fc; --brand-300:#67e8f9; --brand-400:#22d3ee; --brand-500:#06b6d4; --brand-600:#0891b2; --brand-700:#0e7490; --accent:#3b82f6; --bg:#f0f9ff; --bg-soft:#e0f2fe; --grad:linear-gradient(135deg,#06b6d4 0%,#3b82f6 100%); --grad-soft:linear-gradient(135deg,rgba(6,182,212,0.08),rgba(59,130,246,0.08)); --grad-bg:linear-gradient(135deg,rgba(6,182,212,0.35) 0%,rgba(59,130,246,0.30) 50%,rgba(99,102,241,0.25) 100%); --shadow-brand:0 8px 24px rgba(6,182,212,0.20); }
        [data-theme="forest"]  { --brand-50:#f0fdf4; --brand-100:#dcfce7; --brand-200:#bbf7d0; --brand-300:#86efac; --brand-400:#4ade80; --brand-500:#22c55e; --brand-600:#16a34a; --brand-700:#15803d; --accent:#84cc16; --bg:#f7fee7; --bg-soft:#ecfccb; --grad:linear-gradient(135deg,#22c55e 0%,#84cc16 100%); --grad-soft:linear-gradient(135deg,rgba(34,197,94,0.08),rgba(132,204,22,0.08)); --grad-bg:linear-gradient(135deg,rgba(34,197,94,0.35) 0%,rgba(132,204,22,0.30) 50%,rgba(234,179,8,0.25) 100%); --shadow-brand:0 8px 24px rgba(34,197,94,0.20); }
        [data-theme="lavender"]{ --brand-50:#faf5ff; --brand-100:#f3e8ff; --brand-200:#e9d5ff; --brand-300:#d8b4fe; --brand-400:#c084fc; --brand-500:#a855f7; --brand-600:#9333ea; --brand-700:#7e22ce; --accent:#ec4899; --bg:#faf5ff; --bg-soft:#f3e8ff; --grad:linear-gradient(135deg,#a855f7 0%,#ec4899 100%); --grad-soft:linear-gradient(135deg,rgba(168,85,247,0.08),rgba(236,72,153,0.08)); --grad-bg:linear-gradient(135deg,rgba(168,85,247,0.35) 0%,rgba(236,72,153,0.30) 50%,rgba(244,114,182,0.25) 100%); --shadow-brand:0 8px 24px rgba(168,85,247,0.20); }
        [data-theme="amber"]   { --brand-50:#fffbeb; --brand-100:#fef3c7; --brand-200:#fde68a; --brand-300:#fcd34d; --brand-400:#fbbf24; --brand-500:#f59e0b; --brand-600:#d97706; --brand-700:#b45309; --accent:#ef4444; --bg:#fffbeb; --bg-soft:#fef3c7; --grad:linear-gradient(135deg,#f59e0b 0%,#ef4444 100%); --grad-soft:linear-gradient(135deg,rgba(245,158,11,0.08),rgba(239,68,68,0.08)); --grad-bg:linear-gradient(135deg,rgba(245,158,11,0.35) 0%,rgba(239,68,68,0.30) 50%,rgba(220,38,38,0.25) 100%); --shadow-brand:0 8px 24px rgba(245,158,11,0.20); }
        [data-theme="graphite"]{ --brand-50:#f8fafc; --brand-100:#f1f5f9; --brand-200:#e2e8f0; --brand-300:#cbd5e1; --brand-400:#94a3b8; --brand-500:#64748b; --brand-600:#475569; --brand-700:#334155; --accent:#3b82f6; --bg:#f8fafc; --bg-soft:#f1f5f9; --grad:linear-gradient(135deg,#475569 0%,#1e293b 100%); --grad-soft:linear-gradient(135deg,rgba(71,85,105,0.08),rgba(30,41,59,0.08)); --grad-bg:linear-gradient(135deg,rgba(71,85,105,0.30) 0%,rgba(30,41,59,0.25) 50%,rgba(59,130,246,0.20) 100%); --shadow-brand:0 8px 24px rgba(71,85,105,0.20); }
        [data-theme="candy"]   { --brand-50:#fdf2f8; --brand-100:#fce7f3; --brand-200:#fbcfe8; --brand-300:#f9a8d4; --brand-400:#f472b6; --brand-500:#ec4899; --brand-600:#db2777; --brand-700:#be185d; --accent:#06b6d4; --bg:#fdf2f8; --bg-soft:#fce7f3; --grad:linear-gradient(135deg,#ec4899 0%,#06b6d4 100%); --grad-soft:linear-gradient(135deg,rgba(236,72,153,0.08),rgba(6,182,212,0.08)); --grad-bg:linear-gradient(135deg,rgba(236,72,153,0.35) 0%,rgba(6,182,212,0.30) 50%,rgba(168,85,247,0.25) 100%); --shadow-brand:0 8px 24px rgba(236,72,153,0.20); }

        /* ========== Smooth color transitions ========== */
        body, .topbar, .card, .tab-bar, .tab, .btn, .tool, .stat, .badge, .modal, .modal-head, .modal-foot, .field-input, .status-pill, .theme-picker, .theme-dot, .dropzone, .img-card, .result, .btn-text, .field, .step-num, .actions-row, .hero, .hero-tag, .modal-scope, .hero-stats, .modal-desc, .field-label, .field-label .val, .loading-box, .toast, .progress-fill, .result .r-name, .stat-val, .stat-lbl, .list-bar, .img-list {
            transition: background-color .4s var(--ease-out), color .4s var(--ease-out), border-color .4s var(--ease-out), box-shadow .3s var(--ease-out);
        }

        /* ========== 200+ Keyframes ========== */
        @keyframes blob-float-1 { 0%,100%{transform:translate(0,0) scale(1) rotate(0)} 33%{transform:translate(60px,-40px) scale(1.1) rotate(120deg)} 66%{transform:translate(-30px,30px) scale(.95) rotate(240deg)} }
        @keyframes blob-float-2 { 0%,100%{transform:translate(0,0) scale(1) rotate(0)} 33%{transform:translate(-50px,30px) scale(1.15) rotate(-100deg)} 66%{transform:translate(40px,-30px) scale(.9) rotate(-220deg)} }
        @keyframes blob-float-3 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(30px,50px) scale(1.2)} }
        @keyframes shape-float-1 { 0%,100%{transform:translate(0,0) rotate(0)} 50%{transform:translate(20px,-30px) rotate(60deg)} }
        @keyframes shape-float-2 { 0%,100%{transform:translate(0,0) rotate(0)} 50%{transform:translate(-25px,20px) rotate(-90deg)} }
        @keyframes shape-float-3 { 0%,100%{transform:translate(0,0) rotate(0) scale(1)} 50%{transform:translate(15px,15px) rotate(45deg) scale(1.1)} }
        @keyframes shape-float-4 { 0%,100%{transform:translate(0,0) rotate(0)} 50%{transform:translate(-20px,-15px) rotate(-45deg)} }
        @keyframes shape-morph { 0%,100%{border-radius:20px} 50%{border-radius:50%} }
        @keyframes shape-pulse { 0%,100%{transform:scale(1);opacity:.3} 50%{transform:scale(1.2);opacity:.5} }
        @keyframes shape-swing { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }
        @keyframes shape-spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
        @keyframes drift { 0%,100%{transform:translate(0,0)} 33%{transform:translate(20px,-15px)} 66%{transform:translate(-15px,20px)} }
        @keyframes breeze { 0%,100%{transform:translateX(0) rotate(0)} 50%{transform:translateX(8px) rotate(2deg)} }

        @keyframes slide-down { from{opacity:0;transform:translateY(-30px)} to{opacity:1;transform:translateY(0)} }
        @keyframes slide-up { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
        @keyframes slide-up-spring { 0%{opacity:0;transform:translateY(40px) scale(.95)} 60%{opacity:1;transform:translateY(-6px) scale(1.01)} 100%{opacity:1;transform:translateY(0) scale(1)} }
        @keyframes slide-up-soft { from{opacity:0;transform:translateY(15px)} to{opacity:1;transform:translateY(0)} }
        @keyframes slide-right { from{opacity:0;transform:translateX(-20px)} to{opacity:1;transform:translateX(0)} }
        @keyframes slide-left { from{opacity:0;transform:translateX(20px)} to{opacity:1;transform:translateX(0)} }
        @keyframes slide-up-far { from{opacity:0;transform:translateY(60px)} to{opacity:1;transform:translateY(0)} }
        @keyframes fade-in { from{opacity:0} to{opacity:1} }
        @keyframes text-reveal { from{opacity:0;transform:translateY(100%)} to{opacity:1;transform:translateY(0)} }
        @keyframes char-fall { from{opacity:0;transform:translateY(-20px) rotate(20deg)} to{opacity:1;transform:translateY(0) rotate(0)} }
        @keyframes mask-reveal-bottom { from{clip-path:inset(100% 0 0 0)} to{clip-path:inset(0 0 0 0)} }
        @keyframes mask-reveal-top { from{clip-path:inset(0 0 100% 0)} to{clip-path:inset(0 0 0 0)} }
        @keyframes mask-reveal-left { from{clip-path:inset(0 100% 0 0)} to{clip-path:inset(0 0 0 0)} }
        @keyframes mask-reveal-right { from{clip-path:inset(0 0 0 100%)} to{clip-path:inset(0 0 0 0)} }
        @keyframes flip-in-x { from{opacity:0;transform:rotateX(90deg)} to{opacity:1;transform:rotateX(0)} }
        @keyframes flip-in-y { from{opacity:0;transform:rotateY(90deg)} to{opacity:1;transform:rotateY(0)} }
        @keyframes roll-in { from{opacity:0;transform:translateX(-100%) rotate(-360deg)} to{opacity:1;transform:translateX(0) rotate(0)} }
        @keyframes wipe-in { from{transform:scaleX(0);transform-origin:left} to{transform:scaleX(1)} }
        @keyframes text-scramble { 0%{opacity:0;filter:blur(8px)} 100%{opacity:1;filter:blur(0)} }
        @keyframes word-stretch { from{transform:scaleY(0)} to{transform:scaleY(1)} }
        @keyframes entrance-bounce { 0%{transform:scale(0) translateY(50px);opacity:0} 50%{transform:scale(1.05) translateY(-5px);opacity:.9} 70%{transform:scale(.95) translateY(2px)} 100%{transform:scale(1) translateY(0);opacity:1} }
        @keyframes pile { 0%{opacity:0;transform:translateY(20px) scale(.9)} 100%{opacity:1;transform:translateY(0) scale(1)} }

        @keyframes scale-pop { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1;transform:scale(1.08)} 100%{opacity:1;transform:scale(1)} }
        @keyframes scale-pop-soft { 0%{opacity:0;transform:scale(.85) translateY(10px)} 100%{opacity:1;transform:scale(1) translateY(0)} }
        @keyframes bounce-in { 0%{opacity:0;transform:scale(.3) rotate(-10deg)} 50%{transform:scale(1.05) rotate(3deg)} 70%{transform:scale(.95) rotate(-1deg)} 100%{opacity:1;transform:scale(1) rotate(0)} }
        @keyframes bounce-soft { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
        @keyframes bounce-up { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
        @keyframes bounce-down { 0%,100%{transform:translateY(0)} 50%{transform:translateY(12px)} }
        @keyframes rubber-band { 0%{transform:scale(1)} 30%{transform:scaleX(1.25) scaleY(.75)} 40%{transform:scaleX(.75) scaleY(1.25)} 50%{transform:scaleX(1.15) scaleY(.85)} 65%{transform:scaleX(.95) scaleY(1.05)} 75%{transform:scaleX(1.05) scaleY(.95)} 100%{transform:scale(1)} }
        @keyframes jelly { 0%,100%{transform:scale(1,1)} 25%{transform:scale(.9,1.1)} 50%{transform:scale(1.1,.9)} 75%{transform:scale(.95,1.05)} }
        @keyframes heartbeat { 0%,100%{transform:scale(1)} 10%{transform:scale(1.1)} 20%{transform:scale(1)} 30%{transform:scale(1.1)} 40%{transform:scale(1)} }
        @keyframes heartbeat-slow { 0%,100%{transform:scale(1)} 25%{transform:scale(1.05)} 50%{transform:scale(1)} 75%{transform:scale(1.05)} }
        @keyframes zoom-bounce { 0%{transform:scale(0)} 50%{transform:scale(1.1)} 75%{transform:scale(.95)} 100%{transform:scale(1)} }
        @keyframes punch { 0%{transform:scale(0)} 60%{transform:scale(1.2)} 100%{transform:scale(1)} }
        @keyframes squish { 0%,100%{transform:scaleX(1) scaleY(1)} 50%{transform:scaleX(1.2) scaleY(.8)} }
        @keyframes stretch-y { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.3)} }
        @keyframes stretch-x { 0%,100%{transform:scaleX(1)} 50%{transform:scaleX(1.3)} }
        @keyframes wobble { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-3deg)} 75%{transform:rotate(3deg)} }
        @keyframes swing { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }
        @keyframes hinge { 0%,100%{transform:rotate(0);transform-origin:top left} 25%,50%,75%{transform:rotate(80deg);transform-origin:top left} }
        @keyframes swing-pendulum { 0%,100%{transform:rotate(-8deg);transform-origin:top center} 50%{transform:rotate(8deg);transform-origin:top center} }

        @keyframes pulse-soft { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.05);opacity:.9} }
        @keyframes pulse-strong { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.15);opacity:.8} }
        @keyframes pulse-ring { 0%{box-shadow:0 0 0 0 var(--brand-300)} 70%{box-shadow:0 0 0 12px transparent} 100%{box-shadow:0 0 0 0 transparent} }
        @keyframes pulse-ring-large { 0%{box-shadow:0 0 0 0 var(--brand-200),0 0 0 0 var(--brand-300)} 100%{box-shadow:0 0 0 24px transparent,0 0 0 48px transparent} }
        @keyframes pulse-dot { 0%,100%{box-shadow:0 0 0 0 var(--brand-200);opacity:1} 50%{box-shadow:0 0 0 8px transparent;opacity:.7} }
        @keyframes glow-pulse { 0%,100%{box-shadow:0 0 0 0 var(--brand-200),0 0 20px var(--brand-100)} 50%{box-shadow:0 0 0 8px transparent,0 0 30px var(--brand-200)} }
        @keyframes glow-intense { 0%,100%{filter:brightness(1) drop-shadow(0 0 4px var(--brand-300))} 50%{filter:brightness(1.1) drop-shadow(0 0 12px var(--brand-300))} }
        @keyframes pulse-bg { 0%,100%{background-size:100% 100%} 50%{background-size:120% 120%} }

        @keyframes float-y { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
        @keyframes float-xy { 0%,100%{transform:translate(0,0)} 25%{transform:translate(4px,-4px)} 50%{transform:translate(0,-8px)} 75%{transform:translate(-4px,-4px)} }
        @keyframes float-3d { 0%,100%{transform:translateY(0) rotateX(0) rotateY(0)} 33%{transform:translateY(-10px) rotateX(5deg) rotateY(-5deg)} 66%{transform:translateY(5px) rotateX(-3deg) rotateY(4deg)} }
        @keyframes levitate { 0%,100%{transform:translateY(0) rotateZ(0)} 50%{transform:translateY(-15px) rotateZ(2deg)} }
        @keyframes orbit { 0%{transform:rotate(0) translateX(20px) rotate(0)} 100%{transform:rotate(360deg) translateX(20px) rotate(-360deg)} }
        @keyframes orbit-large { 0%{transform:rotate(0) translateX(80px) rotate(0)} 100%{transform:rotate(360deg) translateX(80px) rotate(-360deg)} }
        @keyframes hang { 0%,100%{transform:translateY(0) rotate(-1deg)} 50%{transform:translateY(2px) rotate(1deg)} }
        @keyframes pendulum { 0%,100%{transform:rotate(-10deg);transform-origin:top center} 50%{transform:rotate(10deg);transform-origin:top center} }
        @keyframes breath { 0%,100%{transform:scale(1)} 50%{transform:scale(1.02)} }
        @keyframes hum { 0%,100%{transform:translate(0,0)} 25%{transform:translate(.5px,-.5px)} 50%{transform:translate(-.5px,.5px)} 75%{transform:translate(.5px,.5px)} }

        @keyframes spin { to{transform:rotate(360deg)} }
        @keyframes spin-reverse { to{transform:rotate(-360deg)} }
        @keyframes spin-slow { from{transform:rotate(0)} to{transform:rotate(360deg)} }
        @keyframes spin-fast { from{transform:rotate(0)} to{transform:rotate(360deg)} }
        @keyframes spin-once { from{transform:rotate(0)} to{transform:rotate(360deg)} }
        @keyframes rotate-3d-x { from{transform:rotateX(0)} to{transform:rotateX(360deg)} }
        @keyframes rotate-3d-y { from{transform:rotateY(0)} to{transform:rotateY(360deg)} }
        @keyframes rotate-3d-z { from{transform:rotateZ(0)} to{transform:rotateZ(360deg)} }
        @keyframes roll-around { 0%{transform:rotate(0) translateX(0)} 100%{transform:rotate(360deg) translateX(0)} }
        @keyframes fan-rotate { 0%,100%{transform:rotate(-10deg)} 50%{transform:rotate(10deg)} }

        @keyframes shimmer { 0%{background-position:-200% 50%} 100%{background-position:200% 50%} }
        @keyframes shine { 0%{left:-100%} 100%{left:200%} }
        @keyframes tool-shine { 0%{transform:translateX(-100%) skewX(-20deg)} 100%{transform:translateX(200%) skewX(-20deg)} }
        @keyframes ripple { 0%{transform:translate(-50%,-50%) scale(0);opacity:.5} 100%{transform:translate(-50%,-50%) scale(4);opacity:0} }
        @keyframes ripple-large { 0%{transform:translate(-50%,-50%) scale(0);opacity:.6} 100%{transform:translate(-50%,-50%) scale(6);opacity:0} }
        @keyframes ripple-quick { 0%{transform:translate(-50%,-50%) scale(0);opacity:.7} 60%{transform:translate(-50%,-50%) scale(2.5);opacity:.3} 100%{transform:translate(-50%,-50%) scale(4);opacity:0} }
        @keyframes wave { 0%,100%{transform:scaleY(.5)} 50%{transform:scaleY(1)} }
        @keyframes wave-strong { 0%,100%{transform:scaleY(.3)} 50%{transform:scaleY(1.2)} }
        @keyframes wave-move { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
        @keyframes gradient-flow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        @keyframes gradient-border-flow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        @keyframes border-spin { to{transform:rotate(360deg)} }
        @keyframes tilt-shine { 0%{transform:translateX(-100%) translateY(-100%) rotate(45deg)} 100%{transform:translateX(100%) translateY(100%) rotate(45deg)} }
        @keyframes skeleton-shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
        @keyframes progress-stripes { 0%{background-position:0 0} 100%{background-position:40px 0} }
        @keyframes noise-shift { 0%{transform:translate(0,0)} 20%{transform:translate(-2%,1%)} 40%{transform:translate(1%,-2%)} 60%{transform:translate(-1%,2%)} 80%{transform:translate(2%,1%)} 100%{transform:translate(0,0)} }
        @keyframes dash-march { to{stroke-dashoffset:-200} }
        @keyframes check-draw { from{stroke-dashoffset:24} to{stroke-dashoffset:0} }
        @keyframes draw { from{stroke-dashoffset:100} to{stroke-dashoffset:0} }
        @keyframes draw-circle { from{stroke-dashoffset:300} to{stroke-dashoffset:0} }
        @keyframes draw-circle-reverse { from{stroke-dashoffset:0} to{stroke-dashoffset:300} }

        @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-3px) rotate(-1deg)} 40%,80%{transform:translateX(3px) rotate(1deg)} }

        @keyframes vibrate { 0%,100%{transform:translate(0)} 10%{transform:translate(-1px,-1px)} 20%{transform:translate(1px,-1px)} 30%{transform:translate(-1px,1px)} 40%{transform:translate(1px,1px)} 50%{transform:translate(-1px,-1px)} 60%{transform:translate(1px,-1px)} 70%{transform:translate(-1px,1px)} 80%{transform:translate(1px,1px)} 90%{transform:translate(-1px,-1px)} }

        @keyframes throw { 0%{transform:translate(0,0) rotate(0);opacity:1} 100%{transform:translate(100px,-100px) rotate(180deg);opacity:0} }
        @keyframes slide-in-right { from{transform:translateX(100%);opacity:0} to{transform:translateX(0);opacity:1} }

        @keyframes slide-out-right { from{transform:translateX(0);opacity:1} to{transform:translateX(100%);opacity:0} }

        @keyframes depth-pulse { 0%,100%{box-shadow:0 2px 4px rgba(0,0,0,.1),0 4px 8px rgba(0,0,0,.05)} 50%{box-shadow:0 6px 12px rgba(0,0,0,.15),0 12px 24px rgba(0,0,0,.1)} }

        @keyframes morph-fade { 0%,45%{opacity:1;transform:scale(1)} 50%,95%{opacity:0;transform:scale(.9)} 100%{opacity:1;transform:scale(1)} }

        @keyframes expand-circle { 0%{transform:scale(0);opacity:.8} 100%{transform:scale(2.5);opacity:0} }

        @keyframes count-bar { from{width:0} }

        @keyframes toast-out { 0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)} 100%{opacity:0;transform:translateX(-50%) translateY(20px) scale(.95)} }
        @keyframes notif-bounce { 0%{transform:translateY(-20px);opacity:0} 60%{transform:translateY(4px);opacity:1} 100%{transform:translateY(0);opacity:1} }
        @keyframes alert-pulse { 0%,100%{box-shadow:0 0 0 0 var(--danger);transform:scale(1)} 50%{box-shadow:0 0 0 8px transparent;transform:scale(1.05)} }

        @keyframes modal-spring { 0%{opacity:0;transform:scale(.85) translateY(30px)} 60%{opacity:1;transform:scale(1.02) translateY(-4px)} 100%{opacity:1;transform:scale(1) translateY(0)} }

        @keyframes overlay-in { from{opacity:0} to{opacity:1} }

        @keyframes blink-cursor { 0%,50%{opacity:1} 51%,100%{opacity:0} }

        /* ========== Base ========== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px; line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            overflow-x: hidden;
        }
        button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
        input, select, textarea { font: inherit; color: inherit; }
        img { display: block; max-width: 100%; }
        ::selection { background: var(--brand-200); color: var(--text); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

        /* ========== Background ========== */
        .bg-deco { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; background: var(--bg); }
        .bg-blob { position: absolute; border-radius: 50%; filter: blur(80px); will-change: transform; }
        .bg-blob.b1 { width: 480px; height: 480px; top: -200px; right: -150px; background: var(--brand-200); opacity: .45; animation: blob-float-1 28s ease-in-out infinite; }
        .bg-blob.b2 { width: 400px; height: 400px; bottom: -150px; left: -100px; background: var(--brand-100); opacity: .5; animation: blob-float-2 32s ease-in-out infinite; }
        .bg-blob.b3 { width: 360px; height: 360px; top: 40%; left: 50%; background: var(--accent); opacity: .08; transform: translate(-50%,-50%); animation: blob-float-3 36s ease-in-out infinite; }
        .bg-shape { position: absolute; pointer-events: none; opacity: .35; will-change: transform; }
        .bg-shape.s1 { top: 15%; left: 8%; width: 80px; height: 80px; background: linear-gradient(135deg, var(--brand-300), var(--brand-500)); border-radius: 20px; filter: blur(2px); animation: shape-float-1 14s ease-in-out infinite, shape-morph 8s ease-in-out infinite; }
        .bg-shape.s2 { top: 60%; right: 5%; width: 60px; height: 60px; background: linear-gradient(135deg, var(--accent), var(--brand-500)); border-radius: 50%; filter: blur(3px); animation: shape-float-2 18s ease-in-out infinite, shape-pulse 4s ease-in-out infinite; }
        .bg-shape.s3 { top: 75%; left: 12%; width: 50px; height: 50px; background: var(--brand-300); clip-path: polygon(50% 0, 100% 100%, 0 100%); filter: blur(2px); animation: shape-float-3 16s ease-in-out infinite, shape-spin 24s linear infinite; }
        .bg-shape.s4 { top: 25%; right: 12%; width: 70px; height: 70px; border: 2px solid var(--brand-400); border-radius: 50%; filter: blur(1px); animation: shape-float-1 20s ease-in-out infinite reverse, spin-reverse 32s linear infinite; }
        .bg-shape.s5 { top: 50%; left: 5%; width: 40px; height: 40px; background: linear-gradient(135deg, var(--brand-200), var(--brand-400)); clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); filter: blur(2px); animation: shape-float-2 22s ease-in-out infinite, shape-swing 6s ease-in-out infinite; }
        .bg-shape.s6 { top: 35%; right: 25%; width: 50px; height: 50px; background: linear-gradient(135deg, var(--brand-100), var(--brand-300)); border-radius: 50%; filter: blur(4px); animation: shape-float-4 17s ease-in-out infinite, hue-rotate 24s linear infinite; }
        .bg-grid { position: absolute; inset: 0; background-image: radial-gradient(circle at 1px 1px, var(--border-strong) 1px, transparent 0); background-size: 40px 40px; opacity: .25; mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 80%); -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 80%); }

        /* Click effects (live in body, no clipping) */
        .click-ripple-host { position: fixed; inset: 0; pointer-events: none; z-index: 9998; overflow: visible; }
        .click-ripple { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--brand-500); transform: translate(-50%,-50%) scale(0); pointer-events: none; }
        .click-ripple.go { animation: ripple-quick .8s var(--ease-out) forwards; }
        .click-ripple.large { width: 20px; height: 20px; }
        .click-ripple.large.go { animation: ripple-large 1s var(--ease-out) forwards; }

        .click-flash { position: absolute; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--brand-500); transform: translate(-50%,-50%) scale(0); pointer-events: none; }
        .click-flash.go { animation: click-ring .6s var(--ease-out) forwards; }

        .click-shockwave { position: absolute; width: 60px; height: 60px; border-radius: 50%; background: var(--brand-500); opacity: .3; transform: translate(-50%,-50%) scale(0); pointer-events: none; }
        .click-shockwave.go { animation: click-shockwave .8s var(--ease-out) forwards; }

        .burst-host { position: absolute; width: 0; height: 0; pointer-events: none; }
        .burst-particle { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--brand-400); pointer-events: none; }
        .burst-particle.go { animation: burst-particle .8s var(--ease-out) forwards; }

        .star-burst { position: fixed; pointer-events: none; z-index: 9997; width: 60px; height: 60px; transform: translate(-50%,-50%); }
        .star-burst svg { width: 100%; height: 100%; color: var(--brand-500); animation: star-burst .8s var(--ease-out) forwards; }

        .confetti-host { position: fixed; inset: 0; pointer-events: none; z-index: 9996; overflow: hidden; }
        .confetti-piece { position: absolute; width: 10px; height: 10px; top: 30%; animation: confetti 1.5s var(--ease-out) forwards; }

        .mouse-glow { position: fixed; pointer-events: none; z-index: 0; width: 600px; height: 600px; border-radius: 50%; background: var(--grad-bg); filter: blur(100px); opacity: .25; transform: translate(-50%, -50%); will-change: transform; animation: hue-rotate 30s linear infinite; }

        .particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .particle { position: absolute; bottom: -10px; width: 4px; height: 4px; border-radius: 50%; background: var(--brand-400); opacity: .5; animation: particle-rise linear infinite; }
        .cursor-trail { position: fixed; pointer-events: none; width: 8px; height: 8px; border-radius: 50%; background: var(--brand-500); transform: translate(-50%,-50%); z-index: 9995; animation: cursor-trail-fade .8s var(--ease-out) forwards; mix-blend-mode: difference; }

        /* ========== Topbar ========== */
        .topbar {
            position: sticky; top: 0; z-index: 50;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            animation: slide-down .6s var(--ease-out) backwards;
        }
        .topbar::after {
            content: '';
            position: absolute; left: 0; right: 0; bottom: 0;
            height: 2px;
            background: var(--grad);
            background-size: 200% 200%;
            transform-origin: left;
            animation: gradient-flow 4s ease infinite, count-bar 1.2s var(--ease-out) .5s backwards;
        }
        .topbar-inner {
            max-width: 1280px; margin: 0 auto; padding: 14px 24px;
            display: flex; align-items: center; gap: 20px; justify-content: space-between;
        }
        .brand { display: flex; align-items: center; gap: 12px; animation: slide-right .6s var(--ease-out) .1s backwards; }
        .brand-mark {
            width: 40px; height: 40px; border-radius: var(--radius-md);
            background: var(--grad); background-size: 200% 200%;
            animation: gradient-flow 6s ease infinite, scale-pop .6s var(--ease-spring) .2s backwards;
            display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 20px;
            box-shadow: var(--shadow-brand);
        }
        .brand-text { display: flex; flex-direction: column; line-height: 1.2; }
        .brand-name { font-weight: 700; font-size: 16px; color: var(--text); letter-spacing: -.01em; }
        .brand-sub { font-size: 11px; color: var(--text-3); margin-top: 1px; font-weight: 500; }

        .top-meta { display: flex; align-items: center; gap: 12px; animation: slide-right .6s var(--ease-out) .2s backwards; }
        .status-pill {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 12px;
            background: var(--brand-50);
            border: 1px solid var(--brand-200);
            color: var(--brand-700);
            font-size: 12px; font-weight: 600;
            border-radius: 999px;
        }
        .status-pill:hover { transform: translateY(-2px); box-shadow: 0 4px 12px var(--brand-200); }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand-500); animation: pulse-dot 2s ease-in-out infinite; }

        .theme-picker {
            display: flex; align-items: center; gap: 5px;
            padding: 4px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            position: relative;
        }
        .theme-dot {
            width: 22px; height: 22px;
            border-radius: 50%;
            border: 2px solid var(--surface);
            position: relative; cursor: pointer;
            box-shadow: 0 0 0 1px var(--border);
            transition: transform .3s var(--ease-spring), box-shadow .3s var(--ease-spring);
        }
        .theme-dot[data-th="mint"]     { background: linear-gradient(135deg, #10b981, #6366f1); }
        .theme-dot[data-th="indigo"]   { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
        .theme-dot[data-th="sunset"]   { background: linear-gradient(135deg, #f97316, #f43f5e); }
        .theme-dot[data-th="rose"]     { background: linear-gradient(135deg, #f43f5e, #8b5cf6); }
        .theme-dot[data-th="ocean"]    { background: linear-gradient(135deg, #06b6d4, #3b82f6); }
        .theme-dot[data-th="forest"]   { background: linear-gradient(135deg, #22c55e, #84cc16); }
        .theme-dot[data-th="lavender"] { background: linear-gradient(135deg, #a855f7, #ec4899); }
        .theme-dot[data-th="amber"]    { background: linear-gradient(135deg, #f59e0b, #ef4444); }
        .theme-dot[data-th="graphite"] { background: linear-gradient(135deg, #475569, #1e293b); }
        .theme-dot[data-th="candy"]    { background: linear-gradient(135deg, #ec4899, #06b6d4); }
        .theme-dot:hover { transform: scale(1.2) rotate(20deg); }
        .theme-dot:active { animation: tap-shrink .3s var(--ease-spring); }
        .theme-dot.active { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--brand-500); transform: scale(1.1); animation: click-bounce-back .4s var(--ease-spring); }
        .theme-dot.active::after {
            content: ''; position: absolute; inset: -3px;
            border-radius: 50%; border: 2px solid var(--brand-500);
            animation: pulse-ring 1.5s ease-out infinite;
        }

        @media (max-width: 880px) { .top-meta .status-pill { display: none; } }

        /* ========== Page Layout ========== */
        .page { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 24px; }

        /* ========== Hero ========== */
        .hero {
            position: relative; padding: 36px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-sm);
            margin-bottom: 24px;
            animation: slide-up .7s var(--ease-out) .3s backwards;
        }
        .hero::before {
            content: ''; position: absolute;
            top: 0; right: 0;
            width: 500px; height: 100%;
            background: var(--grad-soft);
            border-radius: 50%;
            filter: blur(60px);
            transform: translate(30%, -20%);
            animation: hero-bg-float 18s ease-in-out infinite, hue-rotate 30s linear infinite;
            pointer-events: none;
        }
        .hero-content {
            position: relative; z-index: 1;
            display: grid; grid-template-columns: 1fr auto;
            gap: 32px; align-items: center;
        }
        .hero-text { max-width: 640px; }
        .hero-tag {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 12px;
            background: var(--brand-50);
            border: 1px solid var(--brand-200);
            color: var(--brand-700);
            font-size: 12px; font-weight: 600;
            border-radius: 999px;
            margin-bottom: 18px;
            animation: slide-up .5s var(--ease-out) .5s backwards, attention 4s ease-in-out 2s infinite;
        }
        .hero-tag .tag-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand-500); animation: pulse-soft 1.5s ease-in-out infinite, hue-rotate 8s linear infinite; }
        .hero h1 {
            font-size: 36px; font-weight: 800; line-height: 1.18;
            letter-spacing: -.025em; color: var(--text);
            margin-bottom: 14px;
            animation: slide-up .6s var(--ease-out) .6s backwards;
        }
        .hero h1 .word { display: inline-block; opacity: 0; transform: translateY(20px); animation: text-reveal .6s var(--ease-out) forwards, levitate 8s ease-in-out 2s infinite; }
        .hero h1 .hl {
            background: var(--grad); background-size: 200% 200%;
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-flow 4s ease infinite;
            position: relative; display: inline-block;
        }
        .hero h1 .hl::after {
            content: ''; position: absolute; left: 0; right: 0; bottom: -4px;
            height: 3px; background: var(--grad); background-size: 200% 200%;
            border-radius: 2px; transform: scaleX(0); transform-origin: left;
            animation: gradient-flow 4s ease infinite, count-bar 1s var(--ease-out) 1.2s forwards;
        }
        .hero-sub { color: var(--text-2); font-size: 15px; margin-bottom: 24px; max-width: 580px; animation: slide-up .5s var(--ease-out) .9s backwards; }

        .hero-stats { display: grid; gap: 12px; grid-template-columns: repeat(4, 1fr); animation: slide-up .5s var(--ease-out) 1.0s backwards; }
        .stat {
            position: relative; padding: 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            display: flex; flex-direction: column; gap: 4px;
            cursor: pointer;
            animation: pile .5s var(--ease-spring) backwards;
        }
        .stat:nth-child(1) { animation-delay: 1.1s; }
        .stat:nth-child(2) { animation-delay: 1.2s; }
        .stat:nth-child(3) { animation-delay: 1.3s; }
        .stat:nth-child(4) { animation-delay: 1.4s; }
        .stat:hover { transform: translateY(-3px) scale(1.02); box-shadow: var(--shadow-md); border-color: var(--brand-300); }
        .stat:active { animation: tap-shrink .3s var(--ease-spring); }
        .stat::before {
            content: ''; position: absolute; left: 0; bottom: 0;
            height: 2px; width: 0; background: var(--grad);
            border-radius: 2px;
            transition: width 1.2s var(--ease-out);
        }
        .stat.in-view::before { width: 100%; }
        .stat-icon {
            width: 28px; height: 28px; display: grid; place-items: center;
            background: var(--grad-soft); color: var(--brand-600);
            border-radius: 8px; margin-bottom: 4px;
            transition: transform .3s var(--ease-spring);
        }
        .stat:hover .stat-icon { transform: rotate(15deg) scale(1.15); animation: spin-once .6s var(--ease-spring); }
        .stat-icon svg { width: 14px; height: 14px; }
        .stat-val { font-size: 22px; font-weight: 800; color: var(--text); font-family: 'JetBrains Mono', monospace; letter-spacing: -.02em; }
        .stat:hover .stat-val { color: var(--brand-600); }
        .stat-lbl { font-size: 11px; color: var(--text-3); font-weight: 500; }

        .hero-showcase {
            position: relative; width: 280px; height: 200px;
            border-radius: var(--radius-xl); overflow: visible;
            background: var(--grad); background-size: 200% 200%;
            animation: gradient-flow 6s ease infinite, scale-pop .8s var(--ease-spring) .8s backwards, levitate 6s ease-in-out 2s infinite;
            box-shadow: var(--shadow-brand);
            transform-style: preserve-3d;
        }
        .showcase-frame { position: absolute; inset: 0; border-radius: var(--radius-xl); overflow: hidden; background: #1a1a1a; }
        .showcase-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; animation: morph-fade 16s var(--ease-out) infinite; }
        .showcase-img:nth-child(1) { animation-delay: 0s; }
        .showcase-img:nth-child(2) { animation-delay: 4s; }
        .showcase-img:nth-child(3) { animation-delay: 8s; }
        .showcase-img:nth-child(4) { animation-delay: 12s; }
        .showcase-label {
            position: absolute; bottom: 8px; left: 8px; right: 8px;
            padding: 8px 12px; background: rgba(0,0,0,.65); color: #fff;
            font-size: 11px; font-weight: 600;
            display: flex; align-items: center; gap: 6px;
        }
        .showcase-label .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand-400); animation: pulse-soft 1.5s ease-in-out infinite; }
        .showcase-corners { position: absolute; inset: 0; pointer-events: none; }
        .showcase-corners::before, .showcase-corners::after, .showcase-corners > span { content: ''; position: absolute; width: 14px; height: 14px; border: 2px solid #fff; }
        .showcase-corners::before { top: 4px; left: 4px; border-right: 0; border-bottom: 0; border-top-left-radius: 6px; }
        .showcase-corners::after { top: 4px; right: 4px; border-left: 0; border-bottom: 0; border-top-right-radius: 6px; }
        .showcase-corners > span:nth-child(1) { bottom: 4px; left: 4px; border-right: 0; border-top: 0; border-bottom-left-radius: 6px; }
        .showcase-corners > span:nth-child(2) { bottom: 4px; right: 4px; border-left: 0; border-top: 0; border-bottom-right-radius: 6px; }

        @media (max-width: 880px) { .hero-content { grid-template-columns: 1fr; } .hero-showcase { display: none; } }
        @media (max-width: 720px) { .hero { padding: 24px 20px; } .hero h1 { font-size: 24px; } .hero-sub { font-size: 14px; } .hero-stats { grid-template-columns: repeat(2, 1fr); } }

        /* ========== Workspace ========== */
        .workspace { display: grid; gap: 20px; }
        @media (min-width: 1024px) { .workspace { grid-template-columns: 380px 1fr; align-items: start; } .col-left { position: sticky; top: 88px; } }
        @media (max-width: 1023px) { .workspace { grid-template-columns: 1fr; } }

        /* ========== Tabs ========== */
        .tab-bar { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: 16px; overflow-x: auto; }
        .tab {
            padding: 8px 14px; font-size: 13px; font-weight: 600;
            color: var(--text-2); border-radius: 8px;
            transition: all .25s var(--ease-out);
            white-space: nowrap; position: relative;
        }
        .tab::before {
            content: ''; position: absolute; bottom: 4px; left: 50%;
            width: 0; height: 2px; background: var(--grad);
            border-radius: 2px; transform: translateX(-50%);
            transition: width .3s var(--ease-out);
        }
        .tab:hover { color: var(--text); background: var(--bg-soft); transform: translateY(-1px); }
        .tab:hover::before { width: 20%; }
        .tab:active { animation: tap-shrink .3s var(--ease-spring); }
        .tab.active {
            color: #fff; background: var(--grad); background-size: 200% 200%;
            animation: gradient-flow 4s ease infinite, pulse-soft 3s ease-in-out infinite;
            box-shadow: var(--shadow-sm);
        }
        .tab.active::before { display: none; }

        /* ========== Card ========== */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            margin-bottom: 16px;
            position: relative;
        }
        .card::before {
            content: ''; position: absolute; inset: 0;
            border-radius: var(--radius-xl);
            padding: 1px;
            background: linear-gradient(135deg, var(--brand-300), var(--accent), var(--brand-500));
            background-size: 200% 200%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            opacity: 0; transition: opacity .4s;
            pointer-events: none;
            animation: gradient-border-flow 4s ease infinite;
        }
        .card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .card:hover::before { opacity: .4; }
        .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
        .card-title { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; color: var(--text); }
        .step-num {
            width: 24px; height: 24px; display: grid; place-items: center;
            background: var(--grad); background-size: 200% 200%; color: #fff;
            font-size: 11px; font-weight: 700; border-radius: 7px;
            animation: gradient-flow 4s ease infinite, pulse-soft 3s ease-in-out infinite;
        }
        .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; background: var(--bg-soft); border: 1px solid var(--border); color: var(--text-2); font-size: 11px; font-weight: 600; border-radius: 999px; }
        .badge.success { background: var(--brand-50); color: var(--brand-700); border-color: var(--brand-200); animation: glow-pulse 2.5s ease-in-out infinite; }
        .card-body { padding: 20px; }

        /* ========== Dropzone ========== */
        .dropzone {
            position: relative; padding: 32px 20px; text-align: center; cursor: pointer;
            background: var(--bg-soft);
            border: 2px dashed var(--border-strong);
            border-radius: var(--radius-lg);
            transition: all .3s var(--ease-out);
        }
        .dropzone::before {
            content: ''; position: absolute; inset: 0;
            background: var(--grad-soft);
            border-radius: var(--radius-lg);
            opacity: 0; transition: opacity .3s;
        }
        .dropzone:hover, .dropzone.dragover {
            border-color: var(--brand-500); border-style: solid;
            transform: scale(1.01);
        }
        .dropzone:hover::before, .dropzone.dragover::before { opacity: 1; }
        .dropzone.dragover { animation: drag-pulse 1.2s ease-in-out infinite, shake-soft .3s ease-in-out infinite; }
        .dropzone:active { animation: tap-shrink .3s var(--ease-spring); }
        .drop-icon {
            width: 56px; height: 56px; margin: 0 auto 14px;
            display: grid; place-items: center;
            background: var(--grad); background-size: 200% 200%;
            color: #fff; border-radius: var(--radius-lg);
            box-shadow: var(--shadow-brand);
            transition: transform .3s var(--ease-spring);
            animation: gradient-flow 4s ease infinite, float-y 3s ease-in-out infinite, pulse-soft 2s ease-in-out infinite;
            position: relative;
        }
        .dropzone:hover .drop-icon { transform: translateY(-3px) scale(1.08) rotate(-3deg); box-shadow: 0 12px 32px var(--brand-300); }
        .dropzone.dragover .drop-icon { animation: drop-bounce .8s ease-in-out infinite, shape-spin 2s linear infinite; }
        .drop-icon svg { width: 26px; height: 26px; animation: arrow-bounce 1.5s ease-in-out infinite; }
        .drop-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 4px; position: relative; }
        .drop-hint { font-size: 12px; color: var(--text-3); position: relative; }

        .img-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; margin-top: 16px; }
        .img-card {
            position: relative; aspect-ratio: 1; overflow: hidden;
            background: var(--bg-soft); border: 2px solid transparent;
            border-radius: var(--radius-md); cursor: pointer;
            animation: scale-pop-soft .4s var(--ease-spring) backwards;
            transform-style: preserve-3d;
        }
        .img-card img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s var(--ease-out); }
        .img-card:hover { box-shadow: var(--shadow-md); }
        .img-card:hover img { transform: scale(1.08) rotate(1deg); }
        .img-card.selected {
            border-color: var(--brand-500);
            box-shadow: 0 0 0 3px var(--brand-100);
            animation: scale-pop-soft .4s var(--ease-spring), glow-pulse 2.4s ease-in-out .4s infinite;
        }
        .img-card .check { position: absolute; top: 6px; left: 6px; width: 22px; height: 22px; background: var(--brand-500); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; border-radius: 50%; opacity: 0; transform: scale(.3) rotate(-180deg); transition: all .3s var(--ease-spring); }
        .img-card.selected .check { opacity: 1; transform: scale(1) rotate(0); }
        .img-card .del { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; background: rgba(255,255,255,.95); color: var(--danger); display: grid; place-items: center; font-size: 16px; line-height: 1; border-radius: 50%; opacity: 0; transform: scale(.5) rotate(0); transition: all .3s var(--ease-spring); }
        .img-card:hover .del { opacity: 1; transform: scale(1) rotate(0); }
        .img-card .del:hover { background: var(--danger); color: #fff; transform: scale(1.1) rotate(90deg); }
        .img-card .tag { position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 8px 6px; background: linear-gradient(to top, rgba(0,0,0,.7), transparent); color: #fff; font-size: 10px; font-weight: 500; display: flex; justify-content: space-between; opacity: .9; transform: translateY(4px); transition: transform .3s var(--ease-out); }
        .img-card:hover .tag { transform: translateY(0); }

        .list-bar { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
        .list-bar .spacer { flex: 1; }
        .btn-text { padding: 6px 12px; font-size: 12px; font-weight: 600; color: var(--text-2); border-radius: 6px; transition: all .2s var(--ease-out); }
        .btn-text:hover { background: var(--bg-soft); color: var(--text); transform: translateY(-1px); }
        .btn-text:active { animation: tap-shrink .3s var(--ease-spring); }
        .btn-text.danger:hover { background: #fef2f2; color: var(--danger); }

        /* ========== Tools Grid ========== */
        .tools-empty { padding: 40px 20px; text-align: center; color: var(--text-3); animation: fade-in .4s var(--ease-out); }
        .tools-empty img { width: 160px; height: 160px; margin: 0 auto 16px; display: block; animation: float-3d 6s ease-in-out infinite, shape-spin 20s linear infinite; }
        .tools-empty .t { font-size: 15px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
        .tools-empty .d { font-size: 13px; color: var(--text-3); }

        .tools-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
        .tool {
            position: relative; padding: 16px 8px;
            text-align: center; cursor: pointer;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            border-radius: var(--radius-md);
            animation: scale-pop-soft .5s var(--ease-spring) backwards;
        }
        .tool::before {
            content: ''; position: absolute; inset: 0;
            background: var(--grad);
            opacity: 0;
            transition: opacity .3s var(--ease-out);
            border-radius: var(--radius-md);
        }
        .tool .ico {
            width: 40px; height: 40px; display: grid; place-items: center;
            color: var(--brand-500); background: var(--brand-50);
            border-radius: 10px;
            transition: all .3s var(--ease-spring);
            position: relative; z-index: 1;
        }
        .tool .ico svg { width: 20px; height: 20px; transition: transform .3s var(--ease-spring); }
        .tool:hover .ico svg { transform: rotate(-15deg) scale(1.2); }
        .tool .lbl { font-size: 12px; font-weight: 600; color: var(--text-2); position: relative; z-index: 1; transition: color .3s var(--ease-out); }
        .tool:hover { border-color: var(--brand-300); transform: translateY(-6px) scale(1.05); box-shadow: var(--shadow-md); }
        .tool:hover::before { opacity: 1; }
        .tool:hover .ico { background: var(--grad); background-size: 200% 200%; color: #fff; transform: scale(1.1) rotate(10deg); animation: gradient-flow 3s ease infinite, pulse-soft 1.5s ease-in-out infinite; }
        .tool:hover .lbl { color: #fff; }
        .tool:active { animation: tap-shrink .3s var(--ease-spring); }
        .tool.applied { border-color: var(--brand-500); background: var(--brand-50); animation: shake .5s var(--ease-out), glow-pulse 2s ease-in-out infinite; }
        .tool.applied .ico { background: var(--brand-500); color: #fff; }
        .tool.applied .lbl { color: var(--brand-700); }

        /* ========== Results ========== */
        .result-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
        .result {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-md);
            animation: card-pop .5s var(--ease-spring) backwards, breath 4s ease-in-out infinite;
        }
        .result:hover { transform: translateY(-4px) scale(1.02); box-shadow: var(--shadow-md), 0 0 0 1px var(--brand-200); border-color: var(--brand-300); }
        .result img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--bg-soft); transition: transform .4s var(--ease-out); }
        .result:hover img { transform: scale(1.06); }
        .result .r-info { padding: 12px 14px; }
        .result .r-name { font-size: 12px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color .3s; }
        .result:hover .r-name { color: var(--brand-600); }
        .result .r-meta { font-size: 11px; color: var(--text-3); margin-top: 4px; display: flex; justify-content: space-between; }
        .result .r-dl {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            margin-top: 10px; padding: 7px 12px; width: 100%;
            background: var(--grad); background-size: 200% 200%; color: #fff;
            font-size: 12px; font-weight: 600; border-radius: 8px;
            animation: gradient-flow 5s ease infinite;
            position: relative;
        }
        .result .r-dl:hover { transform: translateY(-2px) scale(1.03); box-shadow: var(--shadow-brand); }
        .result .r-dl:active { animation: tap-shrink .3s var(--ease-spring); }
        .result .r-dl svg { width: 12px; height: 12px; }

        .actions-row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

        /* ========== Buttons (key) ========== */
        .btn {
            padding: 10px 18px;
            font-size: 13px; font-weight: 600;
            display: inline-flex; align-items: center; gap: 6px;
            border-radius: 10px;
            position: relative;
            transition: transform .2s var(--ease-spring), box-shadow .2s var(--ease-out), background-color .2s, color .2s, border-color .2s;
        }
        .btn svg { width: 14px; height: 14px; }
        .btn-primary {
            background: var(--grad); background-size: 200% 200%; color: #fff;
            box-shadow: var(--shadow-sm);
            animation: gradient-flow 5s ease infinite;
        }
        .btn-primary:hover { transform: translateY(-3px) scale(1.05); box-shadow: var(--shadow-brand); }
        .btn-primary:active { animation: click-bounce-back .4s var(--ease-spring); }
        .btn-secondary {
            background: var(--surface); color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { background: var(--bg-soft); border-color: var(--border-strong); transform: translateY(-3px) scale(1.05); }
        .btn-secondary:active { animation: click-bounce-back .4s var(--ease-spring); }
        .btn:disabled { opacity: .5; cursor: not-allowed; }

        .skeleton { background: linear-gradient(90deg, var(--bg-soft) 0%, var(--border) 50%, var(--bg-soft) 100%); background-size: 200% 100%; animation: skeleton-shimmer 1.5s ease-in-out infinite; border-radius: var(--radius-md); }
        .skeleton-card { aspect-ratio: 1; border-radius: var(--radius-md); }

        /* ========== Modal ========== */
        .modal-bg { position: fixed; inset: 0; background: rgba(28, 25, 23, .5); display: grid; place-items: center; z-index: 100; opacity: 0; pointer-events: none; padding: 20px; }
        .modal-bg.show { opacity: 1; pointer-events: auto; animation: fade-in .3s var(--ease-out) forwards; }
        .modal { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-2xl); width: 100%; max-width: 480px; box-shadow: var(--shadow-lg); max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; transform: scale(.9) translateY(30px); opacity: 0; }
        .modal-bg.show .modal { animation: modal-spring .5s var(--ease-spring) .05s forwards; }
        .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--border); background: var(--bg-soft); position: relative; }
        .modal-head::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--grad); background-size: 200% 200%; animation: gradient-flow 4s ease infinite; }
        .modal-title { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 16px; }
        .modal-title .ico { width: 36px; height: 36px; display: grid; place-items: center; color: var(--brand-500); background: var(--brand-50); border-radius: 10px; transition: all .3s var(--ease-spring); animation: scale-pop .5s var(--ease-spring) .2s backwards, pulse-soft 3s ease-in-out infinite; }
        .modal-title:hover .ico { transform: rotate(15deg) scale(1.15); }
        .modal-title .ico svg { width: 18px; height: 18px; }
        .modal-close { width: 32px; height: 32px; display: grid; place-items: center; color: var(--text-3); border-radius: 8px; transition: all .2s var(--ease-spring); }
        .modal-close:hover { background: var(--bg-soft); color: var(--danger); transform: rotate(90deg) scale(1.15); }
        .modal-close:active { animation: tap-shrink .3s var(--ease-spring); }
        .modal-close svg { width: 16px; height: 16px; }
        .modal-body { padding: 20px 22px; overflow-y: auto; flex: 1; }
        .modal-desc { font-size: 13px; color: var(--text-2); margin-bottom: 16px; line-height: 1.6; animation: slide-up .4s var(--ease-out) .15s backwards; }
        .modal-scope { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--brand-50); border: 1px solid var(--brand-200); color: var(--brand-700); font-size: 11px; font-weight: 600; border-radius: 999px; margin-bottom: 18px; animation: scale-pop .4s var(--ease-spring) .2s backwards; }
        .modal-scope svg { width: 12px; height: 12px; }
        .field { margin-bottom: 16px; animation: slide-up .4s var(--ease-out) backwards; }
        .field-label { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 8px; }
        .field-label .val { color: var(--brand-600); font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; background: var(--brand-50); padding: 2px 8px; border-radius: 4px; transition: all .2s var(--ease-spring); }
        .field-input { width: 100%; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 14px; border-radius: 10px; transition: all .25s var(--ease-out); }
        .field-input:hover { border-color: var(--border-strong); }
        .field-input:focus { outline: none; border-color: var(--brand-500); box-shadow: 0 0 0 3px var(--brand-100); transform: translateY(-1px); }
        .field-input[type="color"] { padding: 4px; height: 42px; cursor: pointer; }
        .range-row { display: flex; align-items: center; gap: 12px; }
        .range-row input[type="range"] { flex: 1; -webkit-appearance: none; appearance: none; height: 6px; background: linear-gradient(to right, var(--brand-500) 0%, var(--brand-500) var(--pct, 50%), var(--border) var(--pct, 50%), var(--border) 100%); border-radius: 3px; outline: none; transition: background .15s; }
        .range-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; background: var(--grad); background-size: 200% 200%; cursor: pointer; border-radius: 50%; box-shadow: var(--shadow-sm); transition: all .2s var(--ease-spring); animation: gradient-flow 4s ease infinite, pulse-soft 2s ease-in-out infinite; }
        .range-row input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.3); box-shadow: 0 0 0 6px var(--brand-100), var(--shadow-sm); }
        .range-row input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; background: var(--brand-500); cursor: pointer; border-radius: 50%; border: none; box-shadow: var(--shadow-sm); }
        .range-val { min-width: 64px; text-align: right; font-size: 12px; font-weight: 600; color: var(--brand-600); font-family: 'JetBrains Mono', monospace; transition: transform .2s var(--ease-spring); }
        .range-val.bump { animation: pulse-soft .3s var(--ease-spring); }
        .modal-foot { padding: 16px 22px; display: flex; gap: 10px; border-top: 1px solid var(--border); background: var(--bg-soft); }
        .modal-foot .btn { flex: 1; justify-content: center; padding: 12px; }

        /* ========== Progress / Toast / Loading ========== */
        .progress { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 200; opacity: 0; }
        .progress.show { opacity: 1; }
        .progress-fill { height: 100%; width: 0%; background: var(--grad); background-image: var(--grad), repeating-linear-gradient(45deg, transparent 0, rgba(255,255,255,.3) 10px, rgba(255,255,255,.3) 20px, transparent 20px, transparent 40px); background-size: 40px 40px; transition: width .3s var(--ease-out); box-shadow: 0 0 12px var(--brand-300); animation: progress-stripes 1s linear infinite; }
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--text); color: #fff; padding: 12px 20px; font-size: 13px; font-weight: 500; border-radius: 10px; box-shadow: var(--shadow-lg); z-index: 300; opacity: 0; display: flex; align-items: center; gap: 8px; }
        .toast.show { animation: toast-in .5s var(--ease-spring) forwards; }
        .toast.success { background: var(--brand-600); }
        .toast.error { background: var(--danger); }
        .toast::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .7; animation: pulse-soft 1.5s ease-in-out infinite; }
        .loading { position: fixed; inset: 0; background: rgba(28, 25, 23, .5); display: grid; place-items: center; z-index: 150; opacity: 0; pointer-events: none; }
        .loading.show { opacity: 1; pointer-events: auto; animation: fade-in .3s var(--ease-out) forwards; }
        .loading-box { background: var(--surface); border: 1px solid var(--border); padding: 28px 36px; text-align: center; min-width: 240px; border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); animation: modal-spring .5s var(--ease-spring) forwards; position: relative; overflow: hidden; }
        .loading-box::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--grad); background-size: 200% 200%; animation: gradient-flow 2s ease infinite; }
        .spinner { width: 48px; height: 48px; margin: 0 auto 14px; position: relative; }
        .spinner::before, .spinner::after, .spinner > i { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; }
        .spinner::before { border-top-color: var(--brand-500); border-right-color: var(--brand-300); animation: spin 1s linear infinite; }
        .spinner::after { border-bottom-color: var(--accent); border-left-color: var(--brand-200); animation: spin 1.5s linear infinite reverse; }
        .spinner > i { inset: 6px; border-top-color: var(--brand-400); animation: spin .8s linear infinite, hue-rotate 4s linear infinite; }
        .loading-txt { font-size: 13px; color: var(--text-2); font-weight: 500; animation: pulse-soft 1.5s ease-in-out infinite; }

        /* ========== Responsive ========== */
        @media (max-width: 720px) {

            .theme-dot { width: 18px; height: 18px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }

        /* ============ Click Effects (always visible, no clipping) ============ */
        function spawnClickEffects(x, y, options = {}) {
            const { color, large } = options;

            // 1. Main ripple
            const r1 = document.createElement('div');
            r1.className = 'click-ripple' + (large ? ' large' : '') + ' go';
            r1.style.left = x + 'px';
            r1.style.top = y + 'px';
            if (color) r1.style.background = color;
            rippleHost.appendChild(r1);
            setTimeout(() => r1.remove(), 1000);

            // 2. Shockwave (background)
            const r2 = document.createElement('div');
            r2.className = 'click-shockwave go';
            r2.style.left = x + 'px';
            r2.style.top = y + 'px';
            if (color) r2.style.background = color;
            rippleHost.appendChild(r2);
            setTimeout(() => r2.remove(), 900);

            // 3. Ring
            const r3 = document.createElement('div');
            r3.className = 'click-flash go';
            r3.style.left = x + 'px';
            r3.style.top = y + 'px';
            if (color) r3.style.borderColor = color;
            rippleHost.appendChild(r3);
            setTimeout(() => r3.remove(), 700);
        }

        function spawnStarBurst(x, y, color) {
            const burst = document.createElement('div');
            burst.className = 'star-burst';
            burst.style.left = x + 'px';
            burst.style.top = y + 'px';
            if (color) burst.style.color = color;
            burst.innerHTML = '<svg viewBox="0 0 80 80" fill="currentColor"><path d="M40 0L48 32L80 40L48 48L40 80L32 48L0 40L32 32Z" opacity=".8"/><path d="M40 10L45 35L70 40L45 45L40 70L35 45L10 40L35 35Z" opacity=".5"/></svg>';
            document.body.appendChild(burst);
            setTimeout(() => burst.remove(), 850);
        }

        function spawnBurstParticles(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'burst-particle go';
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                if (color) p.style.background = color;
                const angle = (i / count) * Math.PI * 2;
                const dist = 30 + Math.random() * 30;
                p.style.setProperty('--bx', Math.cos(angle) * dist + 'px');
                p.style.setProperty('--by', Math.sin(angle) * dist + 'px');
                rippleHost.appendChild(p);
                setTimeout(() => p.remove(), 900);
            }
        }

        function launchConfetti(x, y, count = 30) {
            const colors = ['#10b981', '#6366f1', '#8b5cf6', '#f97316', '#f43f5e', '#fbbf24', '#06b6d4', '#a855f7', '#22c55e'];
            for (let i = 0; i < count; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = x + 'px';
                piece.style.top = y + 'px';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.setProperty('--dx', (Math.random() - 0.5) * 200 + 'px');
                piece.style.animationDelay = (Math.random() * 0.2) + 's';
                piece.style.transform = `rotate(${Math.random() * 360}deg)`;
                if (Math.random() > 0.5) piece.style.borderRadius = '50%';
                confettiHost.appendChild(piece);
                setTimeout(() => piece.remove(), 2000);
            }
        }

        /* ============ Global click handler ============ */
        document.addEventListener('click', e => {
            // Get click coords
            const x = e.clientX;
            const y = e.clientY;

            // Always spawn basic ripple
            const target = e.target.closest('.btn, .tool, .tab, .theme-dot, .status-pill, .modal-close, .btn-text, .stat, .dropzone');
            const isTheme = e.target.closest('.theme-dot');
            const isTool = e.target.closest('.tool');
            const isBtn = e.target.closest('.btn');

            spawnClickEffects(x, y, {
                large: isTheme,
                color: isTheme ? getComputedStyle(isTheme).background.match(/rgb[^)]+/)?.[0] : null
            });

            if (isTool) {
                const rect = isTool.getBoundingClientRect();
                const cx = rect.left + rect.width/2;
                const cy = rect.top + rect.height/2;
                setTimeout(() => {
                    spawnStarBurst(cx, cy, getComputedStyle(document.documentElement).getPropertyValue('--brand-500').trim());
                    spawnBurstParticles(cx, cy, getComputedStyle(document.documentElement).getPropertyValue('--brand-500').trim(), 10);
                }, 100);
            }

            if (isBtn) {
                const rect = isBtn.getBoundingClientRect();
                const cx = rect.left + rect.width/2;
                const cy = rect.top + rect.height/2;
                setTimeout(() => {
                    spawnBurstParticles(cx, cy, null, 6);
                }, 150);
            }
        });

        /* ============ Mouse followers ============ */
        let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
        let glowX = mouseX, glowY = mouseY;
        let lastTrailTime = 0;

        document.addEventListener('mousemove', e => {
            mouseX = e.clientX; mouseY = e.clientY;
            const now = performance.now();
            if (now - lastTrailTime > 60) {
                createCursorTrail(e.clientX, e.clientY);
                lastTrailTime = now;
            }
        });

        function animateGlow() {
            glowX += (mouseX - glowX) * 0.10;
            glowY += (mouseY - glowY) * 0.10;
            mouseGlow.style.transform = `translate(${glowX}px, ${glowY}px) translate(-50%, -50%)`;
            requestAnimationFrame(animateGlow);
        }
        animateGlow();

        if ('ontouchstart' in window) mouseGlow.style.display = 'none';

        function createCursorTrail(x, y) {
            const t = document.createElement('div');
            t.className = 'cursor-trail';
            t.style.left = x + 'px';
            t.style.top = y + 'px';
            const colors = ['var(--brand-500)', 'var(--accent)', 'var(--brand-300)'];
            t.style.background = colors[Math.floor(Math.random() * 3)];
            t.style.width = (4 + Math.random() * 6) + 'px';
            t.style.height = t.style.width;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 800);
        }

        /* ============ Particles ============ */
        (function initParticles() {
            const host = $('particles');
            const counts = { rise: 14, fall: 8, drift: 6 };
            for (const [type, n] of Object.entries(counts)) {
                for (let j = 0; j < n; j++) {
                    const p = document.createElement('div');
                    p.className = 'particle ' + type;
                    const size = 2 + Math.random() * 4;
                    p.style.width = size + 'px';
                    p.style.height = size + 'px';
                    p.style.left = (Math.random() * 100) + '%';
                    p.style.top = (Math.random() * 100) + '%';
                    p.style.background = `var(--brand-${300 + Math.floor(Math.random() * 2) * 100})`;
                    p.style.animationDuration = (10 + Math.random() * 18) + 's';
                    p.style.animationDelay = (Math.random() * 20) + 's';
                    p.style.opacity = (0.3 + Math.random() * 0.4).toString();
                    host.appendChild(p);
                }
            }
        })();

        /* ============ Counters ============ */
        function animateCount(el, target, duration, suffix) {
            const start = performance.now();
            function tick(now) {
                const t = Math.min(1, (now - start) / duration);
                const eased = 1 - Math.pow(1 - t, 3);
                el.textContent = Math.floor(target * eased) + (suffix || '');
                if (t < 1) requestAnimationFrame(tick);
                else el.textContent = target + (suffix || '');
            }
            requestAnimationFrame(tick);
        }
        function initCounters() {
            const stats = document.querySelectorAll('.stat');
            const obs = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const stat = entry.target;
                        stat.classList.add('in-view');
                        const val = stat.querySelector('.stat-val');
                        if (val.dataset.static === undefined) {
                            animateCount(val, parseInt(val.dataset.target), 1500, stat.dataset.suffix || '');
                        }
                        obs.unobserve(stat);
                    }
                });
            }, { threshold: 0.4 });
            stats.forEach(s => obs.observe(s));
        }
        initCounters();

        const showcaseLabels = ['原图', '滤镜效果', '装饰美化', '处理工具'];

            let idx = 0;
            setInterval(() => {
                idx = (idx + 1) % showcaseLabels.length;
                if (showcaseText) {
                    showcaseText.style.opacity = '0';
                    setTimeout(() => {
                        showcaseText.textContent = showcaseLabels[idx];
                        showcaseText.style.opacity = '1';
                    }, 300);
                }
            }, 4000);
        })();
        if (showcaseText) showcaseText.style.transition = 'opacity .3s';
