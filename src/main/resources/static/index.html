        .result .r-dl {
            position: relative;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            margin-top: 10px; padding: 7px 12px; width: 100%;
            background: var(--grad);
            background-size: 200% 200%;
            color: #fff;
            font-size: 12px; font-weight: 600;
            border-radius: 8px;
            overflow: hidden;
            transition: all .3s var(--ease-out);
            animation: gradient-flow 5s ease infinite;
        }
        .result .r-dl::before {
            content: '';
            position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);
        }
        .result .r-dl:hover::before { animation: tool-shine .8s var(--ease-out); }
        .result .r-dl:hover {
            transform: translateY(-1px) scale(1.02);
            box-shadow: var(--shadow-brand);
        }
        .result .r-dl:active { transform: translateY(0) scale(.96); }
        .result .r-dl svg { width: 12px; height: 12px; }

        .actions-row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
        .btn {
            padding: 10px 18px;
            font-size: 13px; font-weight: 600;
            transition: all .3s var(--ease-out);
            display: inline-flex; align-items: center; gap: 6px;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }
        .btn svg { width: 14px; height: 14px; }
        .btn-primary {
            background: var(--grad);
            background-size: 200% 200%;
            color: #fff;
            box-shadow: var(--shadow-sm);
            animation: gradient-flow 5s ease infinite;
        }
        .btn-primary::before {
            content: '';
            position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);
        }
        .btn-primary:hover::before { animation: tool-shine .8s var(--ease-out); }
        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: var(--shadow-brand);
        }
        .btn-primary:active { transform: translateY(0) scale(.96); }
        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background: var(--bg-soft);
            border-color: var(--border-strong);
            transform: translateY(-2px) scale(1.02);
        }
        .btn-secondary:active { transform: translateY(0) scale(.96); }

        .skeleton {
            background: linear-gradient(90deg, var(--bg-soft) 0%, var(--border) 50%, var(--bg-soft) 100%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.5s ease-in-out infinite;
            border-radius: var(--radius-md);
        }
        .skeleton-card { aspect-ratio: 1; border-radius: var(--radius-md); }
        .skeleton-line { height: 12px; margin: 6px 14px; }
        .skeleton-line.short { width: 40%; }
        .skeleton-line.long { width: 70%; }

        /* ========== Modal ========== */
        .modal-bg {
            position: fixed; inset: 0;
            background: rgba(28, 25, 23, .5);
            display: grid; place-items: center;
            z-index: 100;
            opacity: 0; pointer-events: none;
            padding: 20px;
        }
        .modal-bg.show { opacity: 1; pointer-events: auto; animation: fade-in .3s var(--ease-out) forwards; }
        .modal {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-2xl);
            width: 100%; max-width: 480px;
            box-shadow: var(--shadow-lg);
            max-height: 90vh; overflow: hidden;
            display: flex; flex-direction: column;
            transform: scale(.9) translateY(30px);
            opacity: 0;
        }
        .modal-bg.show .modal { animation: modal-spring .5s var(--ease-spring) .05s forwards; }
        .modal-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
            position: relative;
            background: var(--bg-soft);
        }
        .modal-head::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: var(--grad);
            background-size: 200% 200%;
            animation: gradient-flow 4s ease infinite;
        }
        .modal-title {
            display: flex; align-items: center; gap: 12px;
            font-weight: 700; font-size: 16px;
        }
        .modal-title .ico {
            width: 36px; height: 36px;
            display: grid; place-items: center;
            color: var(--brand-500);
            background: var(--brand-50);
            border-radius: 10px;
            transition: all .3s var(--ease-spring);
            animation: scale-pop .5s var(--ease-spring) .2s backwards, pulse-soft 3s ease-in-out infinite;
        }
        .modal-title:hover .ico { transform: rotate(15deg) scale(1.1); }
        .modal-title .ico svg { width: 18px; height: 18px; }
        .modal-close {
            width: 32px; height: 32px;
            display: grid; place-items: center;
            color: var(--text-3);
            border-radius: 8px;
            transition: all .2s var(--ease-spring);
        }
        .modal-close:hover {
            background: var(--bg-soft);
            color: var(--danger);
            transform: rotate(90deg) scale(1.1);
        }
        .modal-close svg { width: 16px; height: 16px; }

        .modal-body { padding: 20px 22px; overflow-y: auto; flex: 1; }
        .modal-desc {
            font-size: 13px; color: var(--text-2);
            margin-bottom: 16px; line-height: 1.6;
            animation: slide-up .4s var(--ease-out) .15s backwards;
        }
        .modal-scope {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 10px;
            background: var(--brand-50);
            border: 1px solid var(--brand-200);
            color: var(--brand-700);
            font-size: 11px; font-weight: 600;
            border-radius: 999px;
            margin-bottom: 18px;
            animation: scale-pop .4s var(--ease-spring) .2s backwards;
        }
        .modal-scope svg { width: 12px; height: 12px; }

        .field { margin-bottom: 16px; animation: slide-up .4s var(--ease-out) backwards; }
        .field-label {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; font-weight: 600; color: var(--text-2);
            margin-bottom: 8px;
        }
        .field-label .val {
            color: var(--brand-600);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px; font-weight: 600;
            background: var(--brand-50);
            padding: 2px 8px;
            border-radius: 4px;
            transition: all .2s var(--ease-spring);
        }
        .field-input {
            width: 100%; padding: 10px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text); font-size: 14px;
            border-radius: 10px;
            transition: all .25s var(--ease-out);
        }
        .field-input:hover { border-color: var(--border-strong); }
        .field-input:focus {
            outline: none;
            border-color: var(--brand-500);
            box-shadow: 0 0 0 3px var(--brand-100);
            transform: translateY(-1px);
        }
        .field-input[type="color"] { padding: 4px; height: 42px; cursor: pointer; }
        .range-row { display: flex; align-items: center; gap: 12px; }
        .range-row input[type="range"] {
            flex: 1;
            -webkit-appearance: none; appearance: none;
            height: 6px;
            background: linear-gradient(to right, var(--brand-500) 0%, var(--brand-500) var(--pct, 50%), var(--border) var(--pct, 50%), var(--border) 100%);
            border-radius: 3px; outline: none;
            transition: background .15s;
        }
        .range-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 18px; height: 18px;
            background: var(--grad);
            background-size: 200% 200%;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: var(--shadow-sm);
            transition: all .2s var(--ease-spring);
            animation: gradient-flow 4s ease infinite, pulse-soft 2s ease-in-out infinite;
        }
        .range-row input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.3);
            box-shadow: 0 0 0 6px var(--brand-100), var(--shadow-sm);
        }
        .range-row input[type="range"]::-moz-range-thumb {
            width: 18px; height: 18px;
            background: var(--brand-500);
            cursor: pointer;
            border-radius: 50%;
            border: none;
            box-shadow: var(--shadow-sm);
        }
        .range-val {
            min-width: 64px; text-align: right;
            font-size: 12px; font-weight: 600; color: var(--brand-600);
            font-family: 'JetBrains Mono', monospace;
            transition: transform .2s var(--ease-spring);
        }
        .range-val.bump { animation: pulse-soft .3s var(--ease-spring); }
        .modal-foot {
            padding: 16px 22px;
            display: flex; gap: 10px;
            border-top: 1px solid var(--border);
            background: var(--bg-soft);
        }
        .modal-foot .btn { flex: 1; justify-content: center; padding: 12px; }

        /* ========== Progress / Toast / Loading ========== */
        .progress { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 200; opacity: 0; }
        .progress.show { opacity: 1; }
        .progress-fill {
            height: 100%; width: 0%;
            background: var(--grad);
            background-size: 40px 40px;
            background-image: var(--grad), repeating-linear-gradient(45deg, transparent 0, rgba(255,255,255,.3) 10px, rgba(255,255,255,.3) 20px, transparent 20px, transparent 40px);
            transition: width .3s var(--ease-out);
            box-shadow: 0 0 12px var(--brand-300);
            animation: progress-stripes 1s linear infinite;
        }
        .toast {
            position: fixed; bottom: 24px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text); color: #fff;
            padding: 12px 20px; font-size: 13px; font-weight: 500;
            border-radius: 10px; box-shadow: var(--shadow-lg);
            z-index: 300; opacity: 0;
            display: flex; align-items: center; gap: 8px;
        }
        .toast.show { animation: toast-in .5s var(--ease-spring) forwards; }
        .toast.success { background: var(--brand-600); }
        .toast.error { background: var(--danger); }
        .toast::before {
            content: '';
            width: 6px; height: 6px;
            border-radius: 50%;
            background: currentColor; opacity: .7;
            animation: pulse-soft 1.5s ease-in-out infinite;
        }
        .loading {
            position: fixed; inset: 0;
            background: rgba(28, 25, 23, .5);
            display: grid; place-items: center; z-index: 150;
            opacity: 0; pointer-events: none;
        }
        .loading.show { opacity: 1; pointer-events: auto; animation: fade-in .3s var(--ease-out) forwards; }
        .loading-box {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 28px 36px; text-align: center; min-width: 240px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            animation: modal-spring .5s var(--ease-spring) forwards;
            position: relative;
            overflow: hidden;
        }
        .loading-box::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: var(--grad);
            background-size: 200% 200%;
            animation: gradient-flow 2s ease infinite;
        }
        .spinner {
            width: 48px; height: 48px;
            margin: 0 auto 14px;
            position: relative;
        }
        .spinner::before, .spinner::after, .spinner > i {
            content: '';
            position: absolute; inset: 0;
            border-radius: 50%;
            border: 3px solid transparent;
        }
        .spinner::before {
            border-top-color: var(--brand-500);
            border-right-color: var(--brand-300);
            animation: spin 1s linear infinite;
        }
        .spinner::after {
            border-bottom-color: var(--accent);
            border-left-color: var(--brand-200);
            animation: spin 1.5s linear infinite reverse;
        }
        .spinner > i {
            inset: 6px;
            border-top-color: var(--brand-400);
            animation: spin .8s linear infinite, hue-rotate 4s linear infinite;
        }
        .loading-txt {
            font-size: 13px; color: var(--text-2); font-weight: 500;
            animation: pulse-soft 1.5s ease-in-out infinite;
        }

        /* ========== Responsive ========== */
        @media (max-width: 720px) {
            .page { padding: 16px; }
            .topbar-inner { padding: 12px 16px; }
            .hero { padding: 24px 20px; }
            .hero h1 { font-size: 22px; }
            .hero-sub { font-size: 14px; }
            .hero-stats { gap: 8px; }
            .stat-val { font-size: 18px; }
            .card-body { padding: 16px; }
            .tab { padding: 7px 10px; font-size: 12px; }
            .tools-grid { grid-template-columns: repeat(3, 1fr); }
            .tool { padding: 12px 4px; }
            .tool .ico { width: 36px; height: 36px; }
            .tool .lbl { font-size: 11px; }
            .modal { max-width: 100%; }
            .theme-picker { padding: 4px; gap: 4px; }
            .theme-dot { width: 18px; height: 18px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>

        /* Mouse followers */
        let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
        let glowX = mouseX, glowY = mouseY;
        let spotX = mouseX, spotY = mouseY;
        let lastTrailTime = 0;

        document.addEventListener('mousemove', e => {
            mouseX = e.clientX; mouseY = e.clientY;
            mouseSpot.style.opacity = '1';
            const now = performance.now();
            if (now - lastTrailTime > 50) {
                createCursorTrail(e.clientX, e.clientY);
                lastTrailTime = now;
            }
        });
        document.addEventListener('mouseleave', () => mouseSpot.style.opacity = '0');

        function animateGlow() {
            glowX += (mouseX - glowX) * 0.10;
            glowY += (mouseY - glowY) * 0.10;
            spotX += (mouseX - spotX) * 0.18;
            spotY += (mouseY - spotY) * 0.18;
            mouseGlow.style.transform = `translate(${glowX}px, ${glowY}px) translate(-50%, -50%)`;
            mouseSpot.style.transform = `translate(${spotX}px, ${spotY}px) translate(-50%, -50%)`;
            requestAnimationFrame(animateGlow);
        }
        animateGlow();

        if ('ontouchstart' in window) {
            mouseGlow.style.display = 'none';
            mouseSpot.style.display = 'none';
        }

        function createCursorTrail(x, y) {
            const t = document.createElement('div');
            t.className = 'cursor-trail';
            t.style.left = x + 'px';
            t.style.top = y + 'px';
            const colors = ['var(--brand-500)', 'var(--accent)', 'var(--brand-300)'];
            t.style.background = colors[Math.floor(Math.random() * 3)];
            t.style.width = (4 + Math.random() * 6) + 'px';
            t.style.height = t.style.width;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 800);
        }

        function launchConfetti(x, y, count = 30) {
            const colors = ['#10b981', '#6366f1', '#8b5cf6', '#f97316', '#f43f5e', '#fbbf24', '#06b6d4', '#a855f7', '#22c55e'];
            for (let i = 0; i < count; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = x + 'px';
                piece.style.top = y + 'px';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.setProperty('--dx', (Math.random() - 0.5) * 200 + 'px');
                piece.style.animationDelay = (Math.random() * 0.2) + 's';
                piece.style.transform = `rotate(${Math.random() * 360}deg)`;
                if (Math.random() > 0.5) piece.style.borderRadius = '50%';
                confettiHost.appendChild(piece);
                setTimeout(() => piece.remove(), 2000);
            }
        }

        /* Particles: rising, falling, drifting */
        (function initParticles() {
            const host = $('particles');
            const counts = { rise: 14, fall: 8, drift: 6 };
            let i = 0;
            for (const [type, n] of Object.entries(counts)) {
                for (let j = 0; j < n; j++) {
                    const p = document.createElement('div');
                    p.className = 'particle ' + type;
                    const size = 2 + Math.random() * 4;
                    p.style.width = size + 'px';
                    p.style.height = size + 'px';
                    p.style.left = (Math.random() * 100) + '%';
                    p.style.top = (Math.random() * 100) + '%';
                    p.style.background = `var(--brand-${300 + Math.floor(Math.random() * 2) * 100})`;
                    p.style.animationDuration = (10 + Math.random() * 18) + 's';
                    p.style.animationDelay = (Math.random() * 20) + 's';
                    p.style.opacity = (0.3 + Math.random() * 0.4).toString();
                    host.appendChild(p);
                    i++;
                }
            }
        })();

        /* Counter */
        function animateCount(el, target, duration, suffix) {
            const start = performance.now();
            function tick(now) {
                const t = Math.min(1, (now - start) / duration);
                const eased = 1 - Math.pow(1 - t, 3);
                const cur = target * eased;
                el.textContent = Math.floor(cur) + (suffix || '');
                if (t < 1) requestAnimationFrame(tick);
                else el.textContent = target + (suffix || '');
            }
            requestAnimationFrame(tick);
        }

        function initCounters() {
            const stats = document.querySelectorAll('.stat');
            const obs = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const stat = entry.target;
                        stat.classList.add('in-view');
                        const val = stat.querySelector('.stat-val');
                        if (val.dataset.static === undefined) {
                            const target = parseInt(val.dataset.target);
                            const suffix = stat.dataset.suffix || '';
                            animateCount(val, target, 1500, suffix);
                        }
                        obs.unobserve(stat);
                    }
                });
            }, { threshold: 0.4 });
            stats.forEach(s => obs.observe(s));
        }
        initCounters();

        const showcaseLabels = ['原图', '滤镜效果', '装饰美化', '处理工具'];
        (function updateShowcaseLabel() {
            let idx = 0;
            setInterval(() => {
                idx = (idx + 1) % showcaseLabels.length;
                if (showcaseText) {
                    showcaseText.style.opacity = '0';
                    setTimeout(() => {
                        showcaseText.textContent = showcaseLabels[idx];
                        showcaseText.style.opacity = '1';
                    }, 300);
                }
            }, 4000);
        })();
        if (showcaseText) showcaseText.style.transition = 'opacity .3s';

        function createRipple(e, target) {
            const rect = target.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height) * 1.2;
            const x = (e.clientX || rect.left + rect.width/2) - rect.left - size/2;
            const y = (e.clientY || rect.top + rect.height/2) - rect.top - size/2;
            const r = document.createElement('span');
            r.className = 'ripple';
            r.style.width = r.style.height = size + 'px';
            r.style.left = x + 'px';
            r.style.top = y + 'px';
            target.appendChild(r);
            setTimeout(() => r.remove(), 700);
        }

        document.addEventListener('click', e => {
            const t = e.target.closest('.btn, .tool, .tab, .theme-dot, .status-pill, .modal-close, .btn-text');
            if (t && !t.querySelector('.ripple')) createRipple(e, t);
        });

        function spawnStarBurst(btn) {
            const burst = document.createElement('div');
            burst.className = 'star-burst';
            burst.innerHTML = '<svg viewBox="0 0 80 80" fill="currentColor"><path d="M40 0L48 32L80 40L48 48L40 80L32 48L0 40L32 32Z" opacity=".8"/><path d="M40 10L45 35L70 40L45 45L40 70L35 45L10 40L35 35Z" opacity=".5"/></svg>';
            btn.appendChild(burst);
            setTimeout(() => burst.remove(), 700);
        }

        function showToast(msg, type) {
            toast.textContent = msg;
            toast.className = 'toast' + (type ? ' ' + type : '');
            void toast.offsetWidth;
            toast.classList.add('show');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => toast.classList.remove('show'), 2500);
        }
        function showLoading(t) { loadingText.textContent = t || '处理中…'; loading.classList.add('show'); }
        function hideLoading() { loading.classList.remove('show'); }
        function showProgress(p) {
            progressTrack.classList.add('show');
            progressFill.style.width = (p * 100) + '%';
        }
        function hideProgress() { progressTrack.classList.remove('show'); progressFill.style.width = '0%'; }
        function humanSize(b) {
            if (b < 1024) return b + ' B';
            if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
            return (b / 1024 / 1024).toFixed(2) + ' MB';
        }

        const THEMES = ['mint','indigo','sunset','rose','ocean','forest','lavender','amber','graphite','candy'];
        function applyTheme(th) {
            if (!THEMES.includes(th)) th = 'mint';
            document.documentElement.dataset.theme = th;
            document.querySelectorAll('.theme-dot').forEach(d => d.classList.toggle('active', d.dataset.th === th));
            try { localStorage.setItem('imgc-theme', th); } catch(e) {}
        }
        function initTheme() {
            let saved = 'mint';
            try { saved = localStorage.getItem('imgc-theme') || 'mint'; } catch(e) {}
            applyTheme(saved);
        }
        $('themePicker').addEventListener('click', e => {
            const dot = e.target.closest('.theme-dot');
            if (dot) applyTheme(dot.dataset.th);
        });
        initTheme();

        $('tabBar').addEventListener('click', e => {
            const tab = e.target.closest('.tab');
            if (!tab) return;
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
            currentTab = tab.dataset.tab;
            renderActions(true);
        });

        function renderActions(animate) {
            actionsGrid.innerHTML = '';
            const list = currentTab === 'all' ? ACTIONS : ACTIONS.filter(a => a.group === currentTab);
            list.forEach((a, i) => {
                const btn = document.createElement('button');
                btn.className = 'tool';
                btn.dataset.key = a.key;
                if (animate) btn.style.animationDelay = (i * 0.04) + 's';
                btn.innerHTML = `<span class="ico">${ICON[a.icon]||''}</span><span class="lbl">${a.label}</span>`;
                btn.addEventListener('click', (e) => {
                    spawnStarBurst(btn);
                    setTimeout(() => openModal(a), 200);
                });
                actionsGrid.appendChild(btn);
            });
        }

        uploadZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', e => {
            Array.from(e.target.files).forEach(f => addImage(f));
            fileInput.value = '';
        });
        ['dragover','dragenter'].forEach(ev => uploadZone.addEventListener(ev, e => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        }));
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
        uploadZone.addEventListener('drop', e => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/')).forEach(f => addImage(f));
        });

        function addImage(file) {
            if (!file.type.startsWith('image/')) {
                showToast('不支持的文件类型: ' + file.name, 'error');
                return;
            }
            const id = nextId++;
            const url = URL.createObjectURL(file);
            images.push({ id, file, url, selected: true });
            renderImageList();
            actionsEmpty.style.display = 'none';
            actionsGrid.style.display = 'grid';
            const sel = images.filter(i => i.selected).length;
            actionsHint.textContent = sel + ' 张已选';
            resultPanel.style.display = 'none';
        }

        function renderImageList() {
            imgList.innerHTML = '';
            const selectedCount = images.filter(i => i.selected).length;
            images.forEach((img, i) => {
                const div = document.createElement('div');
                div.className = 'img-card' + (img.selected ? ' selected' : '');
                div.style.animationDelay = (i * 0.06) + 's';
                div.innerHTML =
                    '<img src="' + img.url + '" alt="">' +
                    '<div class="check">✓</div>' +
                    '<button class="del" data-id="' + img.id + '" aria-label="删除">×</button>' +
                    '<div class="tag"><span>' + (img.file.type.split('/')[1] || 'IMG').toUpperCase() + '</span><span>' + humanSize(img.file.size) + '</span></div>';
                div.addEventListener('mousemove', e => {
                    const rect = div.getBoundingClientRect();
                    const cx = e.clientX - rect.left;
                    const cy = e.clientY - rect.top;
                    const rx = ((cy - rect.height/2) / rect.height) * -8;
                    const ry = ((cx - rect.width/2) / rect.width) * 8;
                    div.style.transform = `perspective(500px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-2px)`;
                });
                div.addEventListener('mouseleave', () => { div.style.transform = ''; });
                div.addEventListener('click', e => {
                    if (e.target.classList.contains('del')) return;
                    img.selected = !img.selected;
                    renderImageList();
                });
                imgList.appendChild(div);
            });
            const count = images.length;
            imgCount.textContent = count + ' 张';
            imgCount.style.display = count > 0 ? '' : 'none';
            listToolbar.style.display = count > 0 ? 'flex' : 'none';
            actionsHint.textContent = selectedCount > 0 ? (selectedCount + ' 张已选') : '等待上传';
            if (count === 0) {
                actionsEmpty.style.display = '';
                actionsGrid.style.display = 'none';
                resultPanel.style.display = 'none';
            }
        }

        imgList.addEventListener('click', e => {
            if (e.target.classList.contains('del')) {
                e.stopPropagation();
                const id = parseInt(e.target.dataset.id);
                const idx = images.findIndex(i => i.id === id);
                if (idx >= 0) {
                    URL.revokeObjectURL(images[idx].url);
                    images.splice(idx, 1);
                    renderImageList();
                }
            }
        });

        $('btnSelectAll').addEventListener('click', () => { images.forEach(i => i.selected = true); renderImageList(); });
        $('btnSelectNone').addEventListener('click', () => { images.forEach(i => i.selected = false); renderImageList(); });
        $('btnClearAll').addEventListener('click', () => {
            images.forEach(i => URL.revokeObjectURL(i.url));
            images = [];
            renderImageList();
        });

        function openModal(action) {
            const selected = images.filter(i => i.selected);
            if (selected.length === 0) { showToast('请先选择图片', 'error'); return; }
            currentAction = action;
            modalIco.innerHTML = ICON[action.icon] || '';
            modalTitleText.textContent = action.label;
            modalDesc.textContent = action.desc;
            modalScopeText.textContent = '将处理 ' + selected.length + ' 张图片' + (selected.length > 1 ? '（批量）' : '');
            modalFields.innerHTML = '';
            action.fields.forEach((field, idx) => {
                const wrap = document.createElement('div');
                wrap.className = 'field';
                wrap.style.animationDelay = (0.1 + idx * 0.05) + 's';
                const label = document.createElement('label');
                label.className = 'field-label';
                label.innerHTML = '<span>' + field.label + '</span><span class="val" data-val></span>';
                wrap.appendChild(label);

                if (field.type === 'select') {
                    const sel = document.createElement('select');
                    sel.className = 'field-input';
                    sel.dataset.field = field.name;
                    field.options.forEach(o => {
                        const opt = document.createElement('option');
                        opt.value = o; opt.textContent = o;
                        if (o === field.value) opt.selected = true;
                        sel.appendChild(opt);
                    });
                    wrap.appendChild(sel);
                    label.querySelector('[data-val]').textContent = field.value;
                    sel.addEventListener('change', () => {
                        const valEl = label.querySelector('[data-val]');
                        valEl.textContent = sel.value;
                        valEl.style.transform = 'scale(1.2)';
                        setTimeout(() => valEl.style.transform = '', 200);
                    });
                } else if (field.type === 'range') {
                    const row = document.createElement('div'); row.className = 'range-row';
                    const inp = document.createElement('input');
                    inp.type = 'range'; inp.min = field.min; inp.max = field.max; inp.step = field.step; inp.value = field.value;
                    inp.dataset.field = field.name;
                    const valEl = label.querySelector('[data-val]');
                    valEl.textContent = field.show ? field.show(parseFloat(field.value)) : field.value;
                    const update = () => {
                        valEl.textContent = field.show ? field.show(parseFloat(inp.value)) : inp.value;
                        valEl.classList.remove('bump'); void valEl.offsetWidth; valEl.classList.add('bump');
                        const pct = ((inp.value - field.min) / (field.max - field.min)) * 100;
                        inp.style.setProperty('--pct', pct + '%');
                    };
                    update();
                    inp.addEventListener('input', update);
                    row.appendChild(inp);
                    wrap.appendChild(row);
                } else if (field.type === 'color') {
                    const inp = document.createElement('input');
                    inp.type = 'color'; inp.className = 'field-input'; inp.value = field.value; inp.dataset.field = field.name;
                    wrap.appendChild(inp);
                    label.querySelector('[data-val]').textContent = field.value;
                    inp.addEventListener('input', () => label.querySelector('[data-val]').textContent = inp.value);
                } else {
                    const inp = document.createElement('input');
                    inp.type = field.type; inp.className = 'field-input'; inp.value = field.value; inp.dataset.field = field.name;
                    if (field.placeholder) inp.placeholder = field.placeholder;
                    if (field.min !== undefined) inp.min = field.min;
                    if (field.max !== undefined) inp.max = field.max;
                    wrap.appendChild(inp);
                    label.querySelector('[data-val]').textContent = field.value;
                    inp.addEventListener('input', () => label.querySelector('[data-val]').textContent = inp.value);
                }
                modalFields.appendChild(wrap);
            });
            modalBg.classList.add('show');
        }
        $('modalClose').addEventListener('click', closeModal);
        $('modalCancel').addEventListener('click', closeModal);
        modalBg.addEventListener('click', e => { if (e.target === modalBg) closeModal(); });
        function closeModal() { modalBg.classList.remove('show'); }

        $('modalSubmit').addEventListener('click', async (e) => {
            const selected = images.filter(i => i.selected);
            if (selected.length === 0 || !currentAction) return;
            const params = {};
            modalFields.querySelectorAll('input, select').forEach(inp => {
                const n = inp.dataset.field; if (!n) return;
                let v = inp.value;
                if (inp.type === 'range' || inp.type === 'number') v = parseFloat(v);
                if (inp.type === 'color') v = v.replace('#', '');
                params[n] = v;
            });
            closeModal();
            results = []; resultList.innerHTML = '';
            const multi = selected.length > 1;
            if (multi) { showProgress(0); showLoading('处理中 0/' + selected.length); }
            else { showLoading('处理中…'); }
            try {
                for (let i = 0; i < selected.length; i++) {
                    const img = selected[i];
                    loadingText.textContent = '处理中 ' + (i + 1) + '/' + selected.length + ' · ' + img.file.name;
                    const r = await callApi(currentAction.key, params, img.file);
                    results.push(r);
                    if (multi) showProgress((i + 1) / selected.length);
                }
                hideLoading(); hideProgress();
                showResults(e);
                showToast('处理完成', 'success');
                document.querySelectorAll('.tool').forEach(b => b.classList.remove('applied'));
                const idx = ACTIONS.findIndex(a => a.key === currentAction.key);
                if (idx >= 0) {
                    const btns = actionsGrid.querySelectorAll('.tool');
                    if (btns[idx]) btns[idx].classList.add('applied');
                }
            } catch (err) {
                hideLoading(); hideProgress();
                showToast('处理失败: ' + (err.message || err), 'error');
                console.error(err);
            }
        });

        async function callApi(key, params, file) {
            const fd = new FormData();
            fd.append('file', file);
            Object.entries(params).forEach(([k, v]) => fd.append(k, v));
            const resp = await fetch('/api/' + key, { method: 'POST', body: fd });
            if (!resp.ok) { const t = await resp.text(); throw new Error('HTTP ' + resp.status + ': ' + t.substring(0, 200)); }
            const ct = resp.headers.get('Content-Type') || '';
            const cd = resp.headers.get('Content-Disposition') || '';
            const m = cd.match(/filename="?([^"]+)"?/);
            const base = (file.name || 'image').replace(/\.[^.]+$/, '');
            const ext = params.format || 'png';
            if (ct.includes('text/plain')) {
                const text = await resp.text();
                return { name: base + '-ascii.txt', blob: new Blob([text], { type: 'text/plain' }), isText: true, text };
            } else if (ct.includes('application/json')) {
                const j = await resp.json();
                return { name: base + '.json', blob: new Blob([JSON.stringify(j, null, 2)], { type: 'application/json' }), isText: true, text: j.base64 || JSON.stringify(j), dataUri: j.dataUri };
            } else {
                const blob = await resp.blob();
                const name = m ? m[1] : (base + '-converted.' + ext);
                return { name, blob, isText: false };
            }
        }

        function showResults(e) {
            resultPanel.style.display = '';
            resultCount.textContent = results.length + ' 张';
            resultList.innerHTML = '';
            const rect = (e && e.currentTarget) ? e.currentTarget.getBoundingClientRect() : { left: window.innerWidth/2, top: window.innerHeight/2 };
            launchConfetti(rect.left + rect.width/2, rect.top, 40);
            results.forEach((r, idx) => {
                const url = URL.createObjectURL(r.blob); r.url = url;
                const card = document.createElement('div');
                card.className = 'result';
                card.style.animationDelay = (idx * 0.07) + 's';
                if (r.isText) {
                    if (r.dataUri) {
                        card.innerHTML = '<img src="' + r.dataUri + '"><div class="r-info"><div class="r-name">' + r.name + '</div><div class="r-meta"><span>图片</span></div><button class="r-dl" data-idx="' + idx + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>下载</button></div>';
                    } else {
                        card.style.gridColumn = '1 / -1';
                        card.innerHTML = '<div class="r-info" style="padding:16px"><div class="r-name">' + r.name + '</div><div style="font-family:JetBrains Mono,monospace;font-size:11px;background:var(--bg-soft);padding:12px;border-radius:8px;margin-top:8px;max-height:200px;overflow:auto;white-space:pre-wrap;color:var(--text-2);">' + (r.text || '').substring(0, 5000) + (r.text && r.text.length > 5000 ? '\n... [已截断]' : '') + '</div><button class="r-dl" data-idx="' + idx + '" style="margin-top:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>下载</button></div>';
                    }
                } else {
                    card.innerHTML = '<img src="' + url + '"><div class="r-info"><div class="r-name">' + r.name + '</div><div class="r-meta"><span>' + humanSize(r.blob.size) + '</span></div><button class="r-dl" data-idx="' + idx + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>下载</button></div>';
                }
                card.addEventListener('mousemove', e => {
                    const rect = card.getBoundingClientRect();
                    const cx = e.clientX - rect.left;
                    const cy = e.clientY - rect.top;
                    const rx = ((cy - rect.height/2) / rect.height) * -5;
                    const ry = ((cx - rect.width/2) / rect.width) * 5;
                    card.style.transform = `perspective(800px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-4px) scale(1.01)`;
                });
                card.addEventListener('mouseleave', () => { card.style.transform = ''; });
                resultList.appendChild(card);
            });
        }

        resultList.addEventListener('click', e => {
            const dl = e.target.closest('.r-dl');
            if (dl) {
                const r = results[parseInt(dl.dataset.idx)];
                if (!r) return;
                const a = document.createElement('a');
                a.href = r.url; a.download = r.name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
                showToast('已保存: ' + r.name, 'success');
            }
        });

        $('btnDownloadAll').addEventListener('click', async () => {
            if (results.length === 0) return;
            launchConfetti(window.innerWidth/2, window.innerHeight/2, 50);
            for (const r of results) {
                const a = document.createElement('a');
                a.href = r.url; a.download = r.name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
                await new Promise(res => setTimeout(res, 200));
            }
            showToast('已批量下载 ' + results.length + ' 个文件', 'success');
        });
        $('btnAgain').addEventListener('click', () => { resultPanel.style.display = 'none'; });

        renderActions();
    </script>
</body>
</html>
