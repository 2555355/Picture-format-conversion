<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <title>图画工坊 · 重新出发</title>
    <style>
        /* ========== 主题变量（亮/暗/海/暮/森/薰） ========== */
        :root,
        [data-theme="light"] {
            --bg: #f6f7fb;
            --bg-soft: #eef0f7;
            --surface: #ffffff;
            --surface-2: #fafbff;
            --border: #e6e8f0;
            --border-soft: #f0f2f7;
            --text: #18181b;
            --text-2: #52525b;
            --text-3: #a1a1aa;

            --primary: #6366f1;
            --primary-2: #818cf8;
            --primary-soft: #eef2ff;
            --primary-text: #ffffff;

            --success: #10b981;
            --danger: #ef4444;
            --warn: #f59e0b;

            --shadow-sm: 0 1px 2px rgba(15, 15, 30, 0.04);
            --shadow-md: 0 4px 20px rgba(15, 15, 30, 0.06);
            --shadow-lg: 0 16px 40px rgba(15, 15, 30, 0.10);
            --ring: 0 0 0 3px rgba(99, 102, 241, 0.18);

            --grad: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --grad-soft: linear-gradient(135deg, #eef2ff 0%, #fdf4ff 50%, #fff1f2 100%);
        }
        [data-theme="dark"] {
            --bg: #0a0a10;
            --bg-soft: #11111a;
            --surface: #16161f;
            --surface-2: #1c1c28;
            --border: #262633;
            --border-soft: #1e1e2a;
            --text: #fafafa;
            --text-2: #a1a1aa;
            --text-3: #52525b;

            --primary: #818cf8;
            --primary-2: #a78bfa;
            --primary-soft: rgba(129, 140, 248, 0.14);
            --primary-text: #0a0a10;

            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 4px 24px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.6);
            --ring: 0 0 0 3px rgba(129, 140, 248, 0.30);

            --grad: linear-gradient(135deg, #818cf8 0%, #c084fc 50%, #f472b6 100%);
            --grad-soft: linear-gradient(135deg, rgba(129,140,248,0.10) 0%, rgba(192,132,252,0.10) 50%, rgba(244,114,182,0.10) 100%);
        }
        [data-theme="ocean"] {
            --bg: #eff8ff;
            --bg-soft: #e0f0fe;
            --surface: #ffffff;
            --surface-2: #f5fafe;
            --border: #d6e8f8;
            --border-soft: #e8f1fb;
            --text: #0c2a3f;
            --text-2: #3d6480;
            --text-3: #7fa3bf;

            --primary: #0284c7;
            --primary-2: #38bdf8;
            --primary-soft: #e0f2fe;
            --primary-text: #ffffff;

            --grad: linear-gradient(135deg, #0284c7 0%, #06b6d4 50%, #14b8a6 100%);
            --grad-soft: linear-gradient(135deg, #e0f2fe 0%, #ecfeff 50%, #f0fdfa 100%);
        }
        [data-theme="sunset"] {
            --bg: #fff7ed;
            --bg-soft: #ffeed9;
            --surface: #ffffff;
            --surface-2: #fffaf3;
            --border: #f8dcc0;
            --border-soft: #fce8d4;
            --text: #4a2410;
            --text-2: #7a4a30;
            --text-3: #b88e72;

            --primary: #ea580c;
            --primary-2: #fb923c;
            --primary-soft: #ffedd5;
            --primary-text: #ffffff;

            --grad: linear-gradient(135deg, #ea580c 0%, #f59e0b 50%, #facc15 100%);
            --grad-soft: linear-gradient(135deg, #ffedd5 0%, #fef3c7 50%, #fef9c3 100%);
        }
        [data-theme="forest"] {
            --bg: #f0fdf4;
            --bg-soft: #dcfce7;
            --surface: #ffffff;
            --surface-2: #f6fefa;
            --border: #c8e8d3;
            --border-soft: #dff0e5;
            --text: #0e3320;
            --text-2: #2f6347;
            --text-3: #7ba88f;

            --primary: #16a34a;
            --primary-2: #4ade80;
            --primary-soft: #dcfce7;
            --primary-text: #ffffff;

            --grad: linear-gradient(135deg, #16a34a 0%, #22c55e 50%, #84cc16 100%);
            --grad-soft: linear-gradient(135deg, #dcfce7 0%, #ecfccb 50%, #f7fee7 100%);
        }
        [data-theme="lavender"] {
            --bg: #faf5ff;
            --bg-soft: #f3e8ff;
            --surface: #ffffff;
            --surface-2: #fbf7ff;
            --border: #e4d4f5;
            --border-soft: #efe4f8;
            --text: #2e0e4d;
            --text-2: #5b3b85;
            --text-3: #9978c2;

            --primary: #9333ea;
            --primary-2: #c084fc;
            --primary-soft: #f3e8ff;
            --primary-text: #ffffff;

            --grad: linear-gradient(135deg, #9333ea 0%, #c026d3 50%, #ec4899 100%);
            --grad-soft: linear-gradient(135deg, #f3e8ff 0%, #fae8ff 50%, #fce7f3 100%);
        }

        /* ========== 基础 ========== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Inter", sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
        input, select, textarea { font: inherit; color: inherit; }
        img { display: block; max-width: 100%; }
        ::selection { background: var(--primary); color: var(--primary-text); }

        /* 背景柔光（克制、不抢戏） */
        .bg-aura {
            position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
        }
        .bg-aura::before, .bg-aura::after {
            content: ''; position: absolute; border-radius: 50%; filter: blur(110px); opacity: 0.35;
        }
        .bg-aura::before {
            width: 520px; height: 520px; background: var(--primary);
            top: -180px; right: -180px; animation: drift1 22s ease-in-out infinite;
        }
        .bg-aura::after {
            width: 480px; height: 480px; background: var(--primary-2);
            bottom: -180px; left: -180px; animation: drift2 28s ease-in-out infinite;
        }
        [data-theme="dark"] .bg-aura::before,
        [data-theme="dark"] .bg-aura::after { opacity: 0.18; }
        @keyframes drift1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-100px, 60px) scale(1.15); }
        }
        @keyframes drift2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(80px, -50px) scale(1.10); }
        }

        /* ========== 顶部 ========== */
        .topbar {
            position: sticky; top: 0; z-index: 50;
            background: color-mix(in srgb, var(--bg) 85%, transparent);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid var(--border-soft);
        }
        .topbar-inner {
            max-width: 1320px; margin: 0 auto; padding: 14px 24px;
            display: flex; align-items: center; gap: 16px; justify-content: space-between;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-mark {
            width: 38px; height: 38px; border-radius: 12px;
            background: var(--grad);
            display: grid; place-items: center; color: #fff;
            box-shadow: var(--shadow-md);
            position: relative; overflow: hidden;
        }
        .brand-mark::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.4) 50%, transparent 60%);
            transform: translateX(-100%);
            animation: shimmer 4s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%, 60% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .brand-mark svg { width: 20px; height: 20px; position: relative; z-index: 1; }
        .brand-text { display: flex; flex-direction: column; line-height: 1.2; }
        .brand-name { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
        .brand-sub { font-size: 11px; color: var(--text-3); margin-top: 1px; }

        .theme-picker { display: flex; align-items: center; gap: 6px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; box-shadow: var(--shadow-sm); }
        .theme-dot {
            width: 22px; height: 22px; border-radius: 50%;
            border: 2px solid transparent; transition: all 0.2s ease;
            position: relative; cursor: pointer;
        }
        .theme-dot::after {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            background: inherit;
        }
        .theme-dot[data-th="light"] { background: #ffffff; }
        .theme-dot[data-th="dark"] { background: #16161f; }
        .theme-dot[data-th="ocean"] { background: linear-gradient(135deg, #0284c7, #14b8a6); }
        .theme-dot[data-th="sunset"] { background: linear-gradient(135deg, #ea580c, #facc15); }
        .theme-dot[data-th="forest"] { background: linear-gradient(135deg, #16a34a, #84cc16); }
        .theme-dot[data-th="lavender"] { background: linear-gradient(135deg, #9333ea, #ec4899); }
        .theme-dot:hover { transform: scale(1.12); }
        .theme-dot.active { border-color: var(--primary); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--primary); }

        /* ========== 主区 ========== */
        .page { position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; padding: 24px; }
        .hero { margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
        .hero-text h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
        .hero-text p { color: var(--text-2); font-size: 13px; margin-top: 4px; }
        .hero-stats { display: flex; gap: 10px; flex-wrap: wrap; }
        .chip {
            display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
            background: var(--surface); border: 1px solid var(--border); color: var(--text-2);
            font-size: 12px; box-shadow: var(--shadow-sm);
        }
        .chip svg { width: 14px; height: 14px; color: var(--primary); }

        /* ========== 工作台 ========== */
        .workspace {
            display: grid; gap: 20px; align-items: start;
        }
        /* 横屏宽屏：左右两栏 */
        @media (min-width: 1024px) and (orientation: landscape) {
            .workspace { grid-template-columns: 360px 1fr; }
            .col-left { position: sticky; top: 88px; max-height: calc(100vh - 110px); overflow-y: auto; padding-right: 4px; }
            .col-left::-webkit-scrollbar { width: 6px; }
            .col-left::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        }
        /* 竖屏 / 平板：单列 */
        @media (max-width: 1023px), (orientation: portrait) {
            .workspace { grid-template-columns: 1fr; }
        }

        /* ========== 卡片 ========== */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: box-shadow 0.2s ease;
        }
        .card + .card { margin-top: 16px; }
        .card-head {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            padding: 16px 20px; border-bottom: 1px solid var(--border-soft);
        }
        .card-title { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
        .step-num {
            width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center;
            background: var(--primary-soft); color: var(--primary); font-size: 12px; font-weight: 700;
        }
        .badge {
            display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px;
            background: var(--primary-soft); color: var(--primary); font-size: 11px; font-weight: 600;
        }
        .card-body { padding: 20px; }

        /* ========== 上传区 ========== */
        .dropzone {
            position: relative; border: 2px dashed var(--border); border-radius: 14px;
            padding: 36px 20px; text-align: center; cursor: pointer;
            background: var(--surface-2);
            transition: all 0.2s ease;
        }
        .dropzone:hover { border-color: var(--primary); background: var(--primary-soft); }
        .dropzone.dragover { border-color: var(--primary); background: var(--primary-soft); transform: scale(1.01); }
        .drop-icon {
            width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 12px;
            background: var(--primary-soft); color: var(--primary);
            display: grid; place-items: center;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .dropzone:hover .drop-icon { transform: translateY(-4px) rotate(-4deg); }
        .dropzone svg { width: 28px; height: 28px; }
        .drop-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
        .drop-hint { font-size: 12px; color: var(--text-3); }
        .dropzone .ripple-host { position: absolute; inset: 0; border-radius: 14px; overflow: hidden; }

        .img-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-top: 14px; }
        .img-card {
            position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden;
            background: var(--surface-2); border: 2px solid var(--border-soft);
            cursor: pointer; transition: all 0.2s ease;
            animation: cardPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
        }
        .img-card img { width: 100%; height: 100%; object-fit: cover; }
        .img-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .img-card.selected { border-color: var(--primary); box-shadow: var(--ring); }
        .img-card .check {
            position: absolute; top: 6px; left: 6px; width: 22px; height: 22px; border-radius: 50%;
            background: var(--primary); color: var(--primary-text);
            display: grid; place-items: center; font-size: 12px; font-weight: 700;
            opacity: 0; transform: scale(0.5); transition: all 0.2s ease;
        }
        .img-card.selected .check { opacity: 1; transform: scale(1); }
        .img-card .del {
            position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%;
            background: rgba(0,0,0,0.55); color: #fff;
            display: grid; place-items: center; font-size: 14px; line-height: 1;
            opacity: 0; transition: all 0.2s ease;
        }
        .img-card:hover .del { opacity: 1; }
        .img-card .del:hover { background: var(--danger); }
        .img-card .tag {
            position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 8px 6px;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
            color: #fff; font-size: 10px; display: flex; justify-content: space-between;
        }
        @keyframes cardPop {
            from { opacity: 0; transform: scale(0.85) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .list-bar {
            display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center;
        }
        .list-bar .spacer { flex: 1; }
        .btn-text {
            padding: 6px 12px; border-radius: 8px; font-size: 12px; color: var(--text-2);
            transition: all 0.15s ease; position: relative; overflow: hidden;
        }
        .btn-text:hover { background: var(--bg-soft); color: var(--text); }
        .btn-text.danger:hover { background: rgba(239, 68, 68, 0.08); color: var(--danger); }

        /* ========== 功能按钮 ========== */
        .actions-empty {
            padding: 50px 20px; text-align: center; color: var(--text-3);
        }
        .actions-empty svg { width: 80px; height: 80px; margin: 0 auto 16px; opacity: 0.6; }
        .actions-empty .t { font-size: 14px; font-weight: 500; }
        .actions-empty .d { font-size: 12px; margin-top: 4px; }

        .actions-grid {
            display: grid; gap: 10px;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        }
        .action {
            position: relative; padding: 16px 12px; border-radius: 14px;
            background: var(--surface-2); border: 1px solid var(--border-soft);
            text-align: center; cursor: pointer; transition: all 0.2s ease;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            overflow: hidden;
        }
        .action .ico {
            width: 38px; height: 38px; border-radius: 10px;
            background: var(--primary-soft); color: var(--primary);
            display: grid; place-items: center;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .action .ico svg { width: 20px; height: 20px; }
        .action .lbl { font-size: 12.5px; font-weight: 500; color: var(--text); }
        .action:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
            background: var(--surface);
            box-shadow: var(--shadow-md);
        }
        .action:hover .ico { transform: scale(1.10) rotate(-6deg); background: var(--primary); color: var(--primary-text); }
        .action:active { transform: translateY(0) scale(0.98); }
        .action .dot {
            position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%;
            background: var(--success); opacity: 0; transform: scale(0);
            transition: all 0.25s ease;
        }
        .action.applied .dot { opacity: 1; transform: scale(1); animation: pulse 1.6s ease-in-out infinite; }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--success) 50%, transparent); }
            50% { box-shadow: 0 0 0 6px transparent; }
        }

        /* ========== 结果区 ========== */
        .result-grid {
            display: grid; gap: 12px;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        }
        .result {
            border-radius: 12px; overflow: hidden; background: var(--surface-2);
            border: 1px solid var(--border-soft);
            animation: cardPop 0.3s ease backwards;
            transition: transform 0.2s ease;
        }
        .result:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .result img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #f3f4f6; }
        .result .r-info { padding: 10px 12px; }
        .result .r-name { font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .result .r-meta { font-size: 11px; color: var(--text-3); margin-top: 2px; display: flex; justify-content: space-between; align-items: center; }
        .result .r-dl {
            margin-top: 8px; padding: 6px 10px; border-radius: 8px;
            background: var(--primary); color: var(--primary-text);
            font-size: 11px; font-weight: 600; transition: opacity 0.15s ease;
            position: relative; overflow: hidden;
        }
        .result .r-dl:hover { opacity: 0.9; }

        .actions-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
        .btn {
            padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
            transition: all 0.15s ease; position: relative; overflow: hidden;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn svg { width: 14px; height: 14px; }
        .btn-primary { background: var(--primary); color: var(--primary-text); box-shadow: var(--shadow-sm); }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
        .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--bg-soft); }

        /* ========== 弹窗 ========== */
        .modal-bg {
            position: fixed; inset: 0; background: rgba(15, 15, 30, 0.5);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            display: grid; place-items: center;
            z-index: 100; opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease;
            padding: 20px;
        }
        .modal-bg.show { opacity: 1; pointer-events: auto; }
        .modal {
            background: var(--surface); border-radius: 20px;
            width: 100%; max-width: 440px;
            box-shadow: var(--shadow-lg);
            transform: scale(0.95) translateY(8px);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 90vh; overflow-y: auto;
        }
        .modal-bg.show .modal { transform: scale(1) translateY(0); }
        .modal-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 20px; border-bottom: 1px solid var(--border-soft);
        }
        .modal-title { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
        .modal-title .ico {
            width: 32px; height: 32px; border-radius: 10px;
            background: var(--primary-soft); color: var(--primary);
            display: grid; place-items: center;
        }
        .modal-title .ico svg { width: 18px; height: 18px; }
        .modal-close {
            width: 30px; height: 30px; border-radius: 8px;
            display: grid; place-items: center; color: var(--text-2);
            transition: all 0.15s ease;
        }
        .modal-close:hover { background: var(--bg-soft); color: var(--text); }
        .modal-close svg { width: 16px; height: 16px; }
        .modal-body { padding: 20px; }
        .modal-desc { font-size: 13px; color: var(--text-2); margin-bottom: 14px; }
        .modal-scope {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 12px; border-radius: 999px;
            background: var(--primary-soft); color: var(--primary);
            font-size: 12px; font-weight: 600; margin-bottom: 18px;
        }
        .modal-scope svg { width: 13px; height: 13px; }

        .field { margin-bottom: 14px; }
        .field-label {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; font-weight: 600; color: var(--text-2);
            margin-bottom: 6px; letter-spacing: 0.01em;
        }
        .field-label .val { color: var(--primary); font-weight: 700; }
        .field-input {
            width: 100%; padding: 10px 12px; border-radius: 10px;
            background: var(--surface-2); border: 1px solid var(--border);
            color: var(--text); font-size: 13px;
            transition: all 0.15s ease;
        }
        .field-input:hover { border-color: var(--border); }
        .field-input:focus { outline: none; border-color: var(--primary); box-shadow: var(--ring); background: var(--surface); }
        .field-input[type="color"] { padding: 4px; height: 40px; cursor: pointer; }

        .range-row { display: flex; align-items: center; gap: 10px; }
        .range-row input[type="range"] {
            flex: 1; -webkit-appearance: none; appearance: none; height: 6px; border-radius: 3px;
            background: var(--bg-soft); outline: none; padding: 0;
        }
        .range-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 18px; height: 18px; border-radius: 50%;
            background: var(--primary); cursor: pointer; box-shadow: var(--shadow-sm);
            border: 2px solid var(--surface);
            transition: transform 0.15s ease;
        }
        .range-row input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
        .range-row input[type="range"]::-moz-range-thumb {
            width: 18px; height: 18px; border-radius: 50%;
            background: var(--primary); cursor: pointer; box-shadow: var(--shadow-sm);
            border: 2px solid var(--surface);
        }
        .range-val { min-width: 56px; text-align: right; font-size: 12px; font-weight: 600; color: var(--primary); }

        .modal-foot { padding: 0 20px 20px; display: flex; gap: 8px; }
        .modal-foot .btn { flex: 1; justify-content: center; padding: 12px; }

        /* ========== 进度 + Toast ========== */
        .progress {
            position: fixed; top: 0; left: 0; right: 0; height: 3px;
            background: var(--bg-soft); z-index: 200;
            opacity: 0; transition: opacity 0.2s ease;
        }
        .progress.show { opacity: 1; }
        .progress-fill {
            height: 100%; width: 0%; background: var(--grad);
            transition: width 0.3s ease;
            box-shadow: 0 0 12px color-mix(in srgb, var(--primary) 60%, transparent);
        }

        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--surface); color: var(--text);
            padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 500;
            box-shadow: var(--shadow-lg); border: 1px solid var(--border);
            z-index: 300; opacity: 0; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex; align-items: center; gap: 8px;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: color-mix(in srgb, var(--success) 30%, var(--border)); }
        .toast.success::before { content: '✓'; color: var(--success); font-weight: 700; }
        .toast.error { border-color: color-mix(in srgb, var(--danger) 30%, var(--border)); }
        .toast.error::before { content: '✕'; color: var(--danger); font-weight: 700; }

        .loading {
            position: fixed; inset: 0; background: rgba(15, 15, 30, 0.4);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            display: grid; place-items: center; z-index: 150;
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
        }
        .loading.show { opacity: 1; pointer-events: auto; }
        .loading-box {
            background: var(--surface); padding: 24px 32px; border-radius: 16px;
            box-shadow: var(--shadow-lg); text-align: center; min-width: 200px;
        }
        .spinner {
            width: 36px; height: 36px; border-radius: 50%;
            border: 3px solid var(--border); border-top-color: var(--primary);
            margin: 0 auto 12px;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-txt { font-size: 13px; color: var(--text-2); }

        /* ========== 彩纸 ========== */
        .confetti { position: fixed; top: -20px; z-index: 400; pointer-events: none; will-change: transform, opacity; animation: confettiFall linear forwards; }
        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0); opacity: 1; }

        .ripple { position: absolute; border-radius: 50%; pointer-events: none; transform: scale(0); animation: rippleOut 0.55s ease-out forwards; }
        @keyframes rippleOut {

        /* ========== 响应式：手机单栏纵向滚动 ========== */
        @media (max-width: 768px) {

        }

        }

                { name: 'format', label: '输出格式', type: 'select', options: ['png','jpeg','gif','bmp','tiff'], value: 'png' }
            ]},
            { key: 'sepia', label: '复古', icon: 'sepia', desc: '怀旧棕色调', fields: [
                { name: 'format', label: '输出格式', type: 'select', options: ['png','jpeg','gif','bmp','tiff'], value: 'png' }
            ]},
            { key: 'brightness-contrast', label: '亮度对比度', icon: 'brightness', desc: '微调亮度和对比度', fields: [
                { name: 'brightness', label: '亮度', type: 'range', min: -1, max: 1, step: 0.05, value: 0.1, show: v => v.toFixed(2) },
                { name: 'contrast', label: '对比度', type: 'range', min: -1, max: 1, step: 0.05, value: 0.1, show: v => v.toFixed(2) },
                { name: 'format', label: '输出格式', type: 'select', options: ['png','jpeg','gif','bmp','tiff'], value: 'png' }
            ]},
            { key: 'blur', label: '模糊', icon: 'blur', desc: '高斯模糊', fields: [
                { name: 'radius', label: '模糊半径', type: 'range', min: 1, max: 30, step: 1, value: 5, show: v => v + 'px' },
                { name: 'format', label: '输出格式', type: 'select', options: ['png','jpeg','gif','bmp','tiff'], value: 'png' }
            ]},
            { key: 'sharpen', label: '锐化', icon: 'sharpen', desc: '让图片更清晰', fields: [
                { name: 'format', label: '输出格式', type: 'select', options: ['png','jpeg','gif','bmp','tiff'], value: 'png' }
            ]},
            { key: 'pixelate', label: '像素化', icon: 'pixelate', desc: '马赛克效果', fields: [
                { name: 'pixelSize', label: '像素大小', type: 'range', min: 2, max: 40, step: 1, value: 10, show: v => v + 'px' },
                { name: 'format', label: '输出格式', type: 'select', options: ['png','jpeg','gif','bmp','tiff'], value: 'png' }
            ]},
            { key: 'vignette', label: '暗角', icon: 'vignette', desc: '四周变暗', fields: [
                { name: 'strength', label: '强度', type: 'range', min: 0.1, max: 1, step: 0.05, value: 0.5, show: v => v.toFixed(2) },
                { name: 'format', label: '输出格式', type: 'select', options: ['png','jpeg','gif','bmp','tiff'], value: 'png' }
            ]},
            { key: 'border', label: '加边框', icon: 'border', desc: '给图片加一圈边', fields: [
                { name: 'width', label: '边框宽度', type: 'range', min: 1, max: 50, step: 1, value: 10, show: v => v + 'px' },
                { name: 'color', label: '边框颜色', type: 'color', value: '#000000' },
                { name: 'format', label: '输出格式', type: 'select', options: ['png','jpeg','gif','bmp','tiff'], value: 'png' }
            ]},
            { key: 'round-corners', label: '圆角', icon: 'round', desc: '把图片四角变圆', fields: [
                { name: 'radius', label: '圆角半径', type: 'range', min: 1, max: 200, step: 1, value: 30, show: v => v + 'px' },
                { name: 'format', label: '输出格式', type: 'select', options: ['png','jpeg','gif','bmp','tiff'], value: 'png' }
            ]},
            { key: 'thumbnail', label: '缩略图', icon: 'thumbnail', desc: '生成小尺寸缩略图', fields: [
                { name: 'maxSize', label: '最大边长', type: 'range', min: 32, max: 500, step: 8, value: 128, show: v => v + 'px' },
                { name: 'format', label: '输出格式', type: 'select', options: ['png','jpeg','gif','bmp','tiff'], value: 'png' }
            ]},
            { key: 'watermark-text', label: '文字水印', icon: 'watermark', desc: '在图片上加文字', fields: [
                { name: 'text', label: '水印文字', type: 'text', value: '水印', placeholder: '输入文字' },
                { name: 'position', label: '位置', type: 'select', options: ['center','top-left','top-right','bottom-left','bottom-right'], value: 'center' },
                { name: 'fontSize', label: '字号', type: 'range', min: 12, max: 120, step: 2, value: 32, show: v => v + 'px' },
                { name: 'color', label: '颜色', type: 'color', value: '#ffffff' },
                { name: 'alpha', label: '透明度', type: 'range', min: 0.1, max: 1, step: 0.05, value: 0.8, show: v => v.toFixed(2) },
                { name: 'format', label: '输出格式', type: 'select', options: ['png','jpeg','gif','bmp','tiff'], value: 'png' }
            ]},
            { key: 'ascii', label: '字符画', icon: 'ascii', desc: '把图片转成 ASCII 字符画', fields: [
                { name: 'width', label: '宽度 (字符数)', type: 'range', min: 40, max: 200, step: 10, value: 100, show: v => v + ' 字符' }
            ]},
            { key: 'base64', label: 'Base64', icon: 'base64', desc: '把图片转成 Base64 字符串', fields: [
                { name: 'format', label: '输出格式', type: 'select', options: ['png','jpeg','gif','bmp','tiff'], value: 'png' }
            ]}
        ];

        /* ============ 状态 ============ */
        let images = [];
        let results = [];
        let nextId = 1;
        let currentAction = null;

        const $ = id => document.getElementById(id);
        const uploadZone = $('uploadZone');
        const fileInput = $('fileInput');
        const imgList = $('imgList');
        const imgCount = $('imgCount');
        const listToolbar = $('listToolbar');
        const actionsGrid = $('actionsGrid');
        const actionsEmpty = $('actionsEmpty');
        const actionsHint = $('actionsHint');
        const resultPanel = $('resultPanel');
        const resultList = $('resultList');
        const resultCount = $('resultCount');
        const modalBg = $('modalBg');
        const modalIco = $('modalIco');
        const modalTitleText = $('modalTitleText');
        const modalDesc = $('modalDesc');
        const modalScopeText = $('modalScopeText');
        const modalFields = $('modalFields');
        const progressTrack = $('progressTrack');
        const progressFill = $('progressFill');
        const toast = $('toast');
        const loading = $('loading');
        const loadingText = $('loadingText');

        /* ============ 工具函数 ============ */
        function showToast(msg, type) {
            toast.textContent = msg;
            toast.className = 'toast show' + (type ? ' ' + type : '');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => toast.classList.remove('show'), 2500);
        }
        function showLoading(t) { loadingText.textContent = t || '处理中…'; loading.classList.add('show'); }
        function hideLoading() { loading.classList.remove('show'); }
        function showProgress(p) { progressTrack.classList.add('show'); progressFill.style.width = (p * 100) + '%'; }
        function hideProgress() { progressTrack.classList.remove('show'); progressFill.style.width = '0%'; }
        function humanSize(b) {
            if (b < 1024) return b + ' B';
            if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
            return (b / 1024 / 1024).toFixed(2) + ' MB';
        }
        function makeRipple(e) {
            const target = e.currentTarget;
            const rect = target.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = (e.clientX || 0) - rect.left - size / 2;
            const y = (e.clientY || 0) - rect.top - size / 2;
            const r = document.createElement('span');
            r.className = 'ripple';
            r.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px;background:var(--primary);`;
            target.appendChild(r);
            setTimeout(() => r.remove(), 600);
        }

        function launchConfetti() {
            const colors = ['#6366f1','#ec4899','#06b6d4','#f59e0b','#10b981','#a855f7'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const c = document.createElement('div');
                    c.className = 'confetti';
                    const size = 6 + Math.random() * 6;
                    c.style.cssText = `left:${Math.random()*100}vw;width:${size}px;height:${size}px;background:${colors[i%colors.length]};animation-duration:${2+Math.random()*1.5}s;border-radius:${Math.random()>0.5?'50%':'2px'};`;
                    document.body.appendChild(c);
                    setTimeout(() => c.remove(), 3500);
                }, i * 30);
            }
        }

        /* ============ 主题 ============ */
        const THEMES = ['light','dark','ocean','sunset','forest','lavender'];
        function applyTheme(th) {
            if (!THEMES.includes(th)) th = 'light';
            document.documentElement.dataset.theme = th;
            document.querySelectorAll('.theme-dot').forEach(d => d.classList.toggle('active', d.dataset.th === th));
            try { localStorage.setItem('imgc-theme', th); } catch(e) {}
        }
        function initTheme() {
            let saved = 'light';
            try { saved = localStorage.getItem('imgc-theme') || 'light'; } catch(e) {}
            applyTheme(saved);
        }
        $('themePicker').addEventListener('click', e => {
            const dot = e.target.closest('.theme-dot');
            if (dot) applyTheme(dot.dataset.th);
        });
        initTheme();

        /* ============ 功能按钮渲染 ============ */
        function renderActions() {
            actionsGrid.innerHTML = '';
            ACTIONS.forEach(a => {
                const btn = document.createElement('button');
                btn.className = 'action';
                btn.dataset.key = a.key;
                btn.innerHTML = `<span class="dot"></span><span class="ico">${ICON[a.icon]||''}</span><span class="lbl">${a.label}</span>`;
                btn.addEventListener('click', e => { makeRipple(e); openModal(a); });
                actionsGrid.appendChild(btn);
            });
        }

        /* ============ 上传 ============ */
        uploadZone.addEventListener('click', e => {
            // 仅当点击 dropzone 自身或子节点才触发；事件冒泡到 ripple-host 也算
            if (e.target.closest('input')) return;
            makeRipple(e);
            fileInput.click();
        });
        fileInput.addEventListener('change', e => {
            Array.from(e.target.files).forEach(f => addImage(f));
            fileInput.value = '';
        });
        ['dragover','dragenter'].forEach(ev => uploadZone.addEventListener(ev, e => { e.preventDefault(); uploadZone.classList.add('dragover'); }));
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
        uploadZone.addEventListener('drop', e => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/')).forEach(f => addImage(f));
        });

        function addImage(file) {
            if (!file.type.startsWith('image/')) { showToast('不是图片: ' + file.name, 'error'); return; }
            const id = nextId++;
            const url = URL.createObjectURL(file);
            images.push({ id, file, url, selected: true });
            renderImageList();
            actionsEmpty.style.display = 'none';
            actionsGrid.style.display = 'grid';
            const sel = images.filter(i => i.selected).length;
            actionsHint.textContent = sel + ' 张已选';
            resultPanel.style.display = 'none';
        }

        function renderImageList() {
            imgList.innerHTML = '';
            const selectedCount = images.filter(i => i.selected).length;
            images.forEach((img, i) => {
                const div = document.createElement('div');
                div.className = 'img-card' + (img.selected ? ' selected' : '');
                div.style.animationDelay = (i * 0.04) + 's';
                div.innerHTML =
                    '<img src="' + img.url + '" alt="">' +
                    '<div class="check">✓</div>' +
                    '<button class="del" data-id="' + img.id + '" aria-label="删除">×</button>' +
                    '<div class="tag"><span>' + (img.file.type.split('/')[1] || 'IMG').toUpperCase() + '</span><span>' + humanSize(img.file.size) + '</span></div>';
                div.addEventListener('click', e => {
                    if (e.target.classList.contains('del')) return;
                    img.selected = !img.selected;
                    renderImageList();
                });
                imgList.appendChild(div);
            });
            const count = images.length;
            imgCount.textContent = count + ' 张';
            imgCount.style.display = count > 0 ? '' : 'none';
            listToolbar.style.display = count > 0 ? 'flex' : 'none';
            actionsHint.textContent = selectedCount + ' 张已选';
            if (count === 0) {
                actionsEmpty.style.display = '';
                actionsGrid.style.display = 'none';
                resultPanel.style.display = 'none';
            }
        }

        imgList.addEventListener('click', e => {
            if (e.target.classList.contains('del')) {
                e.stopPropagation();
                const id = parseInt(e.target.dataset.id);
                const idx = images.findIndex(i => i.id === id);
                if (idx >= 0) { URL.revokeObjectURL(images[idx].url); images.splice(idx, 1); renderImageList(); }
            }
        });

        $('btnSelectAll').addEventListener('click', e => { makeRipple(e); images.forEach(i => i.selected = true); renderImageList(); });
        $('btnSelectNone').addEventListener('click', e => { makeRipple(e); images.forEach(i => i.selected = false); renderImageList(); });
        $('btnClearAll').addEventListener('click', e => {
            makeRipple(e);
            images.forEach(i => URL.revokeObjectURL(i.url));
            images = []; renderImageList();
        });

        /* ============ 弹窗 ============ */
        function openModal(action) {
            const selected = images.filter(i => i.selected);
            if (selected.length === 0) { showToast('请先选择至少一张图片', 'error'); return; }
            currentAction = action;
            modalIco.innerHTML = ICON[action.icon] || '';
            modalTitleText.textContent = action.label;
            modalDesc.textContent = action.desc;
            modalScopeText.textContent = '将应用到 ' + selected.length + ' 张图片' + (selected.length > 1 ? ' · 批量' : '');
            modalFields.innerHTML = '';
            action.fields.forEach(field => {
                const wrap = document.createElement('div');
                wrap.className = 'field';
                const label = document.createElement('label');
                label.className = 'field-label';
                label.innerHTML = '<span>' + field.label + '</span><span class="val" data-val></span>';
                wrap.appendChild(label);

                if (field.type === 'select') {
                    const sel = document.createElement('select');
                    sel.className = 'field-input';
                    sel.dataset.field = field.name;
                    field.options.forEach(o => {
                        const opt = document.createElement('option');
                        opt.value = o; opt.textContent = o;
                        if (o === field.value) opt.selected = true;
                        sel.appendChild(opt);
                    });
                    wrap.appendChild(sel);
                    label.querySelector('[data-val]').textContent = field.value;
                    sel.addEventListener('change', () => label.querySelector('[data-val]').textContent = sel.value);
                } else if (field.type === 'range') {
                    const row = document.createElement('div'); row.className = 'range-row';
                    const inp = document.createElement('input');
                    inp.type = 'range'; inp.min = field.min; inp.max = field.max; inp.step = field.step; inp.value = field.value;
                    inp.dataset.field = field.name;
                    const valEl = label.querySelector('[data-val]');
                    valEl.textContent = field.show ? field.show(parseFloat(field.value)) : field.value;
                    inp.addEventListener('input', () => valEl.textContent = field.show ? field.show(parseFloat(inp.value)) : inp.value);
                    row.appendChild(inp);
                    wrap.appendChild(row);
                } else if (field.type === 'color') {
                    const inp = document.createElement('input');
                    inp.type = 'color'; inp.className = 'field-input'; inp.value = field.value; inp.dataset.field = field.name;
                    wrap.appendChild(inp);
                    label.querySelector('[data-val]').textContent = field.value;
                    inp.addEventListener('input', () => label.querySelector('[data-val]').textContent = inp.value);
                } else {
                    const inp = document.createElement('input');
                    inp.type = field.type; inp.className = 'field-input'; inp.value = field.value; inp.dataset.field = field.name;
                    if (field.placeholder) inp.placeholder = field.placeholder;
                    if (field.min !== undefined) inp.min = field.min;
                    if (field.max !== undefined) inp.max = field.max;
                    wrap.appendChild(inp);
                    label.querySelector('[data-val]').textContent = field.value;
                    inp.addEventListener('input', () => label.querySelector('[data-val]').textContent = inp.value);
                }
                modalFields.appendChild(wrap);
            });
            modalBg.classList.add('show');
        }
        $('modalClose').addEventListener('click', closeModal);
        $('modalCancel').addEventListener('click', closeModal);
        modalBg.addEventListener('click', e => { if (e.target === modalBg) closeModal(); });
        function closeModal() { modalBg.classList.remove('show'); }

        /* ============ 提交处理 ============ */
        $('modalSubmit').addEventListener('click', async e => {
            makeRipple(e);
            const selected = images.filter(i => i.selected);
            if (selected.length === 0 || !currentAction) return;
            const params = {};
            modalFields.querySelectorAll('input, select').forEach(inp => {
                const n = inp.dataset.field; if (!n) return;
                let v = inp.value;
                if (inp.type === 'range' || inp.type === 'number') v = parseFloat(v);
                if (inp.type === 'color') v = v.replace('#', '');
                params[n] = v;
            });
            closeModal();
            results = []; resultList.innerHTML = '';
            const multi = selected.length > 1;
            if (multi) { showProgress(0); showLoading('处理中 (0/' + selected.length + ')'); }
            else { showLoading('处理中…'); }
            try {
                for (let i = 0; i < selected.length; i++) {
                    const img = selected[i];
                    loadingText.textContent = '处理 (' + (i + 1) + '/' + selected.length + '): ' + img.file.name;
                    const r = await callApi(currentAction.key, params, img.file);
                    results.push(r);
                    if (multi) showProgress((i + 1) / selected.length);
                }
                hideLoading(); hideProgress();
                showResults();
                launchConfetti();
                showToast('处理完成！', 'success');
                document.querySelectorAll('.action').forEach(b => b.classList.remove('applied'));
                const idx = ACTIONS.findIndex(a => a.key === currentAction.key);
                if (idx >= 0) {
                    const btns = actionsGrid.querySelectorAll('.action');
                    if (btns[idx]) btns[idx].classList.add('applied');
                }
            } catch (err) {
                hideLoading(); hideProgress();
                showToast('处理失败: ' + (err.message || err), 'error');
                console.error(err);
            }
        });

        async function callApi(key, params, file) {
            const fd = new FormData();
            fd.append('file', file);
            Object.entries(params).forEach(([k, v]) => fd.append(k, v));
            const resp = await fetch('/api/' + key, { method: 'POST', body: fd });
            if (!resp.ok) { const t = await resp.text(); throw new Error('HTTP ' + resp.status + ': ' + t.substring(0, 200)); }
            const ct = resp.headers.get('Content-Type') || '';
            const cd = resp.headers.get('Content-Disposition') || '';
            const m = cd.match(/filename="?([^"]+)"?/);
            const base = (file.name || 'image').replace(/\.[^.]+$/, '');
            const ext = params.format || 'png';
            if (ct.includes('text/plain')) {
                const text = await resp.text();
                return { name: base + '-ascii.txt', blob: new Blob([text], { type: 'text/plain' }), isText: true, text };
            } else if (ct.includes('application/json')) {
                const j = await resp.json();
                return { name: base + '.json', blob: new Blob([JSON.stringify(j, null, 2)], { type: 'application/json' }), isText: true, text: j.base64 || JSON.stringify(j), dataUri: j.dataUri };
            } else {
                const blob = await resp.blob();
                const name = m ? m[1] : (base + '-converted.' + ext);
                return { name, blob, isText: false };
            }
        }

        function showResults() {
            resultPanel.style.display = '';
            resultCount.textContent = results.length + ' 张';
            resultList.innerHTML = '';
            results.forEach((r, idx) => {
                const url = URL.createObjectURL(r.blob); r.url = url;
                const card = document.createElement('div');
                card.className = 'result';
                card.style.animationDelay = (idx * 0.06) + 's';
                if (r.isText) {
                    if (r.dataUri) {
                        card.innerHTML = '<img src="' + r.dataUri + '"><div class="r-info"><div class="r-name">' + r.name + '</div><div class="r-meta"><span>图片预览</span></div><button class="r-dl" data-idx="' + idx + '">下载</button></div>';
                    } else {
                        card.style.gridColumn = '1 / -1';
                        card.innerHTML = '<div class="r-info" style="padding:16px"><div class="r-name">' + r.name + '</div><div style="font-family:monospace;font-size:11px;background:var(--bg-soft);padding:10px;border-radius:8px;margin-top:8px;max-height:200px;overflow:auto;white-space:pre-wrap;">' + (r.text || '').substring(0, 5000) + (r.text && r.text.length > 5000 ? '\n...(已截断)' : '') + '</div><button class="r-dl" data-idx="' + idx + '" style="margin-top:10px">下载</button></div>';
                    }
                } else {
                    card.innerHTML = '<img src="' + url + '"><div class="r-info"><div class="r-name">' + r.name + '</div><div class="r-meta"><span>' + humanSize(r.blob.size) + '</span></div><button class="r-dl" data-idx="' + idx + '">下载</button></div>';
                }
                resultList.appendChild(card);
            });
        }

        resultList.addEventListener('click', e => {
            if (e.target.classList.contains('r-dl')) {
                makeRipple(e);
                const r = results[parseInt(e.target.dataset.idx)];
                if (!r) return;
                const a = document.createElement('a');
                a.href = r.url; a.download = r.name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
                showToast('已下载: ' + r.name, 'success');
            }
        });

        $('btnDownloadAll').addEventListener('click', async e => {
            makeRipple(e);
            if (results.length === 0) return;
            for (const r of results) {
                const a = document.createElement('a');
                a.href = r.url; a.download = r.name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
                await new Promise(res => setTimeout(res, 200));
            }
            showToast('已下载 ' + results.length + ' 个文件', 'success');
        });
        $('btnAgain').addEventListener('click', e => { makeRipple(e); resultPanel.style.display = 'none'; });

        renderActions();
    </script>
</body>
</html>
